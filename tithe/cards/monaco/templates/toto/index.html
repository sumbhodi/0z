<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>toto</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020c14">
  <link rel="apple-touch-icon" href="icons/home.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
/* ── toto.css — shared chrome for all toto skins ── */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --fs-body:  28px;
  --fs-label: 20px;
  --fs-tab:   18px;
  --fs-title: 30px;
  --r-md: 8px;
  --chat-bg: #020c14;
  --border: rgba(255,255,255,0.12);
  --green-dolphin: #7EFFD4;
}

html, body {
  margin: 0; padding: 0;
  height: 100%; overflow: hidden;
  background: #080808;
  font-family: system-ui, -apple-system, sans-serif;
  color: #e8e8e8;
}

.toto-btn {
  background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12);
  font-size: 17px; cursor: pointer;
  width: 34px; height: 34px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
  transition: background 0.15s, border-color 0.15s;
}
.toto-btn:hover { background: rgba(40,40,40,0.8); border-color: rgba(255,255,255,0.25); }
.toto-collapsed > :not(.ph) { display: none !important; }
.toto-collapsed { height: auto !important; min-height: 0 !important; flex-grow: 0 !important; flex-shrink: 0 !important; }
.toto-exec-summary { border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }

#skin-mount { position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column; padding-top: calc(env(safe-area-inset-top, 0px) + 28px); }
.ph { min-width: 260px; }

#sg-backdrop { display: none; position: fixed; inset: 0; z-index: 199; }

#settings-drawer {
  position: fixed; top: 0; right: 0;
  width: 340px; max-height: 100vh;
  background: #161616;
  border-left: 1px solid rgba(255,255,255,0.1);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.22s ease;
  z-index: 200;
}
#settings-drawer.open { transform: translateX(0); }
#settings-inner { padding: 16px; }

.sg-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 8px; }
.sg-tab {
  flex: 1; padding: 8px 0; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04); color: #aaa;
  border-radius: 5px; cursor: pointer; font-size: var(--fs-tab);
  font-family: inherit; letter-spacing: 0.04em;
  transition: background 0.15s, color 0.15s;
}
.sg-tab:hover { background: rgba(255,255,255,0.09); color: #ddd; }
.sg-tab.active { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.22); }

.sg-section-label {
  font-size: var(--fs-tab); color: #d0d0d0;
  text-transform: uppercase; letter-spacing: 0.1em;
  margin: 4px 0 12px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.sg-section { border: none; padding: 0; margin: 0; }
.sg-section > summary.sg-section-label { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.sg-section > summary.sg-section-label::after { content: '▾'; font-size: 12px; color: #888; transition: transform 0.15s; }
.sg-section:not([open]) > summary.sg-section-label::after { transform: rotate(-90deg); }

.sg-row-inline { flex-direction: row; gap: 10px; }
.sg-row-inline > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.sg-row-inline input { width: 100%; }

.sg-row { display: flex; flex-direction: column; margin-bottom: 14px; gap: 5px; }
.sg-row label { font-size: var(--fs-tab); color: #b8b8b8; text-transform: uppercase; letter-spacing: 0.06em; }
.sg-row input, .sg-row select, .sg-row textarea {
  background: #222; border: 1px solid rgba(255,255,255,0.12);
  color: #e8e8e8; border-radius: 5px;
  padding: 7px 10px; font-size: var(--fs-label);
  font-family: inherit; outline: none; width: 100%;
}
.sg-row textarea { resize: vertical; min-height: 60px; }
.sg-row input:focus, .sg-row select:focus, .sg-row textarea:focus { border-color: rgba(255,255,255,0.3); }
.sg-hint { font-size: 15px; color: #888; }
.sg-sep { border-top: 1px solid rgba(255,255,255,0.06); margin: 10px 0; }
.sg-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.sg-preset { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #bbb; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: var(--fs-tab); }
.sg-preset:hover { background: rgba(255,255,255,0.12); color: #fff; }
.sg-discover { background: none; border: none; color: #999; cursor: pointer; font-size: 14px; margin-left: 6px; }
.sg-discover:hover { color: #ddd; }
.sg-btn-danger { background: rgba(180,40,40,0.25); border: 1px solid rgba(200,60,60,0.4); color: rgba(255,120,120,0.8); border-radius: 5px; padding: 7px 16px; cursor: pointer; font-size: var(--fs-label); }
.sg-btn-danger:hover { background: rgba(200,50,50,0.4); }

.sg-byok { margin: 0 0 4px; border-radius: 6px; overflow: hidden; }
.sg-byok-title { list-style: none; cursor: pointer; padding: 10px 12px; font-size: var(--fs-tab); color: #ccc; background: rgba(255,255,255,0.05); border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 6px; user-select: none; }
.sg-byok-title:hover { background: rgba(255,255,255,0.09); color: #eee; }
.sg-byok-hint { font-size: 13px; color: #aaa; font-weight: 400; }
.sg-byok-body { padding: 10px 4px 4px; }

.sg-tutorial { margin-bottom: 12px; }
.sg-tutorial-title { list-style: none; cursor: pointer; font-size: var(--fs-tab); color: #c0c0c0; padding: 6px 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.03); user-select: none; }
.sg-tutorial-title:hover { color: #e0e0e0; }
.sg-tutorial-body { padding: 10px 12px; font-size: var(--fs-tab); color: #b5b5b5; line-height: 1.7; }
.sg-tutorial-body ol { margin: 8px 0 8px 18px; padding: 0; }
.sg-tutorial-body li { margin-bottom: 4px; }
.sg-tutorial-body strong { color: #ddd; }
.sg-tutorial-body p { margin: 6px 0; }

.sg-byok-providers { display: flex; flex-direction: column; gap: 8px; }
.sg-byok-row { display: flex; align-items: center; gap: 8px; }
.sg-byok-name { font-size: var(--fs-tab); color: #bbb; width: 90px; flex-shrink: 0; }
.sg-byok-link { font-size: 13px; color: #78b4ff; text-decoration: none; flex-shrink: 0; white-space: nowrap; }
.sg-byok-link:hover { color: #8cd2ff; text-decoration: underline; }
.sg-byok-input { flex: 1; background: #222; border: 1px solid rgba(255,255,255,0.1); color: #e8e8e8; border-radius: 5px; padding: 5px 8px; font-size: var(--fs-tab); font-family: monospace; min-width: 0; }
.sg-byok-input:focus { border-color: rgba(255,255,255,0.3); outline: none; }

.sg-file-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.sg-file-item { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); border-radius: 4px; padding: 5px 8px; border: 1px solid rgba(255,255,255,0.07); }
.sg-file-name { flex: 1; font-size: var(--fs-tab); color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-file-size { font-size: 13px; color: #888; flex-shrink: 0; }
.sg-file-remove { background: none; border: none; color: #e06060; cursor: pointer; font-size: 14px; padding: 0 2px; flex-shrink: 0; }
.sg-file-remove:hover { color: #ff6060; }
.sg-file-budget { font-size: 13px; color: #888; margin-bottom: 4px; }
.sg-file-error { background: rgba(200,50,50,0.15); border: 1px solid rgba(200,50,50,0.3); border-radius: 5px; padding: 8px 10px; margin-bottom: 8px; font-size: var(--fs-tab); color: rgba(255,160,140,0.9); line-height: 1.5; }

.coder-jewels { display: flex; gap: 5px; align-items: center; flex-shrink: 0; margin-left: 4px; }
.coder-jewel  { width: 11px; height: 11px; border-radius: 50%; transition: all 0.3s; }
.cj-g { background: radial-gradient(circle at 35% 35%, #AAFFAA, #00BB44); border: 1px solid #00CC44; box-shadow: 0 0 8px #00CC44; }
.cj-a { background: radial-gradient(circle at 35% 35%, #4A3810, #281E08); border: 1px solid #6A4A10; }
.cj-r { background: radial-gradient(circle at 35% 35%, #4A1A1A, #280A0A); border: 1px solid #6A1A1A; }
.cj-g.lit { background: radial-gradient(circle at 35% 35%, #AAFFAA, #00BB44); border-color: #00CC44; box-shadow: 0 0 8px #00CC44; }
.cj-a.lit { background: radial-gradient(circle at 35% 35%, #FFE090, #FF9900); border-color: #FF9900; box-shadow: 0 0 8px #FF9900; }
.cj-r.lit { background: radial-gradient(circle at 35% 35%, #FF9090, #DD2200); border-color: #CC2200; box-shadow: 0 0 8px #CC2200; }
@keyframes cj-blink { 0%,45%{opacity:1} 55%,100%{opacity:0.15} }
.coder-jewel.blinking { animation: cj-blink 0.9s step-end infinite; }

.csw-wrap { position: relative; flex-shrink: 0; cursor: pointer; min-width: 30px; min-height: 30px; display: flex; align-items: center; justify-content: center; }
.csw-housing { width: 22px; height: 24px; background: linear-gradient(180deg, #1A1A14 0%, #2E2E24 100%); border-radius: 3px; border: 1px solid #0A0A08; box-shadow: inset 0 2px 4px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px; overflow: hidden; }
.csw-lever { width: 10px; height: 14px; background: linear-gradient(180deg, #C8C0A0 0%, #A09880 50%, #787060 100%); border-radius: 2px 2px 1px 1px; border: 1px solid #686050; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 1px 3px rgba(0,0,0,0.6); transform: translateY(0px); transform-origin: bottom center; transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.4, 1); }
.csw-lever.on { transform: translateY(-10px); }

.skin-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.skin-out  { min-height: 0; overflow-y: auto; }
.skin-kbd  { flex: 1 0 auto; }

.ph-row1 { min-height: 44px; display: flex; align-items: center; padding: 0 6px; gap: 6px; }
.ph-title { font-size: var(--fs-title); font-weight: 700; flex: 1; white-space: nowrap; }
.ph-status { font-size: var(--fs-tab); color: #aaa; }

.oz-msg { word-wrap: break-word; font-size: var(--fs-body); line-height: 1.7; }
.oz-msg-u::before   { content: '~ '; color: #666; }
.oz-msg-bot::before { content: '= '; color: #666; }

.bot-input { flex: 1; min-height: calc(3em + 12px); align-self: stretch; background: transparent; border: none; outline: none; color: inherit; resize: none; overflow-y: auto; font-size: var(--fs-body); font-family: inherit; line-height: 1.5; padding: 8px 12px; }
.bot-send { font-family: 'Bebas Neue', ui-monospace, monospace; font-size: var(--fs-label); letter-spacing: 0.08em; border: none; cursor: pointer; padding: 0 18px; min-width: 30px; min-height: 30px; }
.bot-stop { font-size: var(--fs-label); border: none; cursor: pointer; padding: 4px 10px; border-radius: 4px; background: rgba(200,60,60,0.2); color: rgba(255,120,120,0.8); min-width: 30px; min-height: 30px; }

.powered-off .pb { opacity: 0.35; pointer-events: none; }

@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

<div id="skin-mount"></div>
<div id="settings-drawer"></div>

<script src="models.js"></script>
<script src="chat.js"></script>
<script src="settings.js"></script>
<script>
  window._totoClip = '';
  settings.init();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
</script>
</body>
</html>
