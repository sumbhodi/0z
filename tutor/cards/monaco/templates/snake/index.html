<!DOCTYPE html>
<!-- snake/index.html — the phone FRAME. it runs the game (game.html) inside an <iframe>, which gives the
     game its OWN phone-sized viewport (so its 100vh/100vw/% size to the phone, not the window — that's what
     makes the d-pad sit right). a portrait 9:19.5 handheld + a zoom slider to scale the whole phone to your
     screen. ported from the A2 snek-frame; the A2 nav + side-buttons were dropped, the zoom is inline now. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐍 snek</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif; }

  /* top-aligned so the TOP of the phone is always visible in the preview (zoom for the rest).
     padding-top clears the FIXED zoom bar so the phone never starts underneath it. */
  #stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; padding: 44px 12px 12px; overflow: hidden; }

  /* #wrap is what ZOOMS — the phone scales, the zoom bar (outside it) stays put */
  #wrap { display: flex; align-items: center; justify-content: center; zoom: var(--zoom, 1); }

  /* ── the portrait phone — 9:19.5 ≈ iPhone portrait ──
     FIXED size (px, not vh/vw) so it does NOT resize with the preview window — the zoom slider
     (#wrap's --zoom) is the ONLY thing that scales it. */
  .handheld {
    width: 270px;
    aspect-ratio: 9 / 17;   /* shorter on Y — the fixed small d-pad lets the phone reclaim the middle gap (= 510px) */
    border-radius: 2.4rem;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 0 8px #1a1a1a, 0 0 0 10px #111, 0 24px 64px rgba(0,0,0,.8);
  }
  .handheld iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ── zoom bar — scales the phone; PINNED to the top of the preview (fixed) so the phone, even
     zoomed to 200%, can never cover it ── */
  #zoom-bar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 100;
    display: flex; align-items: center; gap: 10px; color: #FFD700; font-size: 12px; letter-spacing: .04em;
    background: rgba(10,10,10,.82); padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255,215,0,.3); }
  #zoom-bar input { width: 200px; accent-color: #FFD700; }
  #zoom-val { width: 42px; text-align: right; }
</style>
</head>
<body>
  <div id="stage">
    <div id="zoom-bar">🔍 zoom <input id="zoom" type="range" min="0.5" max="5" step="0.05" value="1"><span id="zoom-val">100%</span></div>
    <div id="wrap">
      <div class="handheld">
        <iframe id="snek-iframe" src="game.html" loading="lazy"></iframe>
      </div>
    </div>
  </div>

  <script>
    // zoom — scale the whole phone (the #wrap zoom var) to fit the screen
    var z = document.getElementById('zoom'), zv = document.getElementById('zoom-val')
    z.addEventListener('input', function () {
      document.documentElement.style.setProperty('--zoom', z.value)
      zv.textContent = Math.round(z.value * 100) + '%'
    })
    // arrow keys + space drive the game, not the browser scroll
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault()
    }, { passive: false })
  </script>
  <script src="snek-state.js"></script>
</body>
</html>
