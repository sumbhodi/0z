<style>
  html,body{margin:0;padding:0;height:100%;background:#14110d;overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#e7d6b3;}

  /* 3 Sep 2026 — portrait: the bench lives in the top band (44px), compact, one row; the desk offsets it past its buttons */

     the bench PANS sideways in the band, no scrollbar, every button its full size. */

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="pause" aria-label="Pause">⏸</button>
<div id="bench">
  <button id="saveB">💾 save</button>
  <button id="loadB">📂 load</button>
  <button id="hofB">🏆 fame</button>
  <button id="restartB">↻ restart</button>
</div>
<div id="slots"></div>
<div id="hint"></div>
<script>
"use strict";
// ════════════════════════════════════════════════════════════════════════════
//  BUTCHER BLOCK MAKER — the drop is tetris; the PRODUCT is the block.
//  every finished row — bottom or middle — never vanishes: it shifts DOWN into
//  an endless strip of glued-up butcher block growing under the board. pause
//  (or the game's end) and SCROLL to admire the whole thing.
// ════════════════════════════════════════════════════════════════════════════
const COLS=10, ROWS=20;
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let DPR=1, cell=24, ox=0, oy=0, W=0, H=0;
let PORTRAIT=false, TOP=0;   // 3 Sep 2026 — portrait: the HUD is a strip across the top (TOP px), the board takes the full width

// ── the seven species — one wood per SHAPE. beige country: tans, creams and
// light grays only (no reds, no dark browns), warm/cool alternated so the
// seven still tell apart at a glance.
// I white pine · O barnwood · T oak · S maple · Z ash · J mushroom · L birch
const WOOD =["#ecdfc2","#8a8678","#b89a6a","#d6bd8e","#b3ada0","#9c8c70","#cfc6ae"];
const WOODNAME=["white pine","barnwood","oak","maple","ash","mushroom","birch"];

// tetromino rotation states — [x,y] offsets in a 4x4 box
const SHAPES=[
  [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
  [[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
  [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
  [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
  [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
  [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
  [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
];

// ── state ───────────────────────────────────────────────────────────────────
// grid cells hold a PIECE ID (or -1), never a bare type: the id is how two
// touching pieces of the same species still show a glue seam, and how one
// piece reads as ONE SOLID SLAB. pieces[id] = its species/type.
let grid, cur, nextType, score, lines, level, dropTimer, dropInterval, lastTs;
let state="start";                // start | play | pause | over
let pieces=[];                    // pieces[id] = type. grows for the whole build.
let blockRows=[];                 // THE BLOCK — rows below the board. [0] adjoins the board.
let scrollPx=0;                   // pause/over strip scroll (px into the block)
let flash="", flashT=0;           // one-line shop talk (asset warnings etc.)
let overAt=0;                     // when the run ended — restart grace window
let showHof=false;                // the 🏆 button — view the hall from any still state

function emptyRow(){ return new Array(COLS).fill(-1); }
function emptyGrid(){ return Array.from({length:ROWS},emptyRow); }

function newBag(){
  const b=[0,1,2,3,4,5,6];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
let bag=[];
function pullType(){ if(bag.length===0) bag=newBag(); return bag.pop(); }

// cellAt — one strip, two storages: board rows 0..ROWS-1, then the block below.
function cellAt(vr,c){
  if(c<0||c>=COLS||vr<0) return -1;
  if(vr<ROWS) return grid[vr][c];
  const br=blockRows[vr-ROWS];
  return br ? br[c] : -1;
}
function stripLen(){ return ROWS + blockRows.length; }

function cellsOf(type,rot,x,y){ return SHAPES[type][rot].map(([cx,cy])=>[x+cx,y+cy]); }
function collides(type,rot,x,y){
  for(const [px,py] of cellsOf(type,rot,x,y)){
    if(px<0||px>=COLS||py>=ROWS) return true;
    if(py>=0 && grid[py][px]!==-1) return true;
  }
  return false;
}

function spawn(){
  const t=nextType; nextType=pullType();
  cur={ type:t, rot:0, x:3, y:0 };
  if(collides(cur.type,cur.rot,cur.x,cur.y)){
    state="over"; overAt=Date.now();          // grace: buffered space-mash can't skip this screen
    hofAdd(); dropLS("auto");                 // the run is history — literally
    syncPause();
  }
}

function lockPiece(){
  const id=pieces.length; pieces.push(cur.type);      // this drop becomes ONE slab
  for(const [px,py] of cellsOf(cur.type,cur.rot,cur.x,cur.y)){
    if(py>=0&&py<ROWS&&px>=0&&px<COLS) grid[py][px]=id;
  }
  clearLines();
  spawn();
  autosave();                               // every landed piece is banked
}

// ── a finished row — bottom OR middle — pulls out and JOINS THE BLOCK. bottom
// rows read as the block shifting down; middle rows pull out and the stack
// above slides down. either way the row is KEPT, never deleted.
function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;){
    let full=true;
    for(let c=0;c<COLS;c++){ if(grid[r][c]===-1){full=false;break;} }
    if(full){
      blockRows.unshift(grid[r]);                     // into the block, seams intact
      grid.splice(r,1); grid.unshift(emptyRow());
      cleared++;
    } else r--;
  }
  if(cleared>0){
    score+=[0,100,300,500,800][cleared]*level;
    lines+=cleared;
    level=Math.floor(lines/10)+1;
    dropInterval=Math.max(80, 800-(level-1)*70);
  }
}

function tryRotate(dir){
  const nrot=(cur.rot+(dir>0?1:3))%4;
  for(const k of [0,1,-1,2,-2]){
    if(!collides(cur.type,nrot,cur.x+k,cur.y)){ cur.rot=nrot; cur.x+=k; return; }
  }
}
function move(dx){ if(!collides(cur.type,cur.rot,cur.x+dx,cur.y)) cur.x+=dx; }
function softDrop(){
  if(!collides(cur.type,cur.rot,cur.x,cur.y+1)){ cur.y++; dropTimer=0; return true; }
  lockPiece(); return false;
}
function hardDrop(){
  while(!collides(cur.type,cur.rot,cur.x,cur.y+1)){ cur.y++; score+=2; }
  lockPiece();
}

function say(s){ flash=s; flashT=180; }

function startGame(){
  grid=emptyGrid(); pieces=[]; blockRows=[]; scrollPx=0;
  score=0; lines=0; level=1;
  dropInterval=800; dropTimer=0; bag=[]; nextType=pullType();
  state="play"; spawn(); autosave(); syncPause();
}

// ════════════════════════════════════════════════════════════════════════════
//  THE BENCH BOOK — localStorage, namespaced "bbm.". a save is the WHOLE bench:
//  grid + pieces + the block + the bag, so grain and seams reload exactly.
//  "auto" is written on every lock / pause / blur — reopen and you're back,
//  paused, right where the last piece landed. slots 1..5 are yours to name.
// ════════════════════════════════════════════════════════════════════════════
const NS="bbm.";
function store(k,v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(_){} }
function fetchLS(k){ try{ const v=localStorage.getItem(NS+k); return v?JSON.parse(v):null; }catch(_){ return null; } }
function dropLS(k){ try{ localStorage.removeItem(NS+k); }catch(_){} }
function snapshot(){ return { grid, pieces, blockRows, score, lines, level,
  dropInterval, nextType, bag, cur, when:Date.now() }; }
function restoreSave(s){
  grid=s.grid; pieces=s.pieces; blockRows=s.blockRows; score=s.score;
  lines=s.lines; level=s.level; dropInterval=s.dropInterval;
  nextType=s.nextType; bag=s.bag||[]; cur=s.cur; scrollPx=0; dropTimer=0;
}
function autosave(){ if(state==="play"||state==="pause") store("auto", snapshot()); }

// — HALL OF FAME — top 10 runs, kept forever. the fresh run glows.
let lastRunWhen=0;
function hofAdd(){
  const e={s:score,l:lines,b:blockRows.length,when:Date.now()};
  lastRunWhen=e.when;
  const h=fetchLS("hof")||[];
  h.push(e); h.sort((a,b)=>b.s-a.s); if(h.length>10) h.length=10;
  store("hof",h);
}

// ════════════════════════════════════════════════════════════════════════════
//  RENDER — solid slabs: a cell only draws an edge where the NEIGHBOR is a
//  different piece. same id = same slab = no line. that's the whole trick.
// ════════════════════════════════════════════════════════════════════════════
function hexToRgb(h){const n=parseInt(h.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}

// ── THE REAL FACE — one generated maple photo, tinted into all 7 species ────
// wood.jpg is mirror-tiled into a guaranteed-seamless sheet, then each species
// gets its own copy tinted by DRAWING only — no getImageData anywhere: a
// custom-scheme image (tauri://) taints the canvas and poisons pixel READS;
// multiply-compositing is untouchable. species color pre-boosted ~1.25x, then
// the photo multiplied on TWICE: result = color * t² — grain contrast doubled,
// brightness recentered. until the photo loads: flat color, same palette.
const TEX_SCALE=0.55;                  // pattern zoom — smaller = finer grain
let woodPat=null;                      // woodPat[type], once the photo is in
const woodImg=new Image();
woodImg.onload=function(){
  const S=512, sheet=document.createElement("canvas");
  sheet.width=S*2; sheet.height=S*2;
  const sc=sheet.getContext("2d");
  sc.drawImage(woodImg,0,0,S,S);       // 2x2 mirror tile — seams cancel out
  sc.save(); sc.translate(S*2,0);   sc.scale(-1,1);  sc.drawImage(woodImg,0,0,S,S); sc.restore();
  sc.save(); sc.translate(0,S*2);   sc.scale(1,-1);  sc.drawImage(woodImg,0,0,S,S); sc.restore();
  sc.save(); sc.translate(S*2,S*2); sc.scale(-1,-1); sc.drawImage(woodImg,0,0,S,S); sc.restore();
  const pats=[];
  for(let t=0;t<WOOD.length;t++){
    const c=hexToRgb(WOOD[t]);
    const cnv=document.createElement("canvas"); cnv.width=S*2; cnv.height=S*2;
    const cc=cnv.getContext("2d");
    cc.fillStyle="rgb("+Math.min(255,Math.round(c.r*1.25))+","
                       +Math.min(255,Math.round(c.g*1.25))+","
                       +Math.min(255,Math.round(c.b*1.25))+")";
    cc.fillRect(0,0,S*2,S*2);
    cc.globalCompositeOperation="multiply";
    cc.drawImage(sheet,0,0);
    cc.drawImage(sheet,0,0);
    pats.push(ctx.createPattern(cnv,"repeat"));
  }
  woodPat=pats;
};
woodImg.onerror=function(){ say("wood.jpg missing — flat colors"); };
woodImg.src="wood.jpg";

// woodStyle — the fill for a slab: its species pattern anchored at (tx,ty),
// or the flat species color while the photo is still loading.
function woodStyle(type,tx,ty){
  if(!woodPat) return WOOD[type];
  const p=woodPat[type];
  try{ p.setTransform(new DOMMatrix().translateSelf(tx,ty).scaleSelf(TEX_SCALE)); }catch(_){}
  return p;
}
// fillWood — one cell of a slab. grain anchored by piece id (glued to the
// slab), shifted with the scroll so it rides the strip, not the glass.
function fillWood(x,y,s,type,id){
  ctx.fillStyle=woodStyle(type, ((id*97)%400)-200, ((id*57)%400)-200-scrollPx);
  ctx.fillRect(x-0.25,y-0.25,s+0.5,s+0.5);
}
// seams — draw the glue sides of one cell given which neighbors differ
function seams(x,y,s,top,right,bottom,left){
  ctx.strokeStyle="rgba(30,20,10,0.9)"; ctx.lineWidth=1.5;
  ctx.beginPath();
  if(top){ctx.moveTo(x,y+0.75);ctx.lineTo(x+s,y+0.75);}
  if(bottom){ctx.moveTo(x,y+s-0.75);ctx.lineTo(x+s,y+s-0.75);}
  if(left){ctx.moveTo(x+0.75,y);ctx.lineTo(x+0.75,y+s);}
  if(right){ctx.moveTo(x+s-0.75,y);ctx.lineTo(x+s-0.75,y+s);}
  ctx.stroke();
}

// drawStrip — the one window onto board + block, shifted by scrollPx.
function drawStrip(){
  const sRows=scrollPx/cell;
  ctx.save();
  ctx.beginPath(); ctx.rect(ox-2,oy-2,COLS*cell+4,ROWS*cell+4); ctx.clip();
  ctx.fillStyle="#1c1710"; ctx.fillRect(ox-2,oy-2,COLS*cell+4,ROWS*cell+4);
  const first=Math.floor(sRows), last=first+ROWS+1;
  for(let vr=first; vr<=last && vr<stripLen(); vr++){
    const y=oy+(vr-sRows)*cell;
    for(let c=0;c<COLS;c++){
      const id=cellAt(vr,c); if(id===-1) continue;
      const x=ox+c*cell;
      fillWood(x,y,cell,pieces[id],id);
      seams(x,y,cell,
        cellAt(vr-1,c)!==id, cellAt(vr,c+1)!==id,
        cellAt(vr+1,c)!==id, cellAt(vr,c-1)!==id);
    }
    // the board/block seam — a faint glue line where finished work begins
    if(vr===ROWS){ ctx.fillStyle="rgba(231,201,138,0.25)"; ctx.fillRect(ox,y-1,COLS*cell,2); }
  }
  // end cap of the block
  const endY=oy+(stripLen()-sRows)*cell;
  if(endY<oy+ROWS*cell && blockRows.length>0){
    ctx.fillStyle="#7a6a4c"; ctx.font=`${Math.round(cell*0.5)}px "Trebuchet MS",sans-serif`;
    ctx.textAlign="center";
    ctx.fillText("— end of block —", ox+COLS*cell/2, endY+cell*0.4);
    ctx.textAlign="left";
  }
  // falling piece + ghost, drawn ONE SOLID SLAB (internal edges skipped)
  if((state==="play"||state==="pause") && cur && scrollPx===0){
    let gy=cur.y; while(!collides(cur.type,cur.rot,cur.x,gy+1)) gy++;
    drawSlab(cellsOf(cur.type,cur.rot,cur.x,gy),cur.type,0.22);
    drawSlab(cellsOf(cur.type,cur.rot,cur.x,cur.y),cur.type,1);
  }
  ctx.restore();
}
// drawSlab — a loose piece (falling/ghost/preview): edges only on its outline.
// the fill is ONE path filled ONCE — per-cell fills overlap a hair and DOUBLE-
// PAINT when translucent (the ghost showed its squares); a union can't.
function drawSlab(cells,type,alpha,px,py,size){
  const s=size||cell, bx=px||ox, by=py||oy;
  const has=(x,y)=>cells.some(([cx,cy])=>cx===x&&cy===y);
  // grain glued to the PIECE: anchor at its own top-left, so the figure rides
  // along as it falls instead of the piece sliding over a fixed sheet.
  let mnx=99,mny=99; for(const [cx,cy] of cells){ mnx=Math.min(mnx,cx); mny=Math.min(mny,cy); }
  ctx.globalAlpha=alpha;
  ctx.fillStyle=woodStyle(type, bx+mnx*s, by+mny*s);
  ctx.beginPath();
  for(const [cx,cy] of cells){
    if(cy<0&&!size) continue;
    ctx.rect(bx+cx*s-0.25, by+cy*s-0.25, s+0.5, s+0.5);
  }
  ctx.fill();
  for(const [cx,cy] of cells){
    if(cy<0&&!size) continue;
    seams(bx+cx*s, by+cy*s, s, !has(cx,cy-1), !has(cx+1,cy), !has(cx,cy+1), !has(cx-1,cy));
  }
  ctx.globalAlpha=1;
}

// the portrait strip (3 Sep 2026): one translucent line across the top. Text starts at x=60 (the desk's floating ⏸ sits
// top-left over the frame) and NEXT hugs the right, clear of this game's own ⏸ at top-right.
function drawHUDStrip(){
  ctx.fillStyle="rgba(10,8,5,0.82)"; ctx.fillRect(0,0,W,TOP);
  // 3 Sep 11:20 — inside the 0z desk the band's left holds the desk's 🕹️ and ⏸ (window.__OZ_DESK.left, set by the desk before this
  //    script); standalone, this game's own ⏸ sits top-right instead. While paused (or on the start / over screens) the BENCH
  //    (save · load · fame · restart) takes the band, so the stats and NEXT stand down — one band, the buttons change.
  const desk = window.__OZ_DESK || null;
  if(state!=='play'){ return; }
  ctx.textBaseline="middle"; ctx.textAlign="left";
  const y=TOP/2; let x=desk ? desk.left : 8;
  const put=(lbl,val)=>{
    ctx.fillStyle="#7a6a4c"; ctx.font='11px "Trebuchet MS",sans-serif'; ctx.fillText(lbl,x,y-9); 
    ctx.fillStyle="#f0e2c0"; ctx.font='bold 15px "Trebuchet MS",sans-serif'; ctx.fillText(val,x,y+6);
    x+=Math.max(ctx.measureText(val).width, ctx.measureText(lbl).width)+16;
  };
  // NEXT — a thumbnail slab of its species, left of this game's ⏸ (38px at 10px); the stats stop before it (BLOCK is the first to go on a narrow glass)
  const box=Math.floor((TOP-10)/4), bw=box*4+6, bx=W-(desk?8:58)-bw, by=Math.floor((TOP-(box*4+6))/2);
  const room=bx-12;
  const fits=(lbl,val)=>{ ctx.font='bold 15px "Trebuchet MS",sans-serif'; const w=Math.max(ctx.measureText(val).width, 44); return x+w<=room; };
  [["SCORE",String(score)],["LINES",String(lines)],["LEVEL",String(level)],["BLOCK",blockRows.length+'"']].forEach(([l,v])=>{ if(fits(l,v)) put(l,v); });
  if(flashT>0 && x+60<=room){ ctx.fillStyle="#e7c98a"; ctx.font='bold 13px "Trebuchet MS",sans-serif'; ctx.fillText(flash,x,y); }
  ctx.fillStyle="#1c1710"; ctx.fillRect(bx,by,bw,box*4+6);
  const sh=SHAPES[nextType][0];
  let minx=4,maxx=0,miny=4,maxy=0;
  for(const [cx,cy] of sh){minx=Math.min(minx,cx);maxx=Math.max(maxx,cx);miny=Math.min(miny,cy);maxy=Math.max(maxy,cy);}
  const offx=(4-(maxx-minx+1))/2-minx, offy=(4-(maxy-miny+1))/2-miny;
  drawSlab(sh.map(([cx,cy])=>[cx+offx,cy+offy]),nextType,1,bx+3,by+3,box);
  ctx.textAlign="left"; ctx.textBaseline="top";
}

function drawHUD(){
  if(PORTRAIT){ drawHUDStrip(); return; }
  const hx=ox+COLS*cell+cell*0.7;
  ctx.textBaseline="top";
  ctx.fillStyle="#e7d6b3";
  ctx.font=`bold ${Math.round(cell*0.95)}px "Trebuchet MS",sans-serif`;
  ctx.fillText("BUTCHER", hx, oy);
  ctx.fillText("BLOCK MAKER", hx, oy+cell*1.05);
  ctx.fillStyle="#a8895a";
  ctx.font=`${Math.round(cell*0.55)}px "Trebuchet MS",sans-serif`;
  ctx.fillText("seven woods, one endless glue-up", hx, oy+cell*2.25);

  const lblY=oy+cell*3.4, lh=cell*1.5;
  function stat(lbl,val,i){
    ctx.fillStyle="#7a6a4c";
    ctx.font=`${Math.round(cell*0.5)}px "Trebuchet MS",sans-serif`;
    ctx.fillText(lbl, hx, lblY+i*lh);
    ctx.fillStyle="#f0e2c0";
    ctx.font=`bold ${Math.round(cell*0.85)}px "Trebuchet MS",sans-serif`;
    ctx.fillText(val, hx, lblY+i*lh+cell*0.5);
  }
  stat("SCORE",String(score),0);
  stat("LINES",String(lines),1);
  stat("LEVEL",String(level),2);
  stat("BLOCK",blockRows.length+'"',3);

  // NEXT — as a solid slab of its species
  const ny=lblY+4*lh+cell*0.2;
  ctx.fillStyle="#7a6a4c";
  ctx.font=`${Math.round(cell*0.5)}px "Trebuchet MS",sans-serif`;
  ctx.fillText("NEXT — "+WOODNAME[nextType], hx, ny);
  const box=cell*0.82, by=ny+cell*0.7;
  ctx.fillStyle="#1c1710"; ctx.fillRect(hx,by,box*4+6,box*4+6);
  const sh=SHAPES[nextType][0];
  let minx=4,maxx=0,miny=4,maxy=0;
  for(const [cx,cy] of sh){minx=Math.min(minx,cx);maxx=Math.max(maxx,cx);miny=Math.min(miny,cy);maxy=Math.max(maxy,cy);}
  const offx=(4-(maxx-minx+1))/2-minx, offy=(4-(maxy-miny+1))/2-miny;
  drawSlab(sh.map(([cx,cy])=>[cx+offx,cy+offy]),nextType,1,hx+3,by+3,box);

  if(flashT>0){
    ctx.fillStyle="#e7c98a";
    ctx.font=`${Math.round(cell*0.55)}px "Trebuchet MS",sans-serif`;
    ctx.fillText(flash, hx, oy+ROWS*cell-cell*0.8);
  }
}

function drawOverlay(title,sub){
  ctx.fillStyle="rgba(10,8,5,0.78)";
  ctx.fillRect(ox-2,oy-2,COLS*cell+4,ROWS*cell+4);
  const cx=ox+COLS*cell/2, cy=oy+ROWS*cell/2;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#e7c98a";
  ctx.font=`bold ${Math.round(cell*1.15)}px "Trebuchet MS",sans-serif`;
  ctx.fillText(title, cx, cy-cell*0.8);
  ctx.fillStyle="#cdb888";
  ctx.font=`${Math.round(cell*0.6)}px "Trebuchet MS",sans-serif`;
  ctx.fillText(sub, cx, cy+cell*0.7);
  ctx.textAlign="left"; ctx.textBaseline="top";
}
function drawBanner(txt){
  ctx.fillStyle="rgba(10,8,5,0.85)";
  ctx.fillRect(ox-2,oy-2,COLS*cell+4,cell*1.6);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#e7c98a";
  ctx.font=`bold ${Math.round(cell*0.62)}px "Trebuchet MS",sans-serif`;
  ctx.fillText(txt, ox+COLS*cell/2, oy+cell*0.65);
  ctx.textAlign="left"; ctx.textBaseline="top";
}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#14110d"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(60,44,26,0.25)"; ctx.lineWidth=2;
  for(let y=0;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y+Math.sin(y*0.05)*2);ctx.lineTo(W,y);ctx.stroke();}
  drawStrip();
  drawHUD();
  if(state==="start") drawOverlay("BUTCHER BLOCK MAKER","press ENTER / tap to stack");
  else if(state==="pause") drawBanner("PAUSED — scroll your block · P resumes");
  else if(state==="over"){
    drawBanner("OUT OF ROOM — score "+score+" · block "+blockRows.length+'"');
    ctx.textAlign="center";
    ctx.fillStyle="#cdb888";
    ctx.font=`${Math.round(cell*0.55)}px "Trebuchet MS",sans-serif`;
    ctx.fillText("scroll to admire your block · ENTER / tap to rebuild", ox+COLS*cell/2, oy+cell*2.1);
    ctx.textAlign="left";
  }
  // — HALL OF FAME — auto on the over screen, or via the 🏆 bench button any
  //   time the game is holding still. scroll down and it steps aside so the
  //   block gets the whole window.
  if((showHof || state==="over") && state!=="play" && scrollPx===0) drawHofPanel();
}
function drawHofPanel(){
  const h=fetchLS("hof")||[], bx=ox+COLS*cell/2;
  ctx.textAlign="center";
  ctx.fillStyle="rgba(10,8,5,0.78)";
  ctx.fillRect(ox, oy+cell*2.9, COLS*cell, cell*(2.4+Math.max(1,h.length)*0.85));
  ctx.fillStyle="#e7c98a";
  ctx.font=`bold ${Math.round(cell*0.7)}px "Trebuchet MS",sans-serif`;
  ctx.fillText("🏆 HALL OF FAME", bx, oy+cell*3.7);
  ctx.font=`${Math.round(cell*0.55)}px "Trebuchet MS",sans-serif`;
  if(h.length===0){
    ctx.fillStyle="#9c855c";
    ctx.fillText("no runs on the books yet", bx, oy+cell*4.6);
  }
  h.forEach((e,i)=>{
    ctx.fillStyle = e.when===lastRunWhen ? "#f0e2c0" : "#9c855c";
    ctx.fillText((i+1)+".  "+e.s.toLocaleString()+" pts · "+e.b+'" · '+e.l+" lines",
      bx, oy+cell*(4.6+i*0.85));
  });
  ctx.textAlign="left";
}

// ── loop ────────────────────────────────────────────────────────────────────
function frame(ts){
  if(!lastTs) lastTs=ts;
  let dt=(ts-lastTs)/16.667; lastTs=ts;
  dt=Math.max(0.2,Math.min(2,dt));
  if(state==="play"){
    dropTimer+=dt*16.667;
    if(dropTimer>=dropInterval){ dropTimer=0; softDrop(); }
  }
  if(flashT>0) flashT-=dt;
  render();
  requestAnimationFrame(frame);
}

// ── layout ──────────────────────────────────────────────────────────────────
function resize(){
  DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  W=window.innerWidth; H=window.innerHeight;
  cv.style.width=W+"px"; cv.style.height=H+"px";
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // 3 Sep 2026 — PORTRAIT (Sum, on his iPhone: "the score line, levels, next block can be an overlay at top of screen and
  //    leave full phone width for game"). Taller than wide → no HUD column beside the board; a 44px strip across the top
  //    carries score · lines · level · block and a thumbnail of NEXT, and the board is sized to the full width under it.
  //    Landscape and the desktop are exactly as before: seven HUD columns to the right.
  PORTRAIT = W < H; TOP = PORTRAIT ? 44 : 0;
  try{ const b=document.getElementById('bench'); if(b) b.style.left = (PORTRAIT && window.__OZ_DESK) ? window.__OZ_DESK.left+'px' : ''; }catch(_){}
  const hudCols = PORTRAIT ? 0 : 7;
  // 3 Sep 11:35 (Sum: "game play can be bigger?") — portrait: the board sits FLUSH under the band (no vertical centring) and
  //    the only reserve under it is what the host asks for (the 0z desk passes __OZ_DESK.bottom = the part of the frame its
  //    browser's bar still covers; standalone keeps 28). Every spare pixel goes to the cell.
  const desk = window.__OZ_DESK || null;
  const BOTTOM = PORTRAIT ? (desk && desk.bottom ? desk.bottom : 28) : 0;
  const VPAD = PORTRAIT ? 8 : 40;
  cell=Math.max(10,Math.floor(Math.min((H-VPAD-TOP-BOTTOM)/ROWS,(W-20)/(COLS+hudCols))));
  ox=Math.max(8,Math.floor((W-(COLS+hudCols)*cell)/2));
  oy=PORTRAIT ? (8+TOP) : Math.max(8,Math.floor((H-ROWS*cell)/2));
}
window.addEventListener("resize",resize);

// ── input ───────────────────────────────────────────────────────────────────
const pauseBtn=document.getElementById("pause");
function clampScroll(){ scrollPx=Math.max(0,Math.min(blockRows.length*cell,scrollPx)); }

function togglePause(){
  if(state==="play"){ state="pause"; autosave(); }
  else if(state==="pause"){ state="play"; lastTs=0; scrollPx=0; }
  syncPause();
}
const benchDiv=document.getElementById("bench"), slotsDiv=document.getElementById("slots");
const saveB=document.getElementById("saveB"), loadB=document.getElementById("loadB"),
      restartB=document.getElementById("restartB"), hofB=document.getElementById("hofB");
let restartArmed=false;
function syncPause(){
  pauseBtn.textContent = state==="pause" ? "▶" : "⏸";
  pauseBtn.setAttribute("aria-label", state==="pause" ? "Resume":"Pause");
  pauseBtn.style.display = (state==="play"||state==="pause") ? "block":"none";
  // the bench shows whenever the game is holding still
  benchDiv.style.display = (state==="pause"||state==="over"||state==="start") ? "flex":"none";
  saveB.style.display    = state==="pause" ? "block":"none";
  restartB.style.display = (state==="pause"||state==="over") ? "block":"none";
  restartArmed=false; restartB.classList.remove("armed"); restartB.textContent="↻ restart";
  hofB.classList.toggle("armed",showHof);
  document.getElementById("hint").textContent =
    state==="over" ? "scroll to admire · ENTER / tap to rebuild"
                   : "← → move · ↑ rotate · ↓ soft · Space hard drop · P pause & scroll";
}
pauseBtn.addEventListener("click",e=>{ togglePause(); pauseBtn.blur(); e.preventDefault(); });

// ── the SLOTS modal — 5 saves, save or load, one honest list ────────────────
function openSlots(mode){
  const card=document.createElement("div"); card.className="card";
  const h=document.createElement("h2");
  h.textContent = mode==="save" ? "SAVE — pick a slot" : "LOAD — pick a slot";
  card.appendChild(h);
  for(let i=1;i<=5;i++){
    const s=fetchLS("slot"+i), b=document.createElement("button");
    b.textContent = i+" · "+(s ? s.score.toLocaleString()+" pts · "+s.blockRows.length+'" · lvl '+s.level : "empty");
    if(mode==="load" && !s){ b.disabled=true; b.style.opacity=0.45; }
    b.addEventListener("click",function(){
      if(mode==="save"){ store("slot"+i, snapshot()); say("saved to slot "+i); }
      else { restoreSave(fetchLS("slot"+i)); state="pause"; autosave(); say("slot "+i+" loaded — P to play"); }
      closeSlots(); syncPause();
    });
    card.appendChild(b);
  }
  const c=document.createElement("button"); c.textContent="✕ cancel";
  c.addEventListener("click",closeSlots);
  card.appendChild(c);
  slotsDiv.innerHTML=""; slotsDiv.appendChild(card); slotsDiv.style.display="flex";
}
function closeSlots(){ slotsDiv.style.display="none"; }
saveB.addEventListener("click",e=>{ openSlots("save"); saveB.blur(); e.preventDefault(); });
loadB.addEventListener("click",e=>{ openSlots("load"); loadB.blur(); e.preventDefault(); });
hofB.addEventListener("click",e=>{ showHof=!showHof; syncPause(); hofB.blur(); e.preventDefault(); });
// restart wants a second click — a long block is too easy to vaporize by palsy
restartB.addEventListener("click",e=>{
  if(!restartArmed){
    restartArmed=true; restartB.classList.add("armed"); restartB.textContent="sure? ↻";
    setTimeout(function(){ restartArmed=false; restartB.classList.remove("armed"); restartB.textContent="↻ restart"; },2500);
  } else { restartArmed=false; startGame(); }
  restartB.blur(); e.preventDefault();
});

// ── AUTO-PAUSE — leave for another app (or back to the arcade) and the bench
// freezes + banks itself. coming back leaves it PAUSED: drop in when ready.
window.addEventListener("blur",function(){ if(state==="play") togglePause(); });
document.addEventListener("visibilitychange",function(){ if(document.hidden&&state==="play") togglePause(); });
window.addEventListener("pagehide",autosave);

function onKey(e){
  const k=e.key.toLowerCase();
  if(state==="start"||state==="over"){
    // ENTER only — space is the hard-drop key, and a buffered mash was blowing
    // players straight past this screen. plus a short grace after the run ends.
    if(k==="enter" && Date.now()-overAt>800){ startGame(); e.preventDefault(); }
    if(k===" ") e.preventDefault();
    return;
  }
  if(k==="p"){ togglePause(); e.preventDefault(); return; }
  if(state!=="play") return;
  switch(k){
    case "arrowleft": case "a": move(-1); e.preventDefault(); break;
    case "arrowright": case "d": move(1); e.preventDefault(); break;
    case "arrowup": case "w": tryRotate(1); e.preventDefault(); break;
    case "arrowdown": case "s": softDrop(); score+=1; e.preventDefault(); break;
    case " ": hardDrop(); e.preventDefault(); break;
  }
}
window.addEventListener("keydown",onKey,{passive:false});

// wheel — scroll the strip whenever the game is holding still
window.addEventListener("wheel",e=>{
  if(state==="pause"||state==="over"){ scrollPx+=e.deltaY; clampScroll(); e.preventDefault(); }
},{passive:false});

// mouse — start / rebuild on click (grace-gated after a run ends)
cv.addEventListener("mousedown",e=>{
  if(state==="start"||state==="over"){ if(Date.now()-overAt>800) startGame(); }
});

// touch — play gestures; paused/over drags scroll; start/over taps begin
// 3 Sep 2026 (Sum): tap = rotate · drag sideways = move · DRAG DOWN = a controlled fast drop that follows the finger (one row per
//   cell of travel — drag faster, it falls faster) · FLICK DOWN = hard drop, in the column the piece was in when the flick began,
//   so the flick itself cannot drift it sideways. The flick is read off the last 120ms of the gesture (speed ≥ 0.9 px/ms and
//   ≥ 24px), so a long slow drag that ends still never hard-drops, and a slow drag that ENDS in a flick does.
let tStartX=0,tStartY=0,tStartT=0,tMoved=false;
let gSamples=[];   // the gesture's tail: {t, y, col} per touchmove, col = the piece's column as that sample arrived
let gPiece=null;   // 3 Sep — the piece the gesture began on. softDrop() LOCKS a piece that cannot fall and spawns the next, so a fast
                   //   drag to the floor lands piece one through its own soft drops and the release flick used to slam piece two
                   //   (Sum: "flick to drop will sometimes drop two in a row"). Once the piece changes mid-gesture, the gesture is spent.
function tStart(e){
  const t=e.touches?e.touches[0]:e;
  if(state==="start"){ startGame(); e.preventDefault(); return; }
  if(state==="over"){ tStartY=t.clientY; tStartT=Date.now(); e.preventDefault(); return; }
  tStartX=t.clientX; tStartY=t.clientY; tStartT=Date.now(); tMoved=false;
  gSamples=[{t:tStartT,y:t.clientY,col:cur?cur.x:0}]; gPiece=cur;
  e.preventDefault();
}
function tMove(e){
  const t=e.touches?e.touches[0]:e;
  if(state==="pause"||state==="over"){
    scrollPx+=tStartY-t.clientY; tStartY=t.clientY; clampScroll(); e.preventDefault(); return;
  }
  if(state!=="play") return;
  if(gPiece!==cur){ e.preventDefault(); return; }   // the piece this gesture started on has landed — nothing more from this finger
  gSamples.push({t:Date.now(),y:t.clientY,col:cur?cur.x:0}); if(gSamples.length>12) gSamples.shift();
  const dx=t.clientX-tStartX, dy=t.clientY-tStartY;
  if(Math.abs(dx)>=cell){ move(dx>0?1:-1); tStartX=t.clientX; tMoved=true; }
  if(dy>=cell){ softDrop(); tStartY=t.clientY; tMoved=true; }
  e.preventDefault();
}
function tEnd(e){
  if(state==="over"){
    // a quick TAP rebuilds; a drag was just scrolling. grace-gated too.
    if(Date.now()-tStartT<250 && Date.now()-overAt>800) startGame();
    e.preventDefault(); return;
  }
  if(state!=="play"){ e.preventDefault(); return; }
  const now=Date.now(), dt=now-tStartT;
  const t=(e.changedTouches&&e.changedTouches[0])||e;
  if(!tMoved && dt<250){ tryRotate(1); e.preventDefault(); return; }
  // THE FLICK — speed over the gesture's last 120ms; the column is the one it had when that window began
  const win=gSamples.filter(s=>now-s.t<=120);
  const first=win.length?win[0]:gSamples[gSamples.length-1];
  if(first && gPiece===cur){   // a flick only drops the piece it began on — never the one that just spawned
    const dyW=t.clientY-first.y, dtW=Math.max(1,now-first.t);
    if(dyW>=24 && dyW/dtW>=0.9){
      if(cur && first.col!==cur.x && !collides(cur.type,cur.rot,first.col,cur.y)) cur.x=first.col;
      hardDrop();
    }
  }
  e.preventDefault();
}
cv.addEventListener("touchstart",tStart,{passive:false});
cv.addEventListener("touchmove",tMove,{passive:false});
cv.addEventListener("touchend",tEnd,{passive:false});

// ── boot — an autosave means you never left: back on the bench, paused ──────
grid=emptyGrid(); nextType=pullType(); cur=null;
const autoSave=fetchLS("auto");
if(autoSave && autoSave.grid){ restoreSave(autoSave); state="pause"; }
else state="start";
syncPause();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
