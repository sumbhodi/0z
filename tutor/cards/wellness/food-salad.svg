<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="a garden salad in a wooden bowl">
  <defs>
    <linearGradient id="sb-wood" x1=".18" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#e2c193"/><stop offset=".42" stop-color="#c49a63"/><stop offset="1" stop-color="#8d6336"/>
    </linearGradient>
    <linearGradient id="sb-lip" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f6e0ba"/><stop offset=".45" stop-color="#dcbb87"/><stop offset="1" stop-color="#ab7f4a"/>
    </linearGradient>
    <radialGradient id="sb-in" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#7d5931"/><stop offset="1" stop-color="#4c331a"/>
    </radialGradient>
    <radialGradient id="sb-dome" cx=".36" cy=".24" r=".92">
      <stop offset="0" stop-color="#a5e06b"/><stop offset=".45" stop-color="#6fbc41"/><stop offset=".82" stop-color="#4a9429"/><stop offset="1" stop-color="#31661a"/>
    </radialGradient>
    <radialGradient id="sb-tom" cx=".38" cy=".28" r=".84">
      <stop offset="0" stop-color="#ff8a6b"/><stop offset=".55" stop-color="#e2432c"/><stop offset="1" stop-color="#a41f11"/>
    </radialGradient>
    <radialGradient id="sb-cuc" cx=".4" cy=".3" r=".82">
      <stop offset="0" stop-color="#f4faea"/><stop offset=".7" stop-color="#d9edbd"/><stop offset="1" stop-color="#adcf88"/>
    </radialGradient>
  </defs>

  <ellipse cx="128" cy="204" rx="76" ry="13" fill="#000" opacity=".15"/>

  <!-- the bowl -->
  <path d="M34 144 C34 186 72 208 128 208 C184 208 222 186 222 144 Z" fill="url(#sb-wood)"/>
  <path d="M52 168 C74 194 108 204 146 202 C126 208 92 204 70 188 Z" fill="#fff" opacity=".16"/>
  <path d="M34 144 A94 36 0 0 1 222 144 L208 144 A80 29 0 0 0 48 144 Z" fill="url(#sb-lip)"/>
  <ellipse cx="128" cy="144" rx="80" ry="29" fill="url(#sb-in)"/>

  <!-- the greens: one dome, tucked inside the rim -->
  <g>
    <path d="M48 144 A80 29 0 0 0 208 144 C206 119 192 101 172 96 C160 93 152 100 140 96 C128 92 122 88 112 91 C100 95 96 101 86 98 C72 94 62 87 54 99 C46 111 46 126 48 144 Z" fill="url(#sb-dome)"/>
    <!-- leaf ribs: lighter lifts, darker folds -->
    <path d="M60 140 C56 122 62 106 72 99 C68 114 71 126 67 140 Z" fill="#b0e878" opacity=".55"/>
    <path d="M108 142 C102 122 108 104 120 95 C114 113 118 128 115 142 Z" fill="#b0e878" opacity=".5"/>
    <path d="M162 141 C160 119 168 103 180 97 C172 114 174 127 173 141 Z" fill="#b0e878" opacity=".5"/>
    <path d="M86 142 C84 124 90 108 98 100 C92 117 94 130 94 142 Z" fill="#2d6118" opacity=".35"/>
    <path d="M140 142 C138 122 144 106 154 98 C146 117 148 129 148 142 Z" fill="#2d6118" opacity=".35"/>
    <!-- where the salad meets the front lip -->
    <path d="M48 144 A80 29 0 0 0 208 144 C200 152 172 158 128 158 C84 158 56 152 48 144 Z" fill="#255213" opacity=".45"/>
  </g>

  <!-- carrot shreds -->
  <g stroke="#f0902d" stroke-width="4.5" stroke-linecap="round" opacity=".92">
    <path d="M84 126 L110 119"/><path d="M146 120 L174 128"/><path d="M104 140 L128 146"/><path d="M152 138 L174 144"/>
  </g>

  <!-- cucumber slices -->
  <g>
    <g transform="translate(96 114)">
      <ellipse rx="18" ry="14" fill="#7fb94e"/><ellipse rx="15" ry="11.5" fill="url(#sb-cuc)"/>
      <g fill="#a5cf78" opacity=".85"><ellipse cx="-4.6" cy="-1.8" rx="3" ry="2.2"/><ellipse cx="4.6" cy="-2.8" rx="3" ry="2.2"/><ellipse cx="0" cy="3.8" rx="3" ry="2.2"/></g>
    </g>
    <g transform="translate(158 110)">
      <ellipse rx="17" ry="13" fill="#7fb94e"/><ellipse rx="14" ry="10.5" fill="url(#sb-cuc)"/>
      <g fill="#a5cf78" opacity=".85"><ellipse cx="-4.4" cy="-1.8" rx="2.8" ry="2"/><ellipse cx="4.4" cy="-2.6" rx="2.8" ry="2"/><ellipse cx="0" cy="3.6" rx="2.8" ry="2"/></g>
    </g>
    <g transform="translate(126 138)">
      <ellipse rx="18" ry="14" fill="#7fb94e"/><ellipse rx="15" ry="11.5" fill="url(#sb-cuc)"/>
      <g fill="#a5cf78" opacity=".85"><ellipse cx="-4.6" cy="-1.8" rx="3" ry="2.2"/><ellipse cx="4.6" cy="-2.8" rx="3" ry="2.2"/><ellipse cx="0" cy="3.8" rx="3" ry="2.2"/></g>
    </g>
  </g>

  <!-- tomato halves -->
  <g>
    <g transform="translate(72 132)">
      <ellipse rx="17" ry="13.5" fill="url(#sb-tom)"/><ellipse rx="11.5" ry="8.8" fill="#ff8f72" opacity=".5"/>
      <ellipse rx="4.2" ry="3.2" fill="#ffdccb" opacity=".9"/><ellipse cx="-5" cy="-4.6" rx="4.4" ry="2.8" fill="#fff" opacity=".38"/>
    </g>
    <g transform="translate(128 102)">
      <ellipse rx="16" ry="12.5" fill="url(#sb-tom)"/><ellipse rx="11" ry="8.2" fill="#ff8f72" opacity=".5"/>
      <ellipse rx="4" ry="3" fill="#ffdccb" opacity=".9"/><ellipse cx="-4.6" cy="-4.2" rx="4" ry="2.6" fill="#fff" opacity=".38"/>
    </g>
    <g transform="translate(182 130)">
      <ellipse rx="17" ry="13.5" fill="url(#sb-tom)"/><ellipse rx="11.5" ry="8.8" fill="#ff8f72" opacity=".5"/>
      <ellipse rx="4.2" ry="3.2" fill="#ffdccb" opacity=".9"/><ellipse cx="-5" cy="-4.6" rx="4.4" ry="2.8" fill="#fff" opacity=".38"/>
    </g>
  </g>

  <!-- the front lip, last, so the salad tucks behind it -->
  <path d="M34 144 A94 36 0 0 0 222 144 L208 144 A80 29 0 0 1 48 144 Z" fill="url(#sb-lip)"/>
  <path d="M46 160 A88 30 0 0 0 210 160" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3.5" stroke-linecap="round"/>
</svg>
