<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="suites — a strip mall, every door a whole shop">
  <!-- the strip mall (2026-08-29, Sum's bow №2: "svg for a strip mall for suites") — the suites
       sub-bar button. Every suite is an app in itself, a package: a row of storefronts under one
       roof, each door a whole shop you can walk into. Drawn in the safe.svg house style —
       stroke = currentColor so every skin tints it. Three shops, not five: readable at 24px. -->
  <!-- the roofline + sign band -->
  <line x1="2" y1="6" x2="22" y2="6"/>
  <line x1="3" y1="3.5" x2="21" y2="3.5"/>
  <line x1="3" y1="3.5" x2="2" y2="6"/>
  <line x1="21" y1="3.5" x2="22" y2="6"/>
  <!-- the three storefronts, shared walls -->
  <rect x="3" y="6" width="18" height="13"/>
  <line x1="9" y1="6" x2="9" y2="19"/>
  <line x1="15" y1="6" x2="15" y2="19"/>
  <!-- each shop: an awning stroke, then its own door -->
  <line x1="4" y1="9" x2="8" y2="9"/>
  <line x1="10" y1="9" x2="14" y2="9"/>
  <line x1="16" y1="9" x2="20" y2="9"/>
  <rect x="4.8" y="12" width="2.4" height="7"/>
  <rect x="10.8" y="12" width="2.4" height="7"/>
  <rect x="16.8" y="12" width="2.4" height="7"/>
  <!-- the shared sidewalk -->
  <line x1="1.5" y1="21.5" x2="22.5" y2="21.5"/>
</svg>
