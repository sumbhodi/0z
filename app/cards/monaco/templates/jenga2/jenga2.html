<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JENGA II</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#14110d;overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#e7d6b3;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{touch-action:none;display:block;}
  #hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:12px;
    color:#7a6a4c;letter-spacing:.5px;pointer-events:none;}

  /* pause / play button, tucked top-right by the score */
  #pause{position:fixed;top:10px;right:10px;z-index:5;
    width:34px;height:34px;line-height:32px;text-align:center;
    font-size:16px;border-radius:8px;cursor:pointer;user-select:none;
    background:rgba(30,23,14,0.85);color:#e7d6b3;
    border:1px solid #6b5836;box-shadow:0 1px 4px rgba(0,0,0,0.4);}
  #pause:hover{background:rgba(48,37,22,0.95);}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="pause" aria-label="Pause">⏸</button>
<div id="hint">← → move · ↑ rotate · ↓ soft · Space hard drop · P pause</div>
<script>
"use strict";
const COLS=10, ROWS=20;
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let DPR=1, cell=24, ox=0, oy=0, W=0, H=0;

// Wood palette per piece type (index matches SHAPES order)
const WOOD=["#c8a96b","#bd9a5c","#b5894f","#c2a063","#b08047","#a8763f","#9c6a38"];
// Tetromino definitions as rotation states (each a list of [x,y] offsets in a 4x4 box)
const SHAPES=[
  // I
  [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
  // O
  [[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
  // T
  [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
  // S
  [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
  // Z
  [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
  // J
  [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
  // L
  [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
];

let grid, cur, nextType, score, lines, level, dropTimer, dropInterval, state, lastTs;
// state: "start" | "play" | "pause" | "over"

function emptyGrid(){return Array.from({length:ROWS},()=>new Array(COLS).fill(-1));}

function newBag(){ // returns shuffled 0..6
  const b=[0,1,2,3,4,5,6];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
let bag=[];
function pullType(){ if(bag.length===0) bag=newBag(); return bag.pop(); }

function spawn(){
  const t = nextType;
  nextType = pullType();
  cur = { type:t, rot:0, x:3, y:0 };
  if(collides(cur.type,cur.rot,cur.x,cur.y)){ state="over"; }
}

function cellsOf(type,rot,x,y){
  return SHAPES[type][rot].map(([cx,cy])=>[x+cx,y+cy]);
}
function collides(type,rot,x,y){
  for(const [px,py] of cellsOf(type,rot,x,y)){
    if(px<0||px>=COLS||py>=ROWS) return true;
    if(py>=0 && grid[py][px]!==-1) return true;
  }
  return false;
}

function lockPiece(){
  for(const [px,py] of cellsOf(cur.type,cur.rot,cur.x,cur.y)){
    if(py>=0 && py<ROWS && px>=0 && px<COLS) grid[py][px]=cur.type;
  }
  clearLines();
  spawn();
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;){
    let full=true;
    for(let cgx=0;cgx<COLS;cgx++){ if(grid[r][cgx]===-1){full=false;break;} }
    if(full){
      grid.splice(r,1);
      grid.unshift(new Array(COLS).fill(-1));
      cleared++;
      // do NOT decrement r: same index now holds the row that fell down
    } else {
      r--;
    }
  }
  if(cleared>0){
    const pts=[0,100,300,500,800][cleared]*level;
    score+=pts;
    lines+=cleared;
    level=Math.floor(lines/10)+1;
    dropInterval=Math.max(80, 800 - (level-1)*70);
  }
}

function tryRotate(dir){
  const nrot=(cur.rot+(dir>0?1:3))%4;
  const kicks=[0,1,-1,2,-2];
  for(const k of kicks){
    if(!collides(cur.type,nrot,cur.x+k,cur.y)){
      cur.rot=nrot; cur.x+=k; return;
    }
  }
}
function move(dx){ if(!collides(cur.type,cur.rot,cur.x+dx,cur.y)) cur.x+=dx; }
function softDrop(){
  if(!collides(cur.type,cur.rot,cur.x,cur.y+1)){ cur.y++; dropTimer=0; return true; }
  lockPiece(); return false;
}
function hardDrop(){
  while(!collides(cur.type,cur.rot,cur.x,cur.y+1)){ cur.y++; score+=2; }
  lockPiece();
}

function startGame(){
  grid=emptyGrid(); score=0; lines=0; level=1;
  dropInterval=800; dropTimer=0; bag=[]; nextType=pullType();
  state="play"; spawn();
}

// ---- Rendering ----
function plank(px,py,size,baseHex){
  const x=px, y=py, s=size;
  const c=hexToRgb(baseHex);
  const top=`rgb(${Math.min(255,c.r+26)},${Math.min(255,c.g+22)},${Math.min(255,c.b+16)})`;
  const bot=`rgb(${Math.max(0,c.r-30)},${Math.max(0,c.g-26)},${Math.max(0,c.b-20)})`;
  const g=ctx.createLinearGradient(0,y,0,y+s);
  g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle=g; ctx.fillRect(x,y,s,s);
  // top highlight
  ctx.fillStyle="rgba(255,245,220,0.18)";
  ctx.fillRect(x+1,y+1,s-2,Math.max(1,s*0.12));
  // dark border
  ctx.strokeStyle="rgba(40,28,16,0.85)"; ctx.lineWidth=1;
  ctx.strokeRect(x+0.5,y+0.5,s-1,s-1);
}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}

function drawCellGrid(){
  // board background panel
  ctx.fillStyle="#1c1710";
  ctx.fillRect(ox-2,oy-2,COLS*cell+4,ROWS*cell+4);
  // faint grid lines
  ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(ox+x*cell+0.5,oy);ctx.lineTo(ox+x*cell+0.5,oy+ROWS*cell);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(ox,oy+y*cell+0.5);ctx.lineTo(ox+COLS*cell,oy+y*cell+0.5);ctx.stroke();}
}

function drawBoard(){
  drawCellGrid();
  for(let r=0;r<ROWS;r++)for(let cgx=0;cgx<COLS;cgx++){
    if(grid[r][cgx]!==-1) plank(ox+cgx*cell, oy+r*cell, cell, WOOD[grid[r][cgx]]);
  }
  if(state==="play"||state==="pause"){
    // ghost
    let gy=cur.y;
    while(!collides(cur.type,cur.rot,cur.x,gy+1)) gy++;
    ctx.globalAlpha=0.22;
    for(const [px,py] of cellsOf(cur.type,cur.rot,cur.x,gy)) if(py>=0) plank(ox+px*cell,oy+py*cell,cell,WOOD[cur.type]);
    ctx.globalAlpha=1;
    for(const [px,py] of cellsOf(cur.type,cur.rot,cur.x,cur.y)) if(py>=0) plank(ox+px*cell,oy+py*cell,cell,WOOD[cur.type]);
  }
}

function drawHUD(){
  const hx=ox+COLS*cell+cell*0.7;
  ctx.textBaseline="top";
  ctx.fillStyle="#e7d6b3";
  ctx.font=`bold ${Math.round(cell*1.4)}px "Trebuchet MS",sans-serif`;
  ctx.fillText("JENGA II", hx, oy);
  ctx.fillStyle="#a8895a";
  ctx.font=`${Math.round(cell*0.55)}px "Trebuchet MS",sans-serif`;
  ctx.fillText("the wooden stack", hx, oy+cell*1.55);

  const lblY=oy+cell*2.8, lh=cell*1.55;
  function stat(lbl,val,i){
    ctx.fillStyle="#7a6a4c";
    ctx.font=`${Math.round(cell*0.5)}px "Trebuchet MS",sans-serif`;
    ctx.fillText(lbl, hx, lblY+i*lh);
    ctx.fillStyle="#f0e2c0";
    ctx.font=`bold ${Math.round(cell*0.85)}px "Trebuchet MS",sans-serif`;
    ctx.fillText(val, hx, lblY+i*lh+cell*0.5);
  }
  stat("SCORE",String(score),0);
  stat("LINES",String(lines),1);
  stat("LEVEL",String(level),2);

  // NEXT preview
  const ny=lblY+3*lh+cell*0.2;
  ctx.fillStyle="#7a6a4c";
  ctx.font=`${Math.round(cell*0.5)}px "Trebuchet MS",sans-serif`;
  ctx.fillText("NEXT", hx, ny);
  const box=cell*0.82, bx=hx, by=ny+cell*0.7;
  ctx.fillStyle="#1c1710"; ctx.fillRect(bx,by,box*4+6,box*4+6);
  const sh=SHAPES[nextType][0];
  let minx=4,maxx=0,miny=4,maxy=0;
  for(const [cx,cy] of sh){minx=Math.min(minx,cx);maxx=Math.max(maxx,cx);miny=Math.min(miny,cy);maxy=Math.max(maxy,cy);}
  const offx=(4-(maxx-minx+1))/2 - minx, offy=(4-(maxy-miny+1))/2 - miny;
  for(const [cx,cy] of sh) plank(bx+3+(cx+offx)*box, by+3+(cy+offy)*box, box, WOOD[nextType]);
}

function drawOverlay(title,sub){
  ctx.fillStyle="rgba(10,8,5,0.78)";
  ctx.fillRect(ox-2,oy-2,COLS*cell+4,ROWS*cell+4);
  const cx=ox+COLS*cell/2, cy=oy+ROWS*cell/2;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#e7c98a";
  ctx.font=`bold ${Math.round(cell*1.5)}px "Trebuchet MS",sans-serif`;
  ctx.fillText(title, cx, cy-cell*0.8);
  ctx.fillStyle="#cdb888";
  ctx.font=`${Math.round(cell*0.62)}px "Trebuchet MS",sans-serif`;
  ctx.fillText(sub, cx, cy+cell*0.7);
  ctx.textAlign="left";
}

function render(){
  ctx.clearRect(0,0,W,H);
  // wood-grain background
  ctx.fillStyle="#14110d"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(60,44,26,0.25)"; ctx.lineWidth=2;
  for(let y=0;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y+Math.sin(y*0.05)*2);ctx.lineTo(W,y);ctx.stroke();}
  drawBoard();
  drawHUD();
  if(state==="start") drawOverlay("JENGA II","Press ENTER / tap to stack");
  else if(state==="pause") drawOverlay("PAUSED","Press P to resume");
  else if(state==="over") drawOverlay("TIMBER!","Press ENTER / tap to rebuild");
}

// ---- Loop ----
function frame(ts){
  if(!lastTs) lastTs=ts;
  let dt=(ts-lastTs)/16.667; lastTs=ts;
  dt=Math.max(0.2,Math.min(2,dt));
  if(state==="play"){
    dropTimer+=dt*16.667;
    if(dropTimer>=dropInterval){ dropTimer=0; softDrop(); }
  }
  render();
  requestAnimationFrame(frame);
}

// ---- Layout ----
function resize(){
  DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  W=window.innerWidth; H=window.innerHeight;
  cv.style.width=W+"px"; cv.style.height=H+"px";
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // reserve room for HUD (~6 cells wide) to the right
  const hudCols=6.5;
  const maxCellH=(H-40)/ROWS;
  const maxCellW=(W-20)/(COLS+hudCols);
  cell=Math.max(10,Math.floor(Math.min(maxCellH,maxCellW)));
  const totalW=COLS*cell + hudCols*cell;
  ox=Math.floor((W-totalW)/2)+ (totalW< W? 0:0);
  if(ox<8) ox=8;
  oy=Math.floor((H-ROWS*cell)/2);
  if(oy<8) oy=8;
}
window.addEventListener("resize",resize);

// ---- Input ----

// One shared pause toggle: key and button drive the same state
const pauseBtn=document.getElementById("pause");
function togglePause(){
  // only toggles while actually mid-game

  if(state==="play") state="pause";
  else if(state==="pause"){ state="play"; lastTs=0; }
  syncPauseBtn();
}
function syncPauseBtn(){
  // ▶ offered while paused, ⏸ while running

  pauseBtn.textContent = state==="pause" ? "▶" : "⏸";
  pauseBtn.setAttribute("aria-label", state==="pause" ? "Resume" : "Pause");
}
pauseBtn.addEventListener("click",function(e){
  togglePause();
  pauseBtn.blur();
  e.preventDefault();
});

function onKey(e){
  const k=e.key.toLowerCase();
  if(state==="start"||state==="over"){
    if(k==="enter"||k===" "){ startGame(); syncPauseBtn(); e.preventDefault(); }
    return;
  }
  if(k==="p"){ togglePause(); e.preventDefault(); return; }
  if(state!=="play") return;
  switch(k){
    case "arrowleft": case "a": move(-1); e.preventDefault(); break;
    case "arrowright": case "d": move(1); e.preventDefault(); break;
    case "arrowup": case "w": tryRotate(1); e.preventDefault(); break;
    case "arrowdown": case "s": softDrop(); score+=1; e.preventDefault(); break;
    case " ": hardDrop(); e.preventDefault(); break;
  }
}
window.addEventListener("keydown",onKey,{passive:false});

// Touch controls: tap=rotate, swipe L/R=move, swipe down=hard drop
let tStartX=0,tStartY=0,tStartT=0,moved=false;
function tStart(e){
  if(state==="start"||state==="over"){ startGame(); syncPauseBtn(); e.preventDefault(); return; }
  const t=e.touches?e.touches[0]:e;
  tStartX=t.clientX; tStartY=t.clientY; tStartT=Date.now(); moved=false;
  e.preventDefault();
}
function tMove(e){
  if(state!=="play") return;
  const t=e.touches?e.touches[0]:e;
  const dx=t.clientX-tStartX, dy=t.clientY-tStartY;
  if(Math.abs(dx)>=cell){ move(dx>0?1:-1); tStartX=t.clientX; moved=true; }
  if(dy>=cell){ softDrop(); tStartY=t.clientY; moved=true; }
  e.preventDefault();
}
function tEnd(e){
  if(state!=="play"){ e.preventDefault(); return; }
  const dt=Date.now()-tStartT;
  const t=(e.changedTouches&&e.changedTouches[0])||e;
  const dy=t.clientY-tStartY;
  if(!moved && dt<250) tryRotate(1);
  else if(dy>cell*4) hardDrop();
  e.preventDefault();
}
cv.addEventListener("touchstart",tStart,{passive:false});
cv.addEventListener("touchmove",tMove,{passive:false});
cv.addEventListener("touchend",tEnd,{passive:false});
cv.addEventListener("mousedown",function(e){ if(state==="start"||state==="over"){ startGame(); syncPauseBtn(); } });

// ---- Boot ----
grid=emptyGrid(); score=0; lines=0; level=1; dropInterval=800; dropTimer=0;
nextType=pullType(); cur={type:0,rot:0,x:3,y:0}; state="start";
syncPauseBtn();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
