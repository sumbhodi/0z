   WHAT THIS IS
   Space Invaders, but you "colonize" upward through ten tiers of being.
   Robot · marshmallow · green alien · blue alien · mouse · insectoid ·
   reptilian · ape · humanoid · then THE CONCEPTS.
   Each level is one tier. Clear the wave to climb.

   IT CANNOT BE WON — SO REACHING THE WALL *IS* WINNING
   Tier 10 is gods, myths, the unknown, and one blank cell.
   Your bullets pass straight through. You cannot shoot a concept.
   The line descends at a fixed rate and reaches you no matter what.
   Reaching tier 10 IS the finish line. The finish kills you —
   and dying THERE, as the last mortal being, is the WIN.
   The prize is not survival. The prize is being remembered:
   your initials join THE ROLL OF THE FALLEN. memento mori.

   THE CURVE (all knobs live in ONE CONFIG object)
   Levels 1-5 are easy — a casual human clears them.
   From tier 5 (mouse) enemies speed up each level.
   From tier 6 (insectoid) they march in from off-screen — relentless conveyor.
   A CASUAL human washes out around tier 6-7.
   A SKILLED human, with hours of practice, can claw all the way to the wall.
   Reaching tier 10 and dying there is the WIN — barely human-beatable.
   The retune (jul 2026) capped conveyor supply near a skilled hand's ceiling.
   See the burial zone for the arithmetic.

  ════════════════════════════════════════════════════════════════════════
   BURIAL ZONE — how a SKILLED human now reaches the wall, and a casual can't
   99% jumped at the TOC. you are the 1%. here is the arithmetic.
  ════════════════════════════════════════════════════════════════════════

   the ladder is a joke about conquest that never completes.
   you climb the tree of life shooting everything softer than you,
   and at the top you meet the thing you cannot shoot: an idea.

   the tuning is honest. the survival test on the conveyor is:
     can you destroy each descending enemy before it crosses your line?
   that is a race between your fire rate and the supply of enemies.

   MAX FIRE — cooldown 75ms — is 13.3 shots per second, 100% accurate.
   the conveyor supply, per second, USED to climb out of reach:
     old:  L6 ~3.3/s   L7 ~5.1/s   L8 ~7.4/s   L9 ~8.9/s
   7.4 and 8.9 are above ANY human hand. only a perfect bot held those.
   so the old game was bot-only to the wall. that was the bug.

   the RETUNE (jul 2026) lengthened spawnMs on the hard tiers and
   dropped the quota 22 → 18, so supply now tops out near a human ceiling:
     new:  L6 ~3.3/s   L7 ~4.4/s   L8 ~5.0/s   L9 ~5.9/s
   a SKILLED human — aiming ~every 180-200ms, ~70-80% on a moving target,
   losing some windows to dodging halved bombs — clears ~5-6/s at their best.
   5.9 sits right at that ceiling: HARD, but humanly holdable with practice.
   so a practiced hand can now claw through 6-9 and REACH the wall.

   a CASUAL human is ~1.5-3/s and still drowns around L6-7. unchanged.
   L6 was left easy on purpose — the on-ramp. the wall is earned, not free.

   and then tier 10, where fire rate stops mattering entirely,
   because the concepts do not die, and the line comes down anyway.
   reaching it IS the win. you die at the wall as the last mortal being,
   and the ROLL OF THE FALLEN remembers your initials.

   you cannot kill a concept.
   you die anyway.
   but you were the last of us to stand here —
   and we will remember your name.

<script>
(()=>{
"use strict";

// ════════════════════════════════════════════════════════════════════════
//  CONFIG — every tuning knob, in one place, each one commented.
//  the whole difficulty curve is simulatable from these constants alone.
//  RETUNED jul 2026 so a SKILLED, practiced human can now clear 1-9 and
//  REACH the wall (the win), while a CASUAL human still washes out ~6-7.
//  arithmetic in the burial zone. only the hard conveyor tiers changed.
// ════════════════════════════════════════════════════════════════════════

const CONFIG = {

  // — formation shape (tiers 1-5: a fixed grid, one row per tier) —
  cols: 9,                 // columns in every formation wave
  rowsPerLevel: true,      // tier N has N rows (L1=1 row … L5=5 rows). flag, not value.

  // — march / descent of a fixed formation (tiers 1-5) —
  baseStepSpeed: 520,      // ms between side-march steps at L1 (higher = slower/easier)
  stepFloor: 60,           // fastest the march is ever allowed to get (ms floor)
  perLevelSpeedMult: 0.80, // step interval ×= this each level FROM tier 5 (mouse).
                           //   0.80 => each level ~20% faster than the last.
  driftPxFrame: 0.12,      // slow continuous downward creep of the formation, px/frame
  edgeDropMul: 0.55,       // how far the formation lurches down on an edge hit (× cell)

  // — bombs (per-row rate: rows double => bombs double, exactly as specified) —
  bombRatePerRowMs: 3000,  // each living ROW drops a bomb about this often (ms).
                           //   L1 (1 row) ~1 bomb/1.5s. L2 (2 rows) ~2 bombs/1.5s. etc.
  bombSpeedBase: 3.2,      // bomb fall speed at L1 (px/frame)
  bombSpeedPerLevel: 0.45, // added to bomb speed each level

  // — the player's gun —
  playerFireCooldown: 75,  // ms between shots at MAX FIRE. 75 => 13.3 shots/sec.
                           //   this is the "perfect bot" fire rate. genuinely rapid.
  playerBulletCap: 6,      // max simultaneous player bullets in flight
  bulletSpeed: 13,         // player bullet speed (px/frame) — fast, clears the screen quick
  playerSpeed: 7.5,        // ship move speed on arrow keys (px/frame)

  // — the off-screen conveyor (tiers 6-9: they MARCH IN from above the top) —
  //   each level: `lanes` columns stream down; a new enemy enters a lane
  //   every `spawnMs`. supply per second = lanes × (1000/spawnMs).
  //   kept UNDER the 13.3/s max-fire rate at every level so a perfect bot
  //   can always hold the line. a human's ~1.5-3/s cannot, from ~L7 up.
  //   RETUNE (jul 2026): the old L8/L9 supply (7.4/s, 8.9/s) was above ANY
  //   human hand — only a perfect bot reached the wall. we lengthened spawnMs
  //   on the hard tiers so max sustained supply now tops out ~5.9/s, right at a
  //   SKILLED human's practiced ceiling. HARD, but humanly clearable with hours.
  //   L6 stays easy. bombs are already halved elsewhere (bombRatePerRowMs:3000).
  conveyor: {
    6: { lanes:3, spawnMs:900,  descent:1.05 }, // insectoid  supply ~3.3/s  (unchanged, stays easy)
    7: { lanes:4, spawnMs:900,  descent:1.30 }, // reptilian  supply ~4.4/s  (was 780 → 5.1/s)
    8: { lanes:5, spawnMs:1000, descent:1.60 }, // ape        supply ~5.0/s  (was 680 → 7.4/s)
    9: { lanes:5, spawnMs:850,  descent:1.95 }, // humanoid   supply ~5.9/s  (was 560 → 8.9/s)
  },
  conveyorQuota: 18,       // kills to clear a conveyor level (was 22 — shorter sustain, so a
                           //   skilled human's kill-rate need not hold quite as long)

  // — the ROLL OF THE FALLEN: everyone who REACHED the wall and was remembered —
  //   web hook only. "" = off. a new fallen entry POSTs { initials, date } here
  //   if set, wrapped in try/catch + short timeout. MUST no-op silently offline
  //   or when unset, and MUST NEVER block or break the game. no server needed now.
  fallenEndpoint: "",      // e.g. "https://toto2.example/api/fallen" — leave "" to disable
  fallenKey: "colonialism_fallen", // localStorage key for the local roll
  fallenShown: 20,         // how many names the memorial scrolls (newest first)

  // — tier 10: THE CONCEPTS. the unstoppable, unkillable finish line. —
  conceptDescentRate: 0.9, // px/frame the concept line falls. FIXED. input cannot change it.
                           //   ~11s from top to player. it WILL reach you. that is the point.
  conceptCols: 9,          // how many concept glyphs span the line (incl. one blank)

  // — THE STORY (Sum, 3 Sep 2026: "no bombs — the blue aliens usher in passive resistance and long scroll. I like that
  //   story line better for both"). Born on the phone, kept for every screen: bombs fall only through this tier (3 = the
  //   green alien); from the blue alien on nobody fights back — the fight is keeping up. And tiers 6-9 are ONE conveyor:
  //   a quota met retools the lanes to the next species without clearing the sky (see retoolConveyor). —
  bombsUntilTier: 3,
};

// ════════════════════════════════════════════════════════════════════════
//  THE 10 TIERS — the ladder of being. level index = tier - 1.
//  kind drives which sprite is drawn; tint recolors emoji-based tiers.
//  form: "grid"     = fixed formation (tiers 1-5)
//        "conveyor" = marches in from off-screen  (tiers 6-9)
//        "concept"  = the unkillable descending line (tier 10)
// ════════════════════════════════════════════════════════════════════════

// tiers 1-5 are kind:"art" — hand-drawn on canvas by the ported web fns
// (draw + flag). tiers 6-8 stay kind:"emoji" (bug/lizard/ape). tier 9 is the
// lavender HUMANOID — kind:"art", hand-drawn like the crew, the last mortal rung
// before the god wall. tier 10 stays kind:"concept". `draw`/`flag` are ignored
// for the emoji + concept tiers.
const TIERS = [
  { n:1,  name:"ROBOT",        kind:"art",   draw:drawRobot,          flag:"#ff4f9a", form:"grid",     color:"#9fb3c8" },
  { n:2,  name:"MARSHMALLOW",  kind:"art",   draw:drawMarshmallowArt, flag:"#ff8ad8", form:"grid",     color:"#fef8f0" },
  { n:3,  name:"GREEN ALIEN",  kind:"art",   draw:drawMartian,        flag:"#ffe14d", form:"grid",     color:"#66e08a" },
  { n:4,  name:"BLUE ALIEN",   kind:"art",   draw:drawBlueAlien,      flag:"#9cff57", form:"grid",     color:"#5aa8ff" },
  { n:5,  name:"MOUSE",        kind:"art",   draw:drawMouse,          flag:"#ffc6d9", form:"grid",     color:"#c9c2d6" },
  { n:6,  name:"INSECTOID",    kind:"emoji", glyph:"🐜", tint:null,   form:"conveyor", color:"#ff9f4f" },
  { n:7,  name:"REPTILIAN",    kind:"emoji", glyph:"🦎", tint:null,   form:"conveyor", color:"#7fe08a" },
  { n:8,  name:"APE",          kind:"emoji", glyph:"🦍", tint:null,   form:"conveyor", color:"#b08d6a" },
  { n:9,  name:"HUMANOID",     kind:"art",   draw:drawHumanoid,       flag:"#ffd166",  form:"conveyor", color:"#c9a0ff" },
  { n:10, name:"THE CONCEPTS", kind:"concept", glyph:"", tint:null,   form:"concept",  color:"#c9a0ff" },
];

// the accumulating grid sequence: row i of a grid wave draws SPECIES[i], so
// L1=[robot], L2=[robot,marshmallow], … L5=[robot,marshmallow,martian,blue,mouse].
// each entry carries its own flag colour. this drives ONLY which creature a row
// draws — never the row COUNT, bomb rate, or speed (those stay untouched).
const SPECIES = [
  { draw:drawRobot,          flag:"#ff4f9a" }, // row 0 — robot
  { draw:drawMarshmallowArt, flag:"#ff8ad8" }, // row 1 — marshmallow
  { draw:drawMartian,        flag:"#ffe14d" }, // row 2 — green martian
  { draw:drawBlueAlien,      flag:"#9cff57" }, // row 3 — blue alien
  { draw:drawMouse,          flag:"#ffc6d9" }, // row 4 — mouse
];

// tier 10's line: SYMBOLS, not caricatures. a mix of the sacred, the mythic,
// the unknown — and one BLANK cell that is invisible but still kills.
// jesus · buddha · krishna/absolute · a robed god · cthulhu · the FSM ·
// the nebula · the unknown · and nothing at all.
const CONCEPTS = ["✝️","🙏","☸️","🐙","🕉️","🍝","🌌","❓","∅"];
//                                                           ^ "∅" = the blank; drawn as nothing.

// what the WIN screen says when a concept takes you — reverent, still.
// this is the MEMENTO MORI ending: you reached the wall, so you WON.
// you die here as the last mortal being, and the roll remembers you.
const GODLINES = [
  "death comes for us all.",
  "you cannot kill a concept —",
  "you climbed the whole ladder to meet one,",
  "and were taken as the last mortal being.",
  "you will be remembered.",
];

// deadpan game-over lines for tiers 1-9 (you overreached; the empire broke).
const ENDLINES = [
  "YOU CAN'T FINISH COLONIZING. NOBODY CAN.",
  "NO EMPIRE LASTS. THAT'S THE GAME.",
  "THE MAP HAS NO EDGE. THE EMPIRE BREAKS.",
  "SPACE IS BIGGER THAN YOUR FLAG SUPPLY.",
  "EVERY EMPIRE OVERREACHES. YOURS DID TOO.",
];

// ─────────────────────────────────────────────────────────────────────────
//  THE ROLL OF THE FALLEN — everyone who reached the wall and was remembered.
//  a localStorage list of { initials, date }, newest first, capped for display.
//  reaching tier 10 is the win; your initials joining this roll is the prize.
//  loadFallen / saveFallen own the store; addFallen appends + fires the web hook.
// ─────────────────────────────────────────────────────────────────────────

// read the roll from localStorage. never throws — a broken/empty store is [].
function loadFallen(){
  try{
    const raw=localStorage.getItem(CONFIG.fallenKey);
    const arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr:[];
  }catch(_){ return []; }
}

// write the roll back. swallows any storage error (private mode, quota) silently.
function saveFallen(arr){
  try{ localStorage.setItem(CONFIG.fallenKey,JSON.stringify(arr)); }catch(_){}
}

// append one fallen soul to the roll (newest LAST in store) + fire the web hook.
// returns the full roll so the caller can render it immediately.
function addFallen(initials){
  const entry={ initials:initials, date:new Date().toISOString() };
  const arr=loadFallen();
  arr.push(entry);
  saveFallen(arr);
  postFallen(entry);           // optional web POST — safe, offline-proof, never blocks
  return arr;
}

// OPTIONAL web hook: POST { initials, date } to CONFIG.fallenEndpoint if set.
// MUST no-op silently when the endpoint is "", when offline, or on any error,
// and MUST NEVER block or break the game. fire-and-forget with a short timeout.
function postFallen(entry){
  const url=CONFIG.fallenEndpoint;
  if(!url) return;                                   // unset → do nothing, no network
  try{
    const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
    const timer=ctrl?setTimeout(()=>{ try{ctrl.abort();}catch(_){} },2500):null;
    const p=fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(entry),
      keepalive:true,                                // let it finish even as the tab unloads
      signal:ctrl?ctrl.signal:undefined,
    });
    // swallow ALL outcomes — a rejected promise here must never surface.
    // clear the abort timer once fetch settles, either way.
    const done=()=>{ if(timer)clearTimeout(timer); };
    if(p&&p.then) p.then(done,done);
    else done();
  }catch(_){ /* offline / blocked / bad url — the game does not care */ }
}

// ─────────────────────────────────────────────────────────────────────────
//  HALL OF FAME — top 10 runs by SYSTEMS CLAIMED, kept beside the roll.
//  the roll remembers who reached the wall; the hall remembers the empires.
// ─────────────────────────────────────────────────────────────────────────
let lastHofWhen=0;
function loadHof(){
  try{
    const a=JSON.parse(localStorage.getItem("colonialism_hof"))||[];
    return Array.isArray(a)?a:[];
  }catch(_){ return []; }
}
function addHof(){
  try{
    const e={ s:G.score, t:curTier().n, date:new Date().toISOString(), when:Date.now() };
    lastHofWhen=e.when;
    const a=loadHof(); a.push(e);
    a.sort(function(x,y){return y.s-x.s;}); if(a.length>10)a.length=10;
    localStorage.setItem("colonialism_hof",JSON.stringify(a));
  }catch(_){}
}

const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
// ═════════════════════════════════════════════════
//  THE PHONE PROFILE (Sum, 3 Sep 2026 — "go"). Portrait only: taller than wide. The desk is untouched.
//  Why: at phone width the 9-column grid was ~348px in a 393px field — 45px of side room against ~500px on a desk — so the
//  formation hit an edge almost every step and every hit lurched it half a cell down. Same tuning, no room. So: smaller aliens
//  and tighter gaps (three times the side room), a cheaper lurch and creep (the same march takes ~2× as long to reach you), a
//  touch slower everywhere. (The bomb cutoff and the one long conveyor began here too, then became the game's story on every

const PHONE={ cellMul:0.85, cellMin:22, gapX:0.35, edgeDropMul:0.30, driftPxFrame:0.08, tempo:1.25, descentMul:0.8 };   // room and tempo only — the bomb cutoff and the long conveyor moved to CONFIG (12:30): they are the story, on every screen
const knob=(k)=>(PORTRAIT()&&PHONE[k]!=null)?PHONE[k]:CONFIG[k];

function resize(){

  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=true;
}
window.addEventListener("resize",resize); resize();

let stars=[];
function seedStars(){stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.8+0.2});}

// ─────────────────────────────────────────────────────────────────────────
//  sprite factory — everything is DRAWN. no images, no external assets.
//  emoji tiers render the glyph as text; the marshmallow and the concepts
//  are drawn by hand. `tint` recolors an emoji tier (green / blue aliens).
// ─────────────────────────────────────────────────────────────────────────

function blob(cx,cy,rx,ry){
  ctx.beginPath();
  ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  ctx.closePath();
}

// ─────────────────────────────────────────────────────────────────────────
//  PORTED CUTE ART — tiers 1-5. hand-drawn on canvas, NO images/png.
//  lifted verbatim (draw logic) from the untouched web build at
//  toto2-com/site/space/game/index.html: drawRobot · drawMartian ·
//  drawBlueAlien · drawMouse · drawMarshmallow (the nicer web one) + helpers.
//  the web signature is (px,py,iw,ih,frame,flag) — a top-left box + a 0/1
//  blink frame + a colonial claim-flag colour. the arcade draws creatures
//  CENTRED at (cx,cy) with a size and a continuous pixel `wob`. artCell()
//  bridges the two: it derives the web box from centre+size (iw a touch
//  narrower than the cell, ih a touch taller, matching the web's 11×10 feel),
//  turns the continuous wobble into a 0/1 idle-blink frame, and passes the
//  tier's flag colour. the inner draw code is otherwise byte-for-byte the web's.
// ─────────────────────────────────────────────────────────────────────────

// eye highlight used by the martian's open eyes (web helper, verbatim)
function eyeShine(cx,cy,r){
  ctx.fillStyle="#1a1430"; blob(cx,cy,r,r); ctx.fill();
  ctx.fillStyle="#ffffff"; blob(cx-r*0.32,cy-r*0.34,r*0.42,r*0.42); ctx.fill();
}
// little colonial claim-flag planted on top (web helper, verbatim)
function plantFlag(cx,topY,iw,flag){
  const pole=Math.max(1.4,iw*0.035);
  const poleH=iw*0.30;
  const fy=topY-poleH;
  ctx.fillStyle="#cdd6e0";
  ctx.fillRect(cx-pole/2,fy,pole,poleH);
  ctx.fillStyle=flag;
  ctx.beginPath();
  ctx.moveTo(cx+pole/2,fy+1);
  ctx.lineTo(cx+pole/2+iw*0.20,fy+iw*0.06);
  ctx.lineTo(cx+pole/2,fy+iw*0.12);
  ctx.closePath();
  ctx.fill();
}

// tall slender BLUE alien folk, big luminous eyes (web, verbatim body)
function drawBlueAlien(px,py,iw,ih,frame,flag){
  const cx=px+iw/2;
  const wob=frame? -1:1;                 // gentle head tilt
  const headR=iw*0.30;
  const headY=py+ih*0.30;
  // slender body
  ctx.fillStyle="#3aa0ff";
  roundRect(cx-iw*0.16, headY, iw*0.32, ih*0.62, iw*0.14); ctx.fill();
  // thin arms
  ctx.strokeStyle="#3aa0ff"; ctx.lineWidth=Math.max(2,iw*0.07); ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(cx-iw*0.13, headY+ih*0.18);
  ctx.lineTo(cx-iw*0.30, headY+ih*0.34+wob*iw*0.05);
  ctx.moveTo(cx+iw*0.13, headY+ih*0.18);
  ctx.lineTo(cx+iw*0.30, headY+ih*0.34-wob*iw*0.05);
  ctx.stroke();
  // round head
  ctx.fillStyle="#56b4ff";
  blob(cx+wob*iw*0.02, headY, headR, headR*1.08); ctx.fill();
  // faint cyan markings
  ctx.fillStyle="rgba(180,235,255,0.5)";
  ctx.fillRect(cx-headR*0.5+wob*iw*0.02, headY-headR*0.45, headR, Math.max(1,iw*0.03));
  // big luminous eyes
  const ex=headR*0.42, ey=headY+headR*0.08, er=headR*0.40;
  ctx.shadowColor="#cdfaff"; ctx.shadowBlur=iw*0.18;
  ctx.fillStyle="#eafcff";
  blob(cx-ex+wob*iw*0.02,ey,er,er*1.15); ctx.fill();
  blob(cx+ex+wob*iw*0.02,ey,er,er*1.15); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#1b2a5a";
  blob(cx-ex+wob*iw*0.02,ey,er*0.5,er*0.6); ctx.fill();
  blob(cx+ex+wob*iw*0.02,ey,er*0.5,er*0.6); ctx.fill();
  ctx.fillStyle="#fff";
  blob(cx-ex-er*0.14+wob*iw*0.02,ey-er*0.2,er*0.18,er*0.18); ctx.fill();
  blob(cx+ex-er*0.14+wob*iw*0.02,ey-er*0.2,er*0.18,er*0.18); ctx.fill();
  plantFlag(cx, headY-headR*1.05, iw, flag);
}

// little GREEN MARTIAN, domed helmet + brush crest (web, verbatim body)
function drawMartian(px,py,iw,ih,frame,flag){
  const cx=px+iw/2;
  const bob=frame?ih*0.03:0;
  const headY=py+ih*0.46+bob;
  const headR=iw*0.27;
  // body / robe
  ctx.fillStyle="#1f7a3a";
  roundRect(cx-iw*0.22, headY+headR*0.4, iw*0.44, ih*0.42, iw*0.16); ctx.fill();
  // little hands
  ctx.fillStyle="#2fae57";
  blob(cx-iw*0.22, headY+ih*0.30, iw*0.07, iw*0.07); ctx.fill();
  blob(cx+iw*0.22, headY+ih*0.30, iw*0.07, iw*0.07); ctx.fill();
  // green round face
  ctx.fillStyle="#37c062";
  blob(cx, headY, headR, headR); ctx.fill();
  // domed space-helmet (translucent)
  ctx.fillStyle="rgba(190,235,255,0.35)";
  ctx.beginPath();
  ctx.arc(cx,headY,headR*1.28,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(210,245,255,0.8)"; ctx.lineWidth=Math.max(1,iw*0.03);
  ctx.beginPath(); ctx.arc(cx,headY,headR*1.28,Math.PI,0); ctx.stroke();
  // brush / crest on top
  ctx.strokeStyle="#ffe14d"; ctx.lineWidth=Math.max(1.4,iw*0.045); ctx.lineCap="round";
  const crestN=5, cw=headR*1.0;
  for(let i=0;i<crestN;i++){
    const t=(i/(crestN-1)-0.5)*2;
    const bx=cx+t*cw*0.5;
    const tilt=(frame?1:-1)*iw*0.02*t;
    ctx.beginPath();
    ctx.moveTo(bx, headY-headR*1.1);
    ctx.lineTo(bx+tilt, headY-headR*1.6);
    ctx.stroke();
  }
  // big eyes
  const ex=headR*0.34, ey=headY-headR*0.02, er=headR*0.34;
  if(frame){ // blink on frame 1
    ctx.strokeStyle="#15331f"; ctx.lineWidth=Math.max(1.2,iw*0.035); ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(cx-ex-er*0.6,ey); ctx.lineTo(cx-ex+er*0.6,ey);
    ctx.moveTo(cx+ex-er*0.6,ey); ctx.lineTo(cx+ex+er*0.6,ey);
    ctx.stroke();
  } else {
    eyeShine(cx-ex,ey,er);
    eyeShine(cx+ex,ey,er);
  }
  // tiny smile
  ctx.strokeStyle="#15331f"; ctx.lineWidth=Math.max(1,iw*0.03); ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(cx,headY+headR*0.42,headR*0.4,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  plantFlag(cx, headY-headR*1.6, iw, flag);
}

// cute boxy SENTIENT ROBOT, antenna, glowing dot eyes (web, verbatim body)
function drawRobot(px,py,iw,ih,frame,flag){
  const cx=px+iw/2;
  const bob=frame?ih*0.03:0;
  const bx=px+iw*0.20, by=py+ih*0.26+bob, bw=iw*0.60, bh=ih*0.58;
  // antenna
  ctx.strokeStyle="#9fb3c8"; ctx.lineWidth=Math.max(1.4,iw*0.04); ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(cx,by); ctx.lineTo(cx,by-ih*0.16); ctx.stroke();
  ctx.fillStyle=frame?"#ff7eb6":"#ff4f9a";
  blob(cx,by-ih*0.16,iw*0.06,iw*0.06); ctx.fill();
  // body (rounded box)
  ctx.fillStyle="#c9d6e5";
  roundRect(bx,by,bw,bh,iw*0.16); ctx.fill();
  ctx.fillStyle="#aebccf";
  roundRect(bx,by+bh*0.62,bw,bh*0.38,iw*0.12); ctx.fill();
  // face screen
  ctx.fillStyle="#23304a";
  roundRect(bx+bw*0.12,by+bh*0.14,bw*0.76,bh*0.42,iw*0.08); ctx.fill();
  // glowing dot eyes
  const er=iw*0.075, ey=by+bh*0.33;
  ctx.shadowColor="#6df0ff"; ctx.shadowBlur=iw*0.20;
  ctx.fillStyle="#9ff6ff";
  if(frame){ // blink: squashed dots
    blob(cx-bw*0.18,ey,er,er*0.4); ctx.fill();
    blob(cx+bw*0.18,ey,er,er*0.4); ctx.fill();
  } else {
    blob(cx-bw*0.18,ey,er,er); ctx.fill();
    blob(cx+bw*0.18,ey,er,er); ctx.fill();
  }
  ctx.shadowBlur=0;
  // tiny smile bar
  ctx.strokeStyle="#9ff6ff"; ctx.lineWidth=Math.max(1,iw*0.03); ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(cx,by+bh*0.40,bw*0.16,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  // little feet
  ctx.fillStyle="#8ea0b6";
  roundRect(bx+bw*0.12,by+bh-iw*0.02,bw*0.22,iw*0.08,iw*0.04); ctx.fill();
  roundRect(bx+bw*0.66,by+bh-iw*0.02,bw*0.22,iw*0.08,iw*0.04); ctx.fill();
  plantFlag(cx, by-ih*0.16-iw*0.06, iw, flag);
}

// cute round MOUSE, big ears, pink nose, dot eyes (web, verbatim body)
function drawMouse(px,py,iw,ih,frame,flag){
  const cx=px+iw/2;
  const headY=py+ih*0.50;
  const headR=iw*0.30;
  const earWob=frame?iw*0.02:-iw*0.02;
  // big round ears
  ctx.fillStyle="#b9b3c9";
  blob(cx-headR*0.85, headY-headR*0.85+earWob, headR*0.62, headR*0.62); ctx.fill();
  blob(cx+headR*0.85, headY-headR*0.85-earWob, headR*0.62, headR*0.62); ctx.fill();
  ctx.fillStyle="#ffc6d9"; // inner ear
  blob(cx-headR*0.85, headY-headR*0.85+earWob, headR*0.34, headR*0.34); ctx.fill();
  blob(cx+headR*0.85, headY-headR*0.85-earWob, headR*0.34, headR*0.34); ctx.fill();
  // round head/body
  ctx.fillStyle="#cfcadd";
  blob(cx, headY, headR, headR*1.02); ctx.fill();
  // cheeks
  ctx.fillStyle="rgba(255,170,200,0.55)";
  blob(cx-headR*0.55, headY+headR*0.25, headR*0.22, headR*0.18); ctx.fill();
  blob(cx+headR*0.55, headY+headR*0.25, headR*0.22, headR*0.18); ctx.fill();
  // dot eyes (blink on frame 1)
  const ex=headR*0.40, ey=headY-headR*0.04, er=headR*0.16;
  if(frame){
    ctx.strokeStyle="#241c33"; ctx.lineWidth=Math.max(1.2,iw*0.035); ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(cx-ex-er,ey); ctx.lineTo(cx-ex+er,ey);
    ctx.moveTo(cx+ex-er,ey); ctx.lineTo(cx+ex+er,ey);
    ctx.stroke();
  } else {
    ctx.fillStyle="#241c33";
    blob(cx-ex,ey,er,er); ctx.fill();
    blob(cx+ex,ey,er,er); ctx.fill();
    ctx.fillStyle="#fff";
    blob(cx-ex-er*0.3,ey-er*0.3,er*0.35,er*0.35); ctx.fill();
    blob(cx+ex-er*0.3,ey-er*0.3,er*0.35,er*0.35); ctx.fill();
  }
  // tiny pink nose + whiskers
  ctx.fillStyle="#ff7fa6";
  blob(cx,headY+headR*0.34,headR*0.13,headR*0.10); ctx.fill();
  ctx.strokeStyle="rgba(80,70,100,0.6)"; ctx.lineWidth=Math.max(0.8,iw*0.018);
  ctx.beginPath();
  ctx.moveTo(cx-headR*0.1,headY+headR*0.36); ctx.lineTo(cx-headR*0.7,headY+headR*0.30);
  ctx.moveTo(cx-headR*0.1,headY+headR*0.40); ctx.lineTo(cx-headR*0.7,headY+headR*0.46);
  ctx.moveTo(cx+headR*0.1,headY+headR*0.36); ctx.lineTo(cx+headR*0.7,headY+headR*0.30);
  ctx.moveTo(cx+headR*0.1,headY+headR*0.40); ctx.lineTo(cx+headR*0.7,headY+headR*0.46);
  ctx.stroke();
  plantFlag(cx, headY-headR*1.4, iw, flag);
}

// MARSHMALLOW — the web's cute white one (verbatim body). replaces the old blob.
function drawMarshmallowArt(px,py,iw,ih,frame,flag){
  const cx=px+iw/2;
  const squish=frame?1.06:0.96;          // gentle squash-and-stretch
  const bw=iw*0.56, bh=ih*0.52*squish;
  const bx=cx-bw/2, by=py+ih*0.52-bh/2+(frame?ih*0.02:0);
  // soft pillowy body with subtle shadow
  ctx.fillStyle="#f3eee9";
  roundRect(bx,by,bw,bh,Math.min(bw,bh)*0.42); ctx.fill();
  ctx.fillStyle="#ffffff";
  roundRect(bx,by,bw,bh*0.78,Math.min(bw,bh)*0.42); ctx.fill();
  // toasty top dab
  ctx.fillStyle="rgba(214,170,120,0.45)";
  roundRect(bx+bw*0.18,by+bh*0.04,bw*0.64,bh*0.18,bh*0.12); ctx.fill();
  // blush
  ctx.fillStyle="rgba(255,180,190,0.6)";
  blob(cx-bw*0.30, by+bh*0.55, bw*0.10, bh*0.07); ctx.fill();
  blob(cx+bw*0.30, by+bh*0.55, bw*0.10, bh*0.07); ctx.fill();
  // dot eyes (blink on frame 1)
  const ex=bw*0.22, ey=by+bh*0.42, er=bw*0.07;
  if(frame){
    ctx.strokeStyle="#3a2f2a"; ctx.lineWidth=Math.max(1.2,iw*0.035); ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(cx-ex-er,ey); ctx.lineTo(cx-ex+er,ey);
    ctx.moveTo(cx+ex-er,ey); ctx.lineTo(cx+ex+er,ey);
    ctx.stroke();
  } else {
    ctx.fillStyle="#3a2f2a";
    blob(cx-ex,ey,er,er*1.1); ctx.fill();
    blob(cx+ex,ey,er,er*1.1); ctx.fill();
  }
  // tiny smile
  ctx.strokeStyle="#3a2f2a"; ctx.lineWidth=Math.max(1,iw*0.03); ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(cx,by+bh*0.56,bw*0.14,0.12*Math.PI,0.88*Math.PI); ctx.stroke();
  plantFlag(cx, by, iw, flag);
}

// LAVENDER HUMANOID — tier 9, the last MORTAL rung. drawn in the same cute-crew
// style + signature (px,py,iw,ih,frame,flag), pure canvas — arcs/beziers/fills,
// NO images. skin is a lavender wash (#c9a0ff body, #b79ce0 shade) that deliberately
// echoes the tier-10 concept-line colour, so the final creature foreshadows the god
// wall it climbs into. clothing is PRIMITIVE: a leaf/fur loincloth wrap + a little
// bone necklace — tribal, a touch cute. big friendly eyes, and it plants the same
// colonial claim-flag as the rest of the crew.
function drawHumanoid(px,py,iw,ih,frame,flag){
  const cx=px+iw/2;
  const bob=frame?ih*0.03:0;              // gentle idle bob, matching the crew
  const headR=iw*0.24;
  const headY=py+ih*0.30+bob;
  const bodyTop=headY+headR*0.85;
  const bodyBot=py+ih*0.92+bob;
  const bodyH=bodyBot-bodyTop;
  const bodyW=iw*0.34;
  // — legs (two lavender-shade stubs) —
  ctx.fillStyle="#b79ce0";
  roundRect(cx-bodyW*0.42, bodyBot-bodyH*0.10, bodyW*0.34, bodyH*0.34, iw*0.05); ctx.fill();
  roundRect(cx+bodyW*0.08, bodyBot-bodyH*0.10, bodyW*0.34, bodyH*0.34, iw*0.05); ctx.fill();
  // — torso (soft lavender body) —
  ctx.fillStyle="#c9a0ff";
  roundRect(cx-bodyW/2, bodyTop, bodyW, bodyH*0.78, iw*0.12); ctx.fill();
  // — arms, thin, with a tiny wave on the blink frame —
  const armW=Math.max(2,iw*0.075);
  ctx.strokeStyle="#c9a0ff"; ctx.lineWidth=armW; ctx.lineCap="round";
  const swing=frame?iw*0.06:-iw*0.04;
  ctx.beginPath();
  ctx.moveTo(cx-bodyW*0.42, bodyTop+bodyH*0.10);
  ctx.lineTo(cx-bodyW*0.66, bodyTop+bodyH*0.34+swing);
  ctx.moveTo(cx+bodyW*0.42, bodyTop+bodyH*0.10);
  ctx.lineTo(cx+bodyW*0.66, bodyTop+bodyH*0.34-swing);
  ctx.stroke();
  // — PRIMITIVE CLOTHING: a leaf / fur loincloth wrap slung round the hips —
  const hipY=bodyTop+bodyH*0.50;
  ctx.fillStyle="#7fae5a";                // leafy green wrap band
  roundRect(cx-bodyW*0.58, hipY, bodyW*1.16, bodyH*0.20, iw*0.04); ctx.fill();
  ctx.fillStyle="#5f9440";                // darker leaf-points hanging down (tribal)
  for(let i=-1;i<=1;i++){
    const lx=cx+i*bodyW*0.34;
    ctx.beginPath();
    ctx.moveTo(lx-bodyW*0.16, hipY+bodyH*0.18);
    ctx.lineTo(lx+bodyW*0.16, hipY+bodyH*0.18);
    ctx.lineTo(lx, hipY+bodyH*0.40);
    ctx.closePath(); ctx.fill();
  }
  // — a little bone necklace across the chest (bone-white beads) —
  ctx.fillStyle="#efe6d0";
  for(let i=-1;i<=1;i++){
    blob(cx+i*bodyW*0.22, bodyTop+bodyH*0.14, iw*0.035, iw*0.05); ctx.fill();
  }
  // — head (round lavender face) —
  ctx.fillStyle="#c9a0ff";
  blob(cx, headY, headR, headR*1.04); ctx.fill();
  // shaggy tribal hair-tuft on top
  ctx.strokeStyle="#8a6fb0"; ctx.lineWidth=Math.max(1.4,iw*0.04); ctx.lineCap="round";
  for(let i=-1;i<=1;i++){
    const hx=cx+i*headR*0.5;
    ctx.beginPath();
    ctx.moveTo(hx, headY-headR*0.85);
    ctx.lineTo(hx+(frame?1:-1)*iw*0.02*i, headY-headR*1.25);
    ctx.stroke();
  }
  // — big friendly eyes (blink on frame 1), like the crew —
  const ex=headR*0.40, ey=headY+headR*0.02, er=headR*0.30;
  if(frame){
    ctx.strokeStyle="#2a2140"; ctx.lineWidth=Math.max(1.2,iw*0.035); ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(cx-ex-er*0.7,ey); ctx.lineTo(cx-ex+er*0.7,ey);
    ctx.moveTo(cx+ex-er*0.7,ey); ctx.lineTo(cx+ex+er*0.7,ey);
    ctx.stroke();
  } else {
    ctx.fillStyle="#2a2140";
    blob(cx-ex,ey,er,er*1.1); ctx.fill();
    blob(cx+ex,ey,er,er*1.1); ctx.fill();
    ctx.fillStyle="#fff";
    blob(cx-ex-er*0.28,ey-er*0.28,er*0.34,er*0.34); ctx.fill();
    blob(cx+ex-er*0.28,ey-er*0.28,er*0.34,er*0.34); ctx.fill();
  }
  // rosy cheeks — a little cute
  ctx.fillStyle="rgba(255,150,200,0.4)";
  blob(cx-headR*0.62, headY+headR*0.30, headR*0.20, headR*0.14); ctx.fill();
  blob(cx+headR*0.62, headY+headR*0.30, headR*0.20, headR*0.14); ctx.fill();
  // tiny friendly smile
  ctx.strokeStyle="#2a2140"; ctx.lineWidth=Math.max(1,iw*0.03); ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(cx,headY+headR*0.40,headR*0.32,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  // plant the colonial claim-flag, same as the crew
  plantFlag(cx, headY-headR*1.25, iw, flag);
}

// bridge: the arcade draws CENTRED (cx,cy,size,wob). derive the web's top-left
// box (iw≈size, ih≈size*1.12 → the web's 11×10 proportion) centred on (cx,cy),
// map the continuous wobble into a 0/1 idle-blink frame, and hand the tier's
// flag colour to the verbatim web draw fn. all art stays pure canvas.
function drawCreatureArt(fn,cx,cy,size,wob,flag){
  const iw=size, ih=size*1.12;
  const px=cx-iw/2, py=cy-ih/2;
  const frame=wob>0?1:0;                 // wob oscillates ±; sign → blink frame
  ctx.save();
  ctx.lineJoin="round";
  fn(px,py,iw,ih,frame,flag||"#9cff57");
  ctx.restore();
}

// draw one glyph as a big centred emoji, optionally tinted with a color wash.
// wobble drives a gentle idle bob so the formation feels alive.
function drawEmoji(cx,cy,size,glyph,tint,wob){
  ctx.save();
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=size+"px system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif";
  ctx.fillText(glyph,cx,cy+wob);

  // tint pass: multiply a soft color over the glyph box for green/blue aliens.
  if(tint){
    ctx.globalCompositeOperation="source-atop";
    ctx.globalAlpha=0.45;
    ctx.fillStyle=tint;
    ctx.fillRect(cx-size*0.6,cy-size*0.6+wob,size*1.2,size*1.2);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation="source-over";
  }
  ctx.restore();
}

// rounded-rect helper (used by the marshmallow + ported art)
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ─────────────────────────────────────────────────────────────────────────
//  the CONCEPT line — tier 10. SYMBOLS, not caricatures. the whole line
//  shimmers and glows like a nebula: "vaguely like god / the afterlife."
//  one cell is blank ("∅") — nothing visible, but it still kills.
// ─────────────────────────────────────────────────────────────────────────

function drawConcept(cx,cy,size,glyph,t){
  // JUST the emoji — no purple, no glow, no tint. crisp, solid, full colour.
  // (the lavender backing disc + shadow were what turned them into purple globs.)
  if(glyph==="∅") return;                 // the blank cell — invisible, but it still kills.
  ctx.save();
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=size+"px 'Apple Color Emoji','Segoe UI Emoji',system-ui,sans-serif";
  ctx.fillText(glyph,cx,cy);
  ctx.restore();
}

// dispatch: draw whatever this tier's enemy looks like, centred at (cx,cy).
// grid tiers (1-5) are hand-drawn art; the SPECIES entry for THIS row picks the
// accumulating creature (row 0=robot … row 4=mouse). the accumulation applies
// ONLY to grid formations — on the conveyor a `row` is a LANE index, not a
// species slot, so an art conveyor tier (tier 9, the humanoid) draws its OWN
// tier.draw for every lane. tiers 6-8 stay emoji; tier 10 drawn per-cell in render.
function drawTier(cx,cy,size,tier,wob,t,row){
  if(tier.kind==="art"){
    const sp=(tier.form==="grid"&&row!=null&&SPECIES[row])?SPECIES[row]:tier;
    drawCreatureArt(sp.draw,cx,cy,size,wob,sp.flag);
    return;
  }
  if(tier.kind==="concept"){ /* handled per-cell in stepConcepts render */ return; }
  drawEmoji(cx,cy,size,tier.glyph,tier.tint,wob);
}

// ════════════════════════════════════════════════════════════════════════
//  GAME STATE — one bundle, rebuilt per wave. score + lives survive a wave.
// ════════════════════════════════════════════════════════════════════════

let G;

function curTier(){ return TIERS[Math.min(G.level,TIERS.length-1)]; }

// per-level speed multiplier, applied only FROM tier 5 (mouse) upward.
function speedMul(){
  const over=Math.max(0,G.level-4);           // 0 until level index 4 (=tier 5)
  return Math.pow(CONFIG.perLevelSpeedMult,over);
}

// build the wave for the CURRENT level. shape depends on the tier's form.
try{window.__ozPeek=()=>{const a=G.enemies.filter(e=>e.alive);return {W,H,portrait:PORTRAIT(),cell:G.cell,level:G.level,tier:curTier().n,alive:a.length,minX:a.length?Math.min(...a.map(e=>e.x)):null,maxX:a.length?Math.max(...a.map(e=>e.x)):null,bombs:G.bombs.length}}}catch(_){}   // a peephole for the desk's rig — reads only
function buildWave(){
  const m=Math.min(W,H);
  const cell=PORTRAIT()?Math.max(PHONE.cellMin,Math.round(m/16*PHONE.cellMul)):Math.max(26,Math.round(m/16));   // glyph box size (also the sprite size); smaller on a phone
  G.cell=cell;
  G.enemies=[];
  G.bullets=[]; G.bombs=[]; G.parts=[];
  G.bombTimer=0; G.stepTimer=0; G.dir=1; G.frame=0;
  G.killsThisLevel=0; G.spawnTimers=[];
  G.concepts=null; G.conceptY=0; G.dead=false;

  const tier=curTier();

  // ── tiers 1-5: a fixed grid. tier N has N rows (rowsPerLevel). ──
  if(tier.form==="grid"){
    const rows=tier.n;                        // ONE row on tier 1, up to five on tier 5
    const cols=CONFIG.cols;
    const gapX=cell*(PORTRAIT()?PHONE.gapX:0.55), gapY=cell*0.42;
    const formW=cols*cell+(cols-1)*gapX;
    const startX=(W-formW)/2+cell/2;
    const startY=Math.max(74,H*0.13)+cell/2;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      G.enemies.push({x:startX+c*(cell+gapX), y:startY+r*(cell+gapY),
        row:r, alive:true, wob:0});
    }
    G.gridRows=rows; G.gridCols=cols; G.gapX=gapX; G.gapY=gapY;
  }

  // ── tiers 6-9: the conveyor. lanes stream down from above the top edge. ──
  else if(tier.form==="conveyor"){
    const cfg=CONFIG.conveyor[tier.n];
    const cols=cfg.lanes;
    const gapX=cell*0.9;
    const formW=cols*cell+(cols-1)*gapX;
    const startX=(W-formW)/2+cell/2;
    G.laneX=[]; for(let c=0;c<cols;c++)G.laneX.push(startX+c*(cell+gapX));
    G.conveyor=cfg;
    // one spawn timer per lane, staggered so lanes don't all fire in lockstep
    for(let c=0;c<cols;c++)G.spawnTimers.push(Math.random()*cfg.spawnMs);
  }

  // ── tier 10: THE CONCEPTS. one descending line, never a formation. ──
  else if(tier.form==="concept"){
    G.reachedWall=true;                 // you made it. reaching the wall IS the win.
    const cols=CONFIG.conceptCols;
    // SCATTER: spread the concepts across most of the width, and give each a fixed
    // vertical offset so they read as a strewn nebula, not a ruler-straight line.
    const spanW=Math.min(W-cell,W*0.88), step=spanW/Math.max(1,cols-1), x0=(W-spanW)/2;
    G.concepts=[];
    for(let c=0;c<cols;c++){
      const dy=(((c*3+1)%5)-2)*cell*0.42;      // deterministic -2..2 rungs of scatter
      G.concepts.push({x:x0+c*step, dy, glyph:CONCEPTS[c%CONCEPTS.length]});
    }
    G.conceptY=cell;    // the wall's leading edge — starts at the top, descends fixed rate
  }
}

function newGame(){
  G={
    level:0, score:0, systems:0, state:"start",
    cell:32, enemies:[], bullets:[], bombs:[], parts:[],
    ship:{x:W/2,y:H-46,w:44,h:22,cool:0,lives:3,inv:0},
    dir:1, frame:0, stepTimer:0, bombTimer:0,
    killsThisLevel:0, spawnTimers:[], laneX:[], conveyor:null,
    concepts:null, conceptY:0, muzzle:0, shake:0, loseMsg:"", dead:false, godT:0,
    reachedWall:false,             // true once tier 10 (the concepts) begins → win path
    win:false,                     // true when death happens AT the wall (the WIN, not game-over)
    entry:null,                    // initials-entry state (3 slots) while claiming a spot in the roll
  };
  buildWave();
  G.ship.w=Math.max(40,G.cell*1.3); G.ship.h=Math.max(18,G.cell*0.6);
}
newGame();

// advance to the next tier. does NOT reset score or lives.
function nextLevel(){
  G.level++;
  if(G.level>=TIERS.length)G.level=TIERS.length-1;   // clamp at tier 10
  buildWave();
  saveRun();                                          // a tier reached is a tier banked
  G.ship.inv=800;                        // brief breather entering the next tier
}

//  INPUT — arrows + A/D + mouse move the ship; SPACE / click / tap fire.
//  SPACE is the fire key, so PAUSE lives on "P" (and the top-centre button).

const keys={};

// ─────────────────────────────────────────────────────────────────────────

//  continue rebuilds that tier fresh with your empire intact, landing PAUSED.
//  written on pause · tab-away · tier change; an ENDING (either one) burns it.

function saveRun(){

  try{ localStorage.setItem("colonialism_save",
    JSON.stringify({ level:G.level, score:G.score, lives:G.ship.lives, when:Date.now() })); }catch(_){}
}
function loadRun(){
  try{ const s=JSON.parse(localStorage.getItem("colonialism_save")||"null");
    return (s&&s.level!=null)?s:null; }catch(_){ return null; }
}
function clearRun(){ try{ localStorage.removeItem("colonialism_save"); }catch(_){} }
function continueRun(){
  const s=loadRun(); if(!s) return;
  newGame();
  G.level=Math.min(s.level,TIERS.length-1);
  G.score=s.score||0;
  buildWave();
  G.ship.w=Math.max(40,G.cell*1.3); G.ship.h=Math.max(18,G.cell*0.6);
  G.ship.lives=s.lives||3;
  G.state="pause"; syncPauseBtn();      // land PAUSED — drop in when ready
}

// AUTO-PAUSE — another app takes focus mid-ascent → freeze + bank the run.
window.addEventListener("blur",function(){ if(G.state==="play") togglePause(); });
document.addEventListener("visibilitychange",function(){ if(document.hidden&&G.state==="play") togglePause(); });
window.addEventListener("pagehide",saveRun);

function fire(){
  if(G.state!=="play")return;
  if(G.ship.cool>0||G.bullets.length>=CONFIG.playerBulletCap)return;
  G.ship.cool=CONFIG.playerFireCooldown; G.muzzle=6;

}

function start(){
  if(G.state==="lose" && Date.now()-loseAt<1000) return;   // the grace — read your ending first
  if(G.state==="start"||G.state==="lose"){newGame();G.state="play";syncPauseBtn();}

// ── INITIALS ENTRY — classic arcade. 3 slots, A-Z. type a letter directly,
//    OR arrow-scroll the current slot (up/down = letter, left/right = slot).
//    Enter / fire confirms: adds you to the roll, then shows the memorial. ──

// scroll the current slot's letter by ±1 (wraps A↔Z).
function entryScroll(d){
  const en=G.entry; if(!en) return;
  const n=ENTRY_ALPHABET.length;
  en.letters[en.slot]=(en.letters[en.slot]+d+n)%n;
}

// move the caret between the three slots (clamped 0-2).
function entryMove(d){
  const en=G.entry; if(!en) return;
  en.slot=Math.max(0,Math.min(2,en.slot+d));
}

// type a letter A-Z straight into the current slot, then advance the caret.
function entryType(ch){
  const en=G.entry; if(!en) return;
  const i=ENTRY_ALPHABET.indexOf(ch);
  if(i<0) return;
  en.letters[en.slot]=i;
  if(en.slot<2) en.slot++;
}

// shared geometry for the 3 initials slots + the OK button. render draws to
// this; entryTap hit-tests against it. one source of truth so they never drift.
function entryLayout(){
  const slotW=Math.min(72,W*0.16);
  const gap=slotW*0.4;
  const slotH=slotW*1.25;
  const totalW=slotW*3+gap*2;
  const x0=W/2-totalW/2;
  const y=H/2-slotH*0.2;
  const slots=[0,1,2].map(i=>({x:x0+i*(slotW+gap),y:y,w:slotW,h:slotH}));
  const ok={x:W/2-slotW*0.9,y:y+slotH+slotH*0.35,w:slotW*1.8,h:slotH*0.5};
  return {slots,ok,slotW,slotH};
}

// touch/click during entry: tap a slot's top half = letter up, bottom = down,
// tap the OK button = confirm. returns true if it consumed the tap.
function entryTap(px,py){
  if(G.state!=="entry"||!G.entry) return false;
  const L=entryLayout();
  for(let i=0;i<3;i++){
    const s=L.slots[i];
    if(px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h){
      G.entry.slot=i;
      entryScroll(py<s.y+s.h/2?+1:-1);         // upper half up, lower half down
      return true;
    }
  }
  const o=L.ok;
  if(px>=o.x&&px<=o.x+o.w&&py>=o.y&&py<=o.y+o.h){ entryConfirm(); return true; }
  return false;
}

// confirm: build the initials, add to the roll (+ fire the web hook), show it.
function entryConfirm(){
  const en=G.entry; if(!en||en.saved) return;
  const initials=en.letters.map(i=>ENTRY_ALPHABET[i]).join("");
  en.roll=addFallen(initials);
  en.saved=true;
  addHof();                             // a wall-death is a run for the hall too
  clearRun();                           // the ascent is complete — nothing to continue
  G.state="lose";                       // reuse the lose screen to render the memento + roll
  G.loseMsg="__GODMODE__";
  loseAt=Date.now();                    // a held ENTER from the initials can't skip the memento
}

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  // scroll-kill: arrows + space never move the page
  if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(k))e.preventDefault();
  keys[k]=true;

  // initials entry owns the keyboard while it is open.
  if(G.state==="entry"){
    if(k==="arrowup")        entryScroll(+1);
    else if(k==="arrowdown") entryScroll(-1);
    else if(k==="arrowleft") entryMove(-1);
    else if(k==="arrowright")entryMove(+1);
    else if(k==="enter"||k===" ") entryConfirm();
    else if(k.length===1&&k>="a"&&k<="z") entryType(k.toUpperCase());
    return;
  }

  // the LEGENDS GALLERY owns the keyboard while open.
  if(G.state==="gallery"){
    if(k==="arrowup")        galScroll=Math.max(0,galScroll-1);
    else if(k==="arrowdown") galScroll++;
    else if(k==="escape"||k==="l"||k===" "||k==="enter") G.state="start";
    return;
  }
  if(k==="l"&&(G.state==="start"||G.state==="lose")){ galScroll=0; G.state="gallery"; return; }
  if(k==="c"&&G.state==="start"&&loadRun()){ continueRun(); return; }

  // SPACE is the trigger — it only STARTS from the true splash, never off the
  // lose screen (a fire-mash was blowing players past their own ending).
  // from the lose screen it takes ENTER — a key gameplay never uses.
  if(k===" "){ if(G.state==="play")fire(); else if(G.state==="start") start(); }
  if(k==="enter"&&(G.state==="start"||G.state==="lose")) start();
  if(k==="p"&&(G.state==="play"||G.state==="pause")) togglePause();

  // 🕯️ WITNESS THE WALL — a deep-cut skip (kin to snek's cheats): press "g" mid-run
  //   to jump straight to the god line. you still cannot beat it — you only get to SEE
  //   it, die, and be remembered. glimpse the divine; it does not glimpse back.
  if(k==="g"&&(G.state==="play"||G.state==="pause")){
    G.level=TIERS.length-1;          // the concepts tier — the wall
    buildWave();                     // builds the descending god line + sets reachedWall
    G.state="play"; last=performance.now(); syncPauseBtn();
  }
});

addEventListener("mousedown",e=>{
  if(entryTap(e.clientX,e.clientY))return;
  if(continueTap(e.clientX,e.clientY))return;
  if(galleryTap(e.clientX,e.clientY))return;
  G.state==="play"?fire():start(); });
cv.addEventListener("touchstart",e=>{e.preventDefault();
  const t=e.touches[0]; mouseX=t.clientX; useMouse=true;
  if(entryTap(t.clientX,t.clientY))return;
  if(continueTap(t.clientX,t.clientY))return;
  if(galleryTap(t.clientX,t.clientY))return;
  if(G.state==="play")fire(); else start();},{passive:false});

},{passive:false});

// ─────────────────────────────────────────────────────────────────────────
//  a cute "colonized" puff — stars / sparkles, never gore.
// ─────────────────────────────────────────────────────────────────────────

function boom(x,y){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*2.4+0.6;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.8,
      life:1, rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.3,
      size:Math.random()*4+4,
      color:["#ffd1ec","#fff4b0","#bff7ff","#d8ffcf"][(Math.random()*4)|0]});
  }
}
function drawStar(x,y,r,rot,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2-Math.PI/2;
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    const a2=a+Math.PI/5;
    ctx.lineTo(Math.cos(a2)*r*0.45,Math.sin(a2)*r*0.45);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// ════════════════════════════════════════════════════════════════════════
//  UPDATE — split into clear functions so the tuning is inspectable:
//    stepEnemies  — grid march  OR  conveyor stream
//    stepConcepts — the unstoppable tier-10 descent
//    stepBullets / stepBombs / stepParts
// ════════════════════════════════════════════════════════════════════════

// bomb spacing is PER LIVING ROW: more rows => proportionally more bombs.
// rows double from tier to tier, so total bomb rate doubles — as specified.
function bombInterval(livingRows){
  const rows=Math.max(1,livingRows);
  return CONFIG.bombRatePerRowMs/rows;
}
function bombSpeed(){
  return CONFIG.bombSpeedBase+CONFIG.bombSpeedPerLevel*G.level;
}

// ── tiers 1-5: a fixed formation that side-marches and drifts down. ──
function stepGrid(dt){
  const alive=G.enemies.filter(e=>e.alive);
  if(alive.length===0){ nextLevel(); return; }

  // continuous slow downward creep
  const dy=knob('driftPxFrame')*dt;
  for(const e of G.enemies)e.y+=dy;

  // side-march: interval speeds up with level (from tier 5) and as fewer remain
  const ratio=alive.length/G.enemies.length;
  const base=CONFIG.baseStepSpeed*speedMul()*(PORTRAIT()?PHONE.tempo:1);
  const stepInterval=Math.max(CONFIG.stepFloor, base*(0.30+ratio*0.70));
  const stepPx=G.cell*0.22;

  let minX=Infinity,maxX=-Infinity;
  for(const e of alive){minX=Math.min(minX,e.x);maxX=Math.max(maxX,e.x);}

  G.stepTimer+=dt*16.667;
  let guard=0;
  while(G.stepTimer>=stepInterval && guard++<20){
    G.stepTimer-=stepInterval; G.frame^=1;
    const hitEdge=(G.dir>0&&maxX+stepPx>=W-G.cell*0.6)||(G.dir<0&&minX-stepPx<=G.cell*0.6);
    if(hitEdge){
      G.dir*=-1;
      for(const e of G.enemies)e.y+=G.cell*knob('edgeDropMul');
      minX=Infinity;maxX=-Infinity;
      for(const e of alive){minX=Math.min(minX,e.x);maxX=Math.max(maxX,e.x);}
    }else{
      for(const e of G.enemies)e.x+=G.dir*stepPx;
      minX+=G.dir*stepPx; maxX+=G.dir*stepPx;
    }
  }

  // bombs — one per living ROW rhythm (so rows×bombs scales exactly)
  const rowsAlive=new Set(alive.map(e=>e.row)).size;
  G.bombTimer+=dt*16.667;
  const bombsOn=curTier().n<=CONFIG.bombsUntilTier;   // bombs only through the green alien; from the blue alien on nobody fights back (every screen, 12:30)
  if(bombsOn && G.bombTimer>=bombInterval(rowsAlive)){
    G.bombTimer=0;
    const shooter=alive[(Math.random()*alive.length)|0];
    G.bombs.push({x:shooter.x,y:shooter.y+G.cell*0.4,vy:bombSpeed()});
  }

  // lose if the formation reaches the ship row
  let maxY=-Infinity; for(const e of alive)maxY=Math.max(maxY,e.y);
  if(maxY>=G.ship.y-G.ship.h){ loseGame(endLine()); }
}

// 3 Sep 2026 — THE ONE LONG CONVEYOR (Sum, phone: "ant lizard ape levels, make it all one level — x ants just followed by x
//    lizards, so you just keep shooting, more things keep falling, no reset levels, just one long scroll till end"). Portrait only.
//    When a conveyor tier's quota is met and the next tier is also a conveyor, nothing is cleared: the level advances, the lanes
//    retool to the next tier's count and tempo, the timers restagger, and the enemies already falling keep falling as what they
//    are (each remembers its species). The humanoid's quota still hands off to the Concepts as before.
//  CORRECTION 12:30 — no longer portrait-only: Sum, \"I like that story line better for both\". The desk scrolls too.
function retoolConveyor(){
  G.level=Math.min(G.level+1,TIERS.length-1);
  const tier=curTier(), cfg=CONFIG.conveyor[tier.n], cell=G.cell;
  const cols=cfg.lanes, gapX=cell*0.9, formW=cols*cell+(cols-1)*gapX, startX=(W-formW)/2+cell/2;
  G.laneX=[]; for(let c=0;c<cols;c++)G.laneX.push(startX+c*(cell+gapX));
  G.conveyor=cfg; G.spawnTimers=[]; for(let c=0;c<cols;c++)G.spawnTimers.push(Math.random()*cfg.spawnMs);
  G.killsThisLevel=0; saveRun(); G.ship.inv=800;
}

// ── tiers 6-9: the conveyor. lanes spawn enemies above the top; they march
//    straight down forever. clear a QUOTA of kills to advance. ──
function stepConveyor(dt){
  const cfg=G.conveyor;

  // spawn: each lane drops a new enemy every spawnMs (staggered per lane)
  for(let c=0;c<G.laneX.length;c++){
    G.spawnTimers[c]-=dt*16.667;
    if(G.spawnTimers[c]<=0){
      G.spawnTimers[c]+=cfg.spawnMs;
      G.enemies.push({x:G.laneX[c],y:-G.cell,row:c,alive:true,wob:0,lane:c,tier:curTier().n});   // 3 Sep: remembers its species — on the phone's one long conveyor the ants keep falling while the lizards start
    }
  }

  // march straight down at the level's descent speed × per-level multiplier
  const vy=cfg.descent*(PORTRAIT()?PHONE.descentMul:1)*speedMul()*1.0;
  for(const e of G.enemies)e.y+=vy*dt;

  // bombs — one per living ROW-equivalent (living lanes)
  const lanesAlive=new Set(G.enemies.filter(e=>e.alive).map(e=>e.lane)).size;
  G.bombTimer+=dt*16.667;
  const bombsOn=curTier().n<=CONFIG.bombsUntilTier;   // bombs only through the green alien; from the blue alien on nobody fights back (every screen, 12:30)
  if(bombsOn && lanesAlive>0 && G.bombTimer>=bombInterval(lanesAlive)){
    G.bombTimer=0;
    const alive=G.enemies.filter(e=>e.alive);
    const shooter=alive[(Math.random()*alive.length)|0];
    if(shooter)G.bombs.push({x:shooter.x,y:shooter.y+G.cell*0.4,vy:bombSpeed()});
  }

  // any enemy that reaches the ship row ends the run
  for(const e of G.enemies){
    if(e.alive && e.y>=G.ship.y-G.ship.h){ loseGame(endLine()); return; }
  }
  // drop enemies that somehow slip past the bottom (safety)
  G.enemies=G.enemies.filter(e=>e.alive && e.y<H+G.cell);

  // quota met -> advance. phone: the next conveyor tier joins the same scroll; the desk (and the hand-off to the Concepts) rebuilds
  if(G.killsThisLevel>=CONFIG.conveyorQuota){
    const nt=TIERS[Math.min(G.level+1,TIERS.length-1)];
    if(nt.form==="conveyor") retoolConveyor(); else nextLevel();   // 12:30 — the long scroll on every screen (was portrait-only)
  }
}

// ── tier 10: THE CONCEPTS. descends at a FIXED rate. nothing the player
//    does changes it. bullets pass through. it reaches the ship. you die. ──
function stepConcepts(dt){
  G.godT+=dt*16.667;
  G.conceptY+=CONFIG.conceptDescentRate*dt;    // FIXED descent, unaffected by input

  // bullets pass THROUGH the concepts — no collision, just a faint "no effect"
  // sparkle handled in render. we simply never test bullet-vs-concept here.

  // contact with the ship -> death. the finish line kills you.
  // but you REACHED the wall — so this death is the WIN. route to the memento.
  if(G.conceptY>=G.ship.y-G.ship.h){
    G.dead=true;
    G.shake=12;
    winAtWall();                                // the WIN: memento mori + initials entry
  }
}

// the WIN. reached only from tier 10, so it is always the memento-mori ending.
// freezes the run, opens the classic 3-letter initials entry to join the roll.
function winAtWall(){
  if(G.win) return;                             // fire once
  G.win=true;
  G.state="entry";                              // arcade initials entry, then the roll
  G.entry={ slot:0, letters:[0,0,0], saved:false, roll:null };
}

function stepBullets(dt){
  for(const b of G.bullets)b.y+=b.vy*dt;
  // bullet vs enemy — but ONLY for killable tiers (not the concepts)
  if(curTier().form!=="concept"){
    for(const b of G.bullets){
      for(const e of G.enemies){
        if(!e.alive)continue;
        const hw=G.cell*0.5;
        if(b.x>=e.x-hw&&b.x<=e.x+hw&&b.y>=e.y-hw&&b.y<=e.y+hw){
          e.alive=false; b.dead=true;
          G.score+=10; G.killsThisLevel++;
          boom(e.x,e.y);
          break;
        }
      }
    }
    // conveyor: prune the dead so the array doesn't grow forever
    if(curTier().form==="conveyor")G.enemies=G.enemies.filter(e=>e.alive);
  }
  G.bullets=G.bullets.filter(b=>!b.dead&&b.y>-16);
}

function stepBombs(dt){
  for(const bm of G.bombs)bm.y+=bm.vy*dt;
  const sh=G.ship;
  for(const bm of G.bombs){
    if(bm.y>=sh.y-sh.h/2&&bm.x>=sh.x-sh.w/2&&bm.x<=sh.x+sh.w/2&&sh.inv<=0){
      bm.dead=true; sh.lives--; sh.inv=1100; G.shake=6; boom(sh.x,sh.y);
      if(sh.lives<=0)loseGame(endLine());
    }
  }
  G.bombs=G.bombs.filter(bm=>!bm.dead&&bm.y<H+12);
}

function stepParts(dt){
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.04*dt;
    p.rot+=(p.vr||0)*dt;p.life-=0.022*dt;}
  G.parts=G.parts.filter(p=>p.life>0);
}

let loseAt=0;   // when the empire broke — restart grace, so a fire-mash can't skip the screen
function loseGame(msg){ G.state="lose"; G.loseMsg=msg; G.shake=10; loseAt=Date.now(); addHof(); clearRun(); }
function endLine(){ return ENDLINES[(G.systems+G.score+G.level)%ENDLINES.length]; }

// master update — starfield always; the rest only while playing.
function update(dt){
  for(const s of stars){s.y+=s.z*0.4*dt; if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  if(G.shake>0)G.shake-=dt;
  if(G.state!=="play")return;

  const sh=G.ship;
  let vx=0;
  if(keys["arrowleft"]||keys["a"])vx-=1;
  if(keys["arrowright"]||keys["d"])vx+=1;
  if(vx!==0){useMouse=false; sh.x+=vx*CONFIG.playerSpeed*dt;}
  else if(useMouse&&mouseX!=null){ sh.x+=(mouseX-sh.x)*Math.min(1,0.35*dt); }
  sh.x=Math.max(sh.w/2,Math.min(W-sh.w/2,sh.x));
  sh.y=H-46;
  if(sh.cool>0)sh.cool-=dt*16.667;
  if(sh.inv>0)sh.inv-=dt*16.667;
  if(G.muzzle>0)G.muzzle-=dt;

  const form=curTier().form;
  if(form==="grid")stepGrid(dt);
  else if(form==="conveyor")stepConveyor(dt);
  else if(form==="concept")stepConcepts(dt);

  stepBullets(dt);
  stepBombs(dt);
  stepParts(dt);

  // idle wobble for living enemies
  const w=Math.sin(performance.now()*0.004)*G.cell*0.05;
  for(const e of G.enemies)e.wob=w;
}

// ════════════════════════════════════════════════════════════════════════
//  RENDER — starfield · enemies · concept line · bombs · bullets · ship · HUD
// ════════════════════════════════════════════════════════════════════════

function txt(s,x,y,size,col,al){ctx.fillStyle=col;ctx.font="bold "+size+'px "Courier New",monospace';
  ctx.textAlign=al||"center";ctx.fillText(s,x,y);}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);

  ctx.save();
  if(G.shake>0){const s=G.shake;ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);}

  for(const s of stars){ctx.fillStyle="rgba(180,210,255,"+(s.z*0.8)+")";
    ctx.fillRect(s.x,s.y,s.z<0.5?1:2,s.z<0.5?1:2);}

  if(G.state!=="start"){
    const tier=curTier();

    // enemies (grid + conveyor tiers). grid tiers pass the enemy's row so the
    // SPECIES table can draw a different accumulating creature per row.
    if(tier.form!=="concept"){
      for(const e of G.enemies){ if(!e.alive)continue;
        drawTier(e.x,e.y,G.cell,(e.tier&&TIERS[e.tier-1])||tier,e.wob,performance.now(),e.row); }   // its own species, not the level's
    }

    // the concept line — tier 10, shimmering, descending
    if(tier.form==="concept" && G.concepts){
      for(const cc of G.concepts){
        drawConcept(cc.x,G.conceptY+(cc.dy||0),G.cell,cc.glyph,G.godT);
      }
      // faint "no effect" sparkle where bullets pass through the line
      for(const b of G.bullets){
        if(Math.abs(b.y-G.conceptY)<G.cell*0.6){
          ctx.fillStyle="rgba(210,180,255,0.5)";
          drawStar(b.x,b.y,3,performance.now()*0.01,"rgba(210,180,255,0.6)");
        }
      }
    }

    // bombs
    ctx.fillStyle="#ff5a5a";
    for(const bm of G.bombs)ctx.fillRect(bm.x-2,bm.y-6,4,12);
    // bullets
    ctx.fillStyle="#bfffd0";
    for(const b of G.bullets)ctx.fillRect(b.x-1.5,b.y-9,3,12);
    // particles
    for(const p of G.parts){
      ctx.globalAlpha=Math.max(0,p.life);
      drawStar(p.x,p.y,(p.size||5)*(0.6+p.life*0.6),p.rot||0,p.color);
    }
    ctx.globalAlpha=1;

    // ship (colonial cruiser)
    const sh=G.ship;
    if(!(sh.inv>0&&((sh.inv/90)|0)%2)){
      ctx.fillStyle="#9fe8ff";
      const x=sh.x-sh.w/2,y=sh.y-sh.h/2,w=sh.w,h=sh.h;
      ctx.fillRect(x,y+h*0.55,w,h*0.45);
      ctx.fillRect(x+w*0.18,y+h*0.25,w*0.64,h*0.4);
      ctx.fillStyle="#ffd166";
      ctx.fillRect(sh.x-2,y-h*0.35,4,h*0.5);
      ctx.fillStyle="#57b6ff";
      ctx.fillRect(sh.x-1,y-h*0.35-6,2,6);
      if(G.muzzle>0){ctx.fillStyle="#fff6c0";ctx.fillRect(sh.x-4,y-h*0.35-8,8,8);}
    }

    // HUD
    txt("SYSTEMS  "+G.score,14,28,17,"#9cff57","left");
    let lstr="";for(let i=0;i<G.ship.lives;i++)lstr+="▲ ";
    txt("CRUISERS  "+lstr,W-14,28,17,"#9fe8ff","right");
    txt("TIER "+tier.n+" — "+tier.name,W/2,28,Math.min(16,W*0.028),tier.color,"center");
    // progress line: quota for conveyor tiers, count for grid tiers
    if(tier.form==="conveyor")
      txt(G.killsThisLevel+" / "+CONFIG.conveyorQuota+" CLAIMED",W/2,48,12,"#889","center");
    else if(tier.form==="grid")
      txt(G.enemies.filter(e=>e.alive).length+" UNCLAIMED",W/2,48,12,"#889","center");
    else
      txt("YOU CANNOT SHOOT A CONCEPT",W/2,48,12,"#c9a0ff","center");
  }
  ctx.restore();

  // overlays
  if(G.state==="start")drawStart();
  if(G.state==="pause"){
    shade(); txt("PAUSED",W/2,H/2,Math.min(56,W*0.1),"#ffd166");
    txt("▶ OR P TO RESUME THE ASCENT",W/2,H/2+40,15,"#9fe8ff");
  }
  if(G.state==="entry")drawEntry();
  if(G.state==="lose")drawLose();
  if(G.state==="gallery")drawGallery();
}

function drawStart(){
  txt("SPACE",W/2,H*0.20,Math.min(70,W*0.12),"#ff5a7a");
  txt("COLONIALISM",W/2,H*0.20+62,Math.min(70,W*0.12),"#ffd166");
  txt("CLIMB THE LADDER OF BEING. TIER BY TIER.",W/2,H*0.20+112,16,"#9fe8ff");
  txt("🤖 → 🐭 → 🐜 → 🦎 → 🦍 → 🧍 → 🌌   ·   10 TIERS   ·   REACH THE WALL = WIN",W/2,H*0.20+140,13,"#c9a0ff");
  txt("← →  /  A D  /  MOUSE   ·   SPACE / CLICK = FIRE   ·   P = PAUSE",W/2,H*0.20+166,13,"#889");
  txt("YOU CANNOT SHOOT THE CONCEPTS. DYING THERE IS THE WIN.",W/2,H*0.20+192,13,"#a98cff");

  // THE ROLL OF THE FALLEN — memorial, if any souls have reached the wall.
  drawRoll(W/2,H*0.20+236,loadFallen());

  // a banked run — offer the continue lane above the gallery lane
  const run=loadRun();
  if(run) txt("RUN IN PROGRESS — TIER "+(run.level+1)+" · "+run.score+" SYSTEMS — C · TAP HERE TO CONTINUE",W/2,H*0.845,13,"#9cff57");
  txt("L · TAP HERE — LEGENDS GALLERY",W/2,H*0.89,13,"#a98cff");
  txt("PRESS SPACE · CLICK · TAP TO BEGIN THE ASCENT",W/2,H*0.94,15,blink());
}

function drawLose(){
  shade();
  // reaching the wall is the WIN. tier-10 death gets the reverent MEMENTO MORI
  // + the roll of the fallen. every other death is the deadpan empire joke.
  if(G.loseMsg==="__GODMODE__"){
    txt("MEMENTO MORI",W/2,H*0.16,Math.min(52,W*0.095),"#c9a0ff");
    let y=H*0.16+40;
    for(const line of GODLINES){ txt(line,W/2,y,Math.min(18,W*0.033),"#e7d8ff"); y+=26; }

    // the roll of the fallen — newest first, this run included.
    const roll=(G.entry&&G.entry.roll)?G.entry.roll:loadFallen();
    drawRoll(W/2,y+18,roll);

    txt("SYSTEMS CLAIMED  "+G.score+(hallRank()?"   ·   HALL OF FAME #"+hallRank():""),W/2,H*0.90,16,"#9cff57");
    txt("PRESS ENTER · TAP TO CLIMB AGAIN",W/2,H*0.94,14,blink());
    return;
  }
  txt("GAME OVER",W/2,H/2-90,Math.min(52,W*0.093),"#ff5a7a");
  txt(G.loseMsg||"THE EMPIRE BROKE. IT ALWAYS DOES.",W/2,H/2-48,Math.min(19,W*0.038),"#ffd166");
  txt("REACHED  TIER "+curTier().n+" — "+curTier().name,W/2,H/2-10,Math.min(16,W*0.03),curTier().color);
  txt("SYSTEMS CLAIMED  "+G.score+(hallRank()?"   ·   HALL OF FAME #"+hallRank():""),W/2,H/2+28,17,"#9cff57");
  txt("THE LADDER HAS NO TOP RUNG YOU CAN STAND ON.",W/2,H/2+56,12,"#778");
  txt("L = LEGENDS GALLERY",W/2,H/2+76,12,"#a98cff");
  txt("PRESS ENTER · TAP TO OVERREACH AGAIN",W/2,H/2+98,15,blink());
}

// ── THE LEGENDS GALLERY — the full memorial, browsable. left: EVERY fallen
//    soul (the start screen only shows a cap), scroll with ↑↓ / wheel.
//    right: the HALL OF FAME — top 10 empires by systems claimed. ──
let galScroll=0;
function drawGallery(){
  shade();
  txt("· LEGENDS GALLERY ·",W/2,H*0.10,Math.min(34,W*0.06),"#c9a0ff");

  // left column — the roll, ALL of it, newest first
  const roll=loadFallen().slice().reverse();
  const rows=Math.max(4,Math.floor((H*0.62)/22));
  txt("THE ROLL OF THE FALLEN — "+roll.length+" SOULS",W*0.28,H*0.18,14,"#a98cff");
  galScroll=Math.max(0,Math.min(galScroll,Math.max(0,roll.length-rows)));
  if(roll.length===0) txt("no one has reached the wall yet.",W*0.28,H*0.18+28,12,"#778");
  let y=H*0.18+28;
  for(const e of roll.slice(galScroll,galScroll+rows)){
    txt((e.initials||"???")+"   "+(e.date||"").slice(0,10),W*0.28,y,14,"#b9a9d9"); y+=22;
  }
  if(roll.length>rows)
    txt("↑ ↓ / wheel — "+(galScroll+1)+"–"+Math.min(roll.length,galScroll+rows)+" of "+roll.length,
      W*0.28,H*0.86,11,"#667");

  // right column — the hall of fame
  txt("HALL OF FAME — SYSTEMS CLAIMED",W*0.72,H*0.18,14,"#9cff57");
  const hof=loadHof();
  if(hof.length===0) txt("no empires on record yet.",W*0.72,H*0.18+28,12,"#778");
  let y2=H*0.18+28;
  hof.forEach(function(e,i){
    txt((i+1)+".  "+e.s+"  ·  tier "+e.t+"  ·  "+(e.date||"").slice(0,10),
      W*0.72,y2,14,(e.when===lastHofWhen)?"#d6ff9e":"#8fd47a"); y2+=22;
  });

  txt("ESC · L · TAP TO RETURN",W/2,H*0.94,13,blink());
}
// galleryTap — the start screen's gallery line is a tap target; inside the
// gallery any tap returns. returns true when the tap was consumed.
function galleryTap(px,py){
  if(G.state==="gallery"){ G.state="start"; return true; }
  if(G.state==="start" && py>H*0.86 && py<H*0.92){ galScroll=0; G.state="gallery"; return true; }
  return false;
}
// continueTap — the RUN IN PROGRESS line on the splash is its own tap lane.
function continueTap(px,py){
  if(G.state!=="start"||!loadRun()) return false;
  if(py>H*0.81&&py<=H*0.86){ continueRun(); return true; }
  return false;
}
// hallRank — where THIS run landed in the hall of fame (0 = didn't place).
function hallRank(){
  const h=loadHof();
  for(let i=0;i<h.length;i++) if(h[i].when===lastHofWhen) return i+1;
  return 0;
}

// ── THE ROLL OF THE FALLEN — a short memorial list of initials + date,
//    newest first, capped at CONFIG.fallenShown. drawn centred at (cx,topY). ──
function drawRoll(cx,topY,roll){
  txt("· THE ROLL OF THE FALLEN ·",cx,topY,13,"#c9a0ff");
  if(!roll||roll.length===0){
    txt("no one has reached the wall yet.",cx,topY+22,12,"#778");
    return;
  }
  // newest first, capped for display.
  const shown=roll.slice(-CONFIG.fallenShown).reverse();
  let y=topY+24;
  for(const e of shown){
    const d=(e.date||"").slice(0,10);              // YYYY-MM-DD from the ISO date
    txt((e.initials||"???")+"   "+d,cx,y,13,"#b9a9d9");
    y+=18;
  }
  txt("taken by a concept · remembered here",cx,y+6,11,"#667");
}

// ── INITIALS ENTRY overlay — three glowing slots + an OK button.
//    the caret pulses on the active slot. classic arcade, quick + clean. ──
function drawEntry(){
  shade();
  txt("MEMENTO MORI",W/2,H*0.16,Math.min(52,W*0.095),"#c9a0ff");
  txt("you were the last mortal being — taken by a concept.",W/2,H*0.16+38,Math.min(15,W*0.03),"#e7d8ff");
  txt("ENTER YOUR INITIALS FOR THE ROLL OF THE FALLEN",W/2,H*0.16+64,13,"#a98cff");

  const L=entryLayout();
  const on=(performance.now()%800<400);            // caret pulse
  for(let i=0;i<3;i++){
    const s=L.slots[i], active=(G.entry.slot===i);
    // slot plate
    ctx.fillStyle=active?"rgba(120,90,220,0.30)":"rgba(40,30,70,0.55)";
    roundRect(s.x,s.y,s.w,s.h,10); ctx.fill();
    ctx.strokeStyle=active?"#c9a0ff":"#4a3d78"; ctx.lineWidth=2;
    roundRect(s.x,s.y,s.w,s.h,10); ctx.stroke();
    // the letter
    if(active){ ctx.shadowColor="rgba(210,180,255,0.9)"; ctx.shadowBlur=s.w*0.4; }
    txt(ENTRY_ALPHABET[G.entry.letters[i]],s.x+s.w/2,s.y+s.h*0.66,Math.min(46,s.w*0.7),
      active?(on?"#ffffff":"#d8c6ff"):"#b9a9d9");
    ctx.shadowBlur=0;
    // little scroll arrows on the active slot
    if(active){
      txt("▲",s.x+s.w/2,s.y-4,12,"#c9a0ff");
      txt("▼",s.x+s.w/2,s.y+s.h+16,12,"#c9a0ff");
    }
  }

  // OK button
  const o=L.ok;
  ctx.fillStyle="rgba(87,182,255,0.18)";
  roundRect(o.x,o.y,o.w,o.h,8); ctx.fill();
  ctx.strokeStyle="#57b6ff"; ctx.lineWidth=2;
  roundRect(o.x,o.y,o.w,o.h,8); ctx.stroke();
  txt("OK",o.x+o.w/2,o.y+o.h*0.68,Math.min(22,o.h*0.6),"#9fe8ff");

  txt("TYPE A-Z  ·  ← → SLOT  ·  ↑ ↓ LETTER  ·  ENTER / TAP OK",W/2,H*0.92,13,"#889");
}

function shade(){ctx.fillStyle="rgba(0,0,0,0.68)";ctx.fillRect(0,0,W,H);}
function blink(){return (performance.now()%1000<500)?"#fff":"#667";}

// ─────────────────────────────────────────────────────────────────────────
//  the loop
// ─────────────────────────────────────────────────────────────────────────

let last=performance.now();
function loop(ts){
  const dt=Math.min(2,Math.max(0.2,(ts-last)/16.667)); last=ts;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
// ════════════════════════════════════════════════════════════════════════
//  you climbed the whole tree of life to shoot an idea.
//  the idea does not blink. look into the void — tell me when it turns lavender.

</script>
