<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- THE CALL BELL (the desk bell / counter bell / service bell — "call bell" is the trade name).
       Drawn 2026-08-24 as the library's SEARCH fire: you do not submit a form at a library, you ring
       for the librarian. Two-tone brass so it reads on the dark card and on the paper card alike. -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c86a"/><stop offset=".45" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6b16"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a227"/><stop offset="1" stop-color="#6b5210"/>
    </linearGradient>
  </defs>
  <!-- the plunger: stem + button -->
  <rect x="47" y="16" width="6" height="12" rx="2" fill="url(#base)"/>
  <ellipse cx="50" cy="15" rx="11" ry="5" fill="url(#brass)"/>
  <ellipse cx="50" cy="13.5" rx="7" ry="3" fill="#f2dd9a" opacity=".75"/>
  <!-- the dome -->
  <path d="M17 66 A33 31 0 0 1 83 66 Z" fill="url(#brass)"/>
  <path d="M28 60 A22 22 0 0 1 44 40" fill="none" stroke="#f6e6ae" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <!-- the base plate -->
  <ellipse cx="50" cy="66" rx="33" ry="7" fill="url(#base)"/>
  <rect x="14" y="66" width="72" height="7" rx="3.5" fill="url(#base)"/>
  <ellipse cx="50" cy="73" rx="36" ry="8" fill="#7a5e13"/>
  <ellipse cx="50" cy="71.5" rx="36" ry="7" fill="url(#brass)"/>
</svg>
