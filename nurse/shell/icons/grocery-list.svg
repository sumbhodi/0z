      <rect x="70" y="60" width="20" height="20" rx="5" fill="url(#ck)"/>
      <path d="M74.5 70.5 l4 4.5 l7.5 -9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="100" y="66" width="84" height="8" rx="4" fill="#c8bfa9"/>
      <rect x="98" y="68.5" width="88" height="3" rx="1.5" fill="#9a917c"/>
    </g>
    <g>
      <rect x="70" y="96" width="20" height="20" rx="5" fill="url(#ck)"/>
      <path d="M74.5 106.5 l4 4.5 l7.5 -9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="100" y="102" width="66" height="8" rx="4" fill="#c8bfa9"/>
      <rect x="98" y="104.5" width="70" height="3" rx="1.5" fill="#9a917c"/>
    </g>
    <g>
      <rect x="70" y="132" width="20" height="20" rx="5" fill="url(#ck)"/>
      <path d="M74.5 142.5 l4 4.5 l7.5 -9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="100" y="138" width="78" height="8" rx="4" fill="#c8bfa9"/>
      <rect x="98" y="140.5" width="82" height="3" rx="1.5" fill="#9a917c"/>
    </g>

    <!-- still to get -->
    <g>
      <rect x="70" y="168" width="20" height="20" rx="5" fill="#fffdf7" stroke="#a89e88" stroke-width="3"/>
      <rect x="100" y="174" width="72" height="8" rx="4" fill="#8d8471"/>
    </g>
    <g>
      <rect x="70" y="204" width="20" height="20" rx="5" fill="#fffdf7" stroke="#a89e88" stroke-width="3"/>
      <rect x="100" y="210" width="58" height="8" rx="4" fill="#8d8471"/>
    </g>
