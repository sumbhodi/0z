<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72" role="img" aria-label="meh: the cat is not impressed">
  <g fill="#f4efe1" stroke="#14110c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- head with two ears -->
    <path d="M14 30 L12 10 L24 18 L40 18 L52 10 L50 30 C50 42 42 48 32 48 C22 48 14 42 14 30 Z"/>
  </g>
  <!-- half-lidded eyes: a lid line over each eye -->
  <g stroke="#14110c" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M21 30 L29 30"/><path d="M35 30 L43 30"/>
  </g>
  <circle cx="25" cy="32" r="2" fill="#14110c"/><circle cx="39" cy="32" r="2" fill="#14110c"/>
  <!-- the flat mouth -->
  <path d="M27 41 L37 41" stroke="#14110c" stroke-width="3" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#14110c" stroke-width="2" stroke-linecap="round">
    <path d="M6 34 L16 36"/><path d="M6 40 L16 39"/><path d="M58 34 L48 36"/><path d="M58 40 L48 39"/>
  </g>
  <text x="32" y="66" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="700" font-size="13" fill="#14110c" letter-spacing="2">meh</text>
</svg>
