<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clock · retro</title>
<link rel="icon" href="favicon.svg">
<script src="clock-defaults.js?v=20260903122117"></script>
<script src="geo.js?v=20260903122117"></script>
<style>
  /* THE TYPE FLOOR (IC: "nothing tiny") — these were 10-13px monospace LABELS ("AQ", the day,
     "close"), not segment art. Sum has dyslexia; they were unreadable. One token, raised once. */
  :root { --fs-min: 16px; }

@font-face {
  font-family: 'DSEG7';
  src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2');
  font-weight: normal;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }

body {
  /* 80s clock radio — dark plastic casing, warm center glow */
  background:
    radial-gradient(ellipse at 50% 40%,
      #1a0c00 0%,
      #0d0600 45%,
      #050200 100%);
  background-attachment: fixed;
  background-size: cover;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: auto;
  font-family: 'Courier New', monospace;
  color: #ff8800;
  padding: 32px;
}

/* ═══════════════════════════════════════════════════
   ZONE GRID — same 5-zone structure as clock.html
   clock = anchor. left/right stretch full height.
   ═══════════════════════════════════════════════════ */

.clock-layout {
  display: inline-grid;
  grid-template-areas:
    "left top   right"
    "left clock right"
    "left bot   right";
  column-gap: 24px;
  row-gap: 12px;
  transform: scale(var(--clock-scale, 1));
  transform-origin: top center;
}

[data-zone="top"]    { grid-area: top; }
[data-zone="left"]   { grid-area: left;  align-self: stretch;
                        display: flex; flex-direction: column;
                        justify-content: space-between; }
[data-zone="clock"]  { grid-area: clock; }
[data-zone="right"]  { grid-area: right; align-self: stretch;
                        display: flex; flex-direction: column;
                        justify-content: space-between; }
[data-zone="bottom"] { grid-area: bot; }


/* ── date row — top zone ────────────────────────── */

.date-row {
  font-family: 'Courier New', monospace;
  font-size: 52px;
  font-weight: bold;
  color: #cc6600;
  text-shadow: 0 0 8px rgba(255,120,0,0.3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: flex;
  gap: 32px;
  opacity: 0.85;
}

.date-part { position: relative; }
.date-part::before {
  content: attr(data-ghost);
  position: absolute;
  inset: 0;
  color: #2a1000;
  z-index: -1;
  text-shadow: none;
}


/* ── clock digits — center zone ─────────────────── */

.clock {
  display: flex;
  align-items: center;
  gap: 8px;
}

.digit {
  font-family: 'DSEG7', monospace;
  font-size: 180px;
  color: #ff8800;
  text-shadow: 0 0 12px rgba(255,136,0,0.5);
  line-height: 1;
  position: relative;
  width: 148px;
  text-align: center;
}
.digit::before {
  content: '8';
  position: absolute;
  inset: 0;
  color: #1f0900;
  text-shadow: none;
  z-index: -1;
  text-align: center;
}

.colon {
  font-family: 'DSEG7', monospace;
  font-size: 120px;
  color: #ff8800;
  text-shadow: 0 0 8px rgba(255,136,0,0.4);
  line-height: 1;
  margin-bottom: 12px;
  width: 40px;
  text-align: center;
  animation: blink 1s step-start infinite;  /* exact 1s — usable as second hand */
}

@keyframes blink {
  0%, 49.9% { opacity: 1; }
  50%, 100%  { opacity: 0.08; }
}


/* ── left zone — UV / AQI / PM / weather ────────── */

.aq-box {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  text-align: right;
}

.aq-label {
  font-family: monospace;
  font-size: var(--fs-min);
  font-weight: bold;
  color: #7a3a00;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.aq-val {
  font-family: 'DSEG7', monospace;
  font-size: 28px;
  color: #ff8800;
  text-shadow: 0 0 6px rgba(255,136,0,0.35);
  line-height: 1;
  min-width: 2ch;
  text-align: right;
  position: relative;
}


/* ── right zone — solar / lunar / weather ────────── */

.rs-card {
  display: flex;
  align-items: center;
  gap: 10px;
}

.rs-times {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rs-time {
  font-family: 'DSEG7', monospace;
  font-size: 22px;
  color: #ff8800;
  text-shadow: 0 0 6px rgba(255,136,0,0.35);
  line-height: 1;
  position: relative;
}
.rs-time::before {
  content: '88:88';
  position: absolute;
  inset: 0;
  color: #1f0900;
  text-shadow: none;
  z-index: -1;
}

.rs-icon {
  font-size: 40px;
  line-height: 1;
  flex-shrink: 0;
  filter: sepia(1) saturate(2) hue-rotate(-10deg) brightness(0.85);
}

.wx-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.wx-temp {
  font-family: 'DSEG7', monospace;
  font-size: 16px;
  color: #cc6600;
  text-shadow: 0 0 6px #ff6600;
  line-height: 1;
}

/* sun arc tracker */
.sun-step {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 0;
}

.sun-track {
  position: relative;
  width: 88px;
  height: 4px;
  background: rgba(255,136,0,0.12);
  border-radius: 2px;
  overflow: visible;
}

.sun-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  background: rgba(255,136,0,0.4);
  border-radius: 2px;
  transition: width 1s linear;
}

.sun-dot {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px;
  line-height: 1;
  pointer-events: none;
  transition: left 1s linear;
}

/* BIC state */


/* ── bottom zone — forecast row ─────────────────── */

.forecast-row {
  display: flex;
  gap: 20px;
  opacity: 0.75;
}

.fc-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.fc-card:hover { opacity: 1; }

.fc-top  { display: flex; align-items: center; gap: 5px; }
.fc-day  {
  font-family: 'Courier New', monospace;
  font-size: var(--fs-min);
  font-weight: bold;
  color: #994400;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.fc-icon {
  font-size: 28px;
  line-height: 1;
  filter: sepia(1) saturate(1.5) hue-rotate(-10deg) brightness(0.8);
}
.fc-temp {
  font-family: 'DSEG7', monospace;
  font-size: 16px;
  color: #cc6600;
  text-shadow: 0 0 4px rgba(255,100,0,0.3);
  white-space: nowrap;
}


/* ── detail overlay ─────────────────────────────── */

.detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.detail-overlay.open { display: flex; }

.detail-box { text-align: center; }
.detail-day   { font-family: monospace; font-size: var(--fs-min); letter-spacing: 0.16em;
                text-transform: uppercase; color: #7a3a00; margin-bottom: 12px; }
.detail-icon  { font-size: 56px; margin-bottom: 12px; }
.detail-temp  { font-family: 'DSEG7', monospace; font-size: 48px; color: #ff8800;
                text-shadow: 0 0 20px #ff6600; margin-bottom: 8px; }
.detail-desc  { font-family: monospace; font-size: 14px; color: #7a3a00;
                margin-bottom: 24px; letter-spacing: 0.06em; }
.detail-close { font-family: monospace; font-size: var(--fs-min); color: #3a1800;
                cursor: pointer; letter-spacing: 0.14em; text-transform: uppercase; }
.detail-close:hover { color: #cc6600; }

/* controls injected by clock-controls.js */
</style>
</head>
<body>

<div class="clock-layout">

  <!-- TOP ZONE: date row -->
  <div data-zone="top">
    <div class="date-row" id="date-row"></div>
  </div>

  <!-- LEFT ZONE: UV / AQI / PM / humidity / wind / rain / feels -->
  <div data-zone="left">
    <div class="aq-box">
      <div class="aq-label">UV</div>
      <div class="aq-val" id="aq-uv">0</div>
    </div>
    <div class="aq-box">
      <div class="aq-label">AQI</div>
      <div class="aq-val" id="aq-aqi">00</div>
    </div>
    <div class="aq-box">
      <div class="aq-label">PM2.5</div>
      <div class="aq-val" id="aq-pm">00</div>
    </div>
    <div class="aq-box">
      <div class="aq-label">Humidity</div>
      <div class="aq-val" id="aq-hum">--</div>
    </div>
    <div class="aq-box">
      <div class="aq-label">Wind</div>
      <div class="aq-val" id="aq-wind">--</div>
    </div>
    <div class="aq-box">
      <div class="aq-label">Rain</div>
      <div class="aq-val" id="aq-rain">--</div>
    </div>
    <div class="aq-box">
      <div class="aq-label">Feels</div>
      <div class="aq-val" id="aq-feel">--</div>
    </div>
  </div>

  <!-- CLOCK ZONE -->
  <div data-zone="clock">
    <div class="clock">
      <div class="digit" id="h0">0</div>

  <!-- RIGHT ZONE: BIC · weather · solar · sun arc · lunar · moon -->
  <div data-zone="right">

    <div class="wx-badge">
      <div class="rs-icon" id="wx-icon">⛅</div>

    <!-- moon phase — own slot -->
    <div class="rs-icon" id="moon-icon" style="text-align:center; filter:sepia(1) saturate(2) hue-rotate(-10deg) brightness(0.85)">🌑</div>

  <!-- BOTTOM ZONE: forecast -->
  <div data-zone="bottom">
    <div class="forecast-row" id="forecast-row"></div>

</div><!-- /clock-layout -->

<!-- detail overlay -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-box">
    <div class="detail-day"  id="d-day"></div>
    <div class="detail-icon" id="d-icon"></div>
    <div class="detail-temp" id="d-temp"></div>
    <div class="detail-desc" id="d-desc"></div>
    <div class="detail-close" id="d-close">dismiss</div>
  </div>
</div>

<script>
// ── clock ─────────────────────────────────────────────────
const h0 = document.getElementById('h0')
const h1 = document.getElementById('h1')
const m0 = document.getElementById('m0')
const m1 = document.getElementById('m1')

function tick() {
  const now = new Date()
  let h = now.getHours() % 12 || 12
  h0.textContent = String(Math.floor(h / 10))
  h1.textContent = String(h % 10)
  m0.textContent = String(Math.floor(now.getMinutes() / 10))
  m1.textContent = String(now.getMinutes() % 10)
}
tick(); setInterval(tick, 1000)

// ── date row ──────────────────────────────────────────────
const DAYS_FULL   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
const MONTHS_FULL = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December']
const DAY_GHOST   = ['XXXXXXXX','XXXXXX','XXXXXXX','XXXXXXXXX','XXXXXXXX','XXXXXX','XXXXXXXX']
const MON_GHOST   = ['XXXXXXX','XXXXXXXX','XXXXX','XXXXX','XXXX','XXXX',
                     'XXXX','XXXXXX','XXXXXXXXX','XXXXXXX','XXXXXXXX','XXXXXXXX']

const dateRow = document.getElementById('date-row')

function updateDate() {
  const now = new Date()
  const day = DAYS_FULL[now.getDay()].slice(0,3)
  const mon = MONTHS_FULL[now.getMonth()].slice(0,3)
  dateRow.innerHTML = `
    <span class="date-part" data-ghost="${day}">${day}</span>
    <span class="date-part" data-ghost="${mon}">${mon}</span>
    <span class="date-part" data-ghost="${now.getDate()}">${now.getDate()}</span>
    <span class="date-part" data-ghost="${now.getFullYear()}">${now.getFullYear()}</span>
  `
}
updateDate(); setInterval(updateDate, 60000)

// ── geo helper ────────────────────────────────────────────
async function geoLatLon() {
  return window.geo.coords()   // one chain, in geo.js
}

// ── weather ───────────────────────────────────────────────
const WX_ICON = {
  0:'☀️',1:'🌤',2:'⛅',3:'☁️',
  45:'🌫',48:'🌫',
  51:'🌦',53:'🌦',55:'🌧',
  61:'🌧',63:'🌧',65:'🌧',
  71:'🌨',73:'🌨',75:'❄️',
  80:'🌦',81:'🌧',82:'⛈',
  95:'⛈',96:'⛈',99:'⛈',
}
const WX_DESC = {
  0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Overcast',
  45:'Foggy',48:'Icy Fog',
  51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',
  61:'Light Rain',63:'Rain',65:'Heavy Rain',
  71:'Light Snow',73:'Snow',75:'Heavy Snow',
  80:'Showers',81:'Rain Showers',82:'Violent Showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm',
}

const overlay = document.getElementById('detail-overlay')
document.getElementById('d-close').addEventListener('click', () => overlay.classList.remove('open'))
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open') })

function showDetail(label, icon, temp, desc) {
  document.getElementById('d-day').textContent  = label
  document.getElementById('d-icon').textContent = icon
  document.getElementById('d-temp').textContent = temp
  document.getElementById('d-desc').textContent = desc
  overlay.classList.add('open')
}

async function fetchWeather() {
  try {
    const [lat, lon] = await geoLatLon()
    const url = `https://api.open-meteo.com/v1/forecast`
      + `?latitude=${lat}&longitude=${lon}`
      + `&current=temperature_2m,weathercode,relative_humidity_2m,apparent_temperature,windspeed_10m`
      + `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      + `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=8`
    const d   = await fetch(url).then(r => r.json())
    const row = document.getElementById('forecast-row')
    row.innerHTML = ''

    const MOON_ICONS = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘']
    const daysSince  = (Date.now() - new Date('2000-01-06').getTime()) / 86400000
    document.getElementById('moon-icon').textContent = MOON_ICONS[Math.round((daysSince % 29.53) / 29.53 * 8) % 8]

    document.getElementById('wx-icon').textContent = WX_ICON[d.current.weathercode] || '⛅'
    document.getElementById('wx-temp').textContent = Math.round(d.current.temperature_2m) + '°'

    if (d.current?.relative_humidity_2m != null)
      document.getElementById('aq-hum').textContent  = Math.round(d.current.relative_humidity_2m) + '%'
    if (d.current?.apparent_temperature != null)
      document.getElementById('aq-feel').textContent = Math.round(d.current.apparent_temperature) + '°'
    if (d.current?.windspeed_10m != null)
      document.getElementById('aq-wind').textContent = Math.round(d.current.windspeed_10m)
    if (d.daily?.precipitation_probability_max?.[0] != null)
      document.getElementById('aq-rain').textContent = d.daily.precipitation_probability_max[0] + '%'

    const days = d.daily.time, hi = d.daily.temperature_2m_max
    const lo   = d.daily.temperature_2m_min, codes = d.daily.weathercode

    days.forEach((iso, i) => {
      const date  = new Date(iso + 'T12:00:00')
      const label = DAYS_FULL[date.getDay()]
      const icon  = WX_ICON[codes[i]] || '?'
      const hiN   = Math.round(hi[i]), loN = Math.round(lo[i])
      const card  = document.createElement('div')
      card.className = 'fc-card'
      card.innerHTML = `<div class="fc-top">
                          <div class="fc-day">${label.slice(0,3)}</div>
                          <div class="fc-icon">${icon}</div>
                        </div>
                        <div class="fc-temp">${hiN}/${loN}</div>`
      card.addEventListener('click', () => showDetail(label, icon, `${hiN}° / ${loN}°`, WX_DESC[codes[i]] || ''))
      row.appendChild(card)
    })
  } catch(e) { console.warn('weather failed', e) }
}
fetchWeather(); setInterval(fetchWeather, 10 * 60 * 1000)

// ── solar ─────────────────────────────────────────────────
async function fetchSolar() {
  try {
    const [lat, lon] = await geoLatLon()
    const d = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=sunrise,sunset&timezone=auto&forecast_days=1`).then(r => r.json())
    const fmt = iso => { try { const t = new Date(iso); return `${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}` } catch { return '--:--' } }
    if (d.daily?.sunrise?.[0]) {
      document.getElementById('sol-rise').textContent = fmt(d.daily.sunrise[0])
      window._sunRise = new Date(d.daily.sunrise[0])
    }
    if (d.daily?.sunset?.[0]) {
      document.getElementById('sol-set').textContent  = fmt(d.daily.sunset[0])
      window._sunSet = new Date(d.daily.sunset[0])
    }
    updateSunArc()
  } catch(e) {}
}

function updateSunArc() {
  const fill = document.getElementById('sun-fill')
  const dot  = document.getElementById('sun-dot')
  if (!fill || !dot || !window._sunRise || !window._sunSet) return
  const now  = Date.now()
  const rise = window._sunRise.getTime()
  const set  = window._sunSet.getTime()
  const span = set - rise
  if (span <= 0) return
  const pct = Math.max(0, Math.min(100, (now - rise) / span * 100))
  fill.style.width = pct + '%'
  dot.style.left   = pct + '%'
}

fetchSolar()
setInterval(fetchSolar,   60 * 60 * 1000)
setInterval(updateSunArc, 60 * 1000)

// ── lunar ─────────────────────────────────────────────────
async function fetchLunar() {
  try {
    const [lat, lon] = await geoLatLon()
    const now  = new Date()
    const date = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`
    const tz   = -(now.getTimezoneOffset() / 60)
    const d    = await fetch(`https://aa.usno.navy.mil/api/rstt/oneday?date=${date}&coords=${lat},${lon}&tz=${tz}`).then(r => r.json())
    const moon = d.properties?.data?.moondata || []
    const rise = moon.find(e => e.phen === 'Rise')
    const set  = moon.find(e => e.phen === 'Set')
    if (rise) document.getElementById('lun-rise').textContent = rise.time.slice(0,5)
    if (set)  document.getElementById('lun-set').textContent  = set.time.slice(0,5)
  } catch(e) {}
}
fetchLunar(); setInterval(fetchLunar, 60 * 60 * 1000)

// ── air quality ───────────────────────────────────────────
async function fetchAirQuality() {
  try {
    const [lat, lon] = await geoLatLon()
    const d = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=uv_index,us_aqi,pm2_5&timezone=auto`).then(r => r.json())
    const c = d.current
    if (c?.uv_index != null) document.getElementById('aq-uv').textContent  = Math.round(c.uv_index)
    if (c?.us_aqi   != null) document.getElementById('aq-aqi').textContent = Math.round(c.us_aqi)
    if (c?.pm2_5    != null) document.getElementById('aq-pm').textContent  = Math.round(c.pm2_5)
  } catch(e) {}
}
fetchAirQuality(); setInterval(fetchAirQuality, 30 * 60 * 1000)
