<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐍 Snake v1.6</title>
    <style>
        /* ── tan-grid skin — warm sand field, geometric snake, NO image ── */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;

            /* was url('pixleated.png') — the tan grid now lives on the CANVAS.
               a quiet warm backdrop frames the board, no external asset. */
            background: #1a140c;
            position: relative;
            overflow: hidden;
        }

        /* nirvana skin — the whole page drifts through the spectrum */
        .nirvana-mode {
            animation: cosmicShift 40s ease-in-out infinite;
        }

        @keyframes cosmicShift {
            0% { filter: hue-rotate(0deg) saturate(1.2) brightness(1.1); }
            14% { filter: hue-rotate(30deg) saturate(1.3) brightness(1.15); }
            28% { filter: hue-rotate(60deg) saturate(1.4) brightness(1.2); }
            42% { filter: hue-rotate(120deg) saturate(1.3) brightness(1.15); }
            56% { filter: hue-rotate(180deg) saturate(1.2) brightness(1.1); }
            70% { filter: hue-rotate(240deg) saturate(1.3) brightness(1.15); }
            84% { filter: hue-rotate(300deg) saturate(1.4) brightness(1.2); }
            100% { filter: hue-rotate(360deg) saturate(1.2) brightness(1.1); }
        }

        #nirvanaControlsInPause {
            background: rgba(138, 43, 226, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #d4a5ff;
            margin-top: 20px;
        }

        #nirvanaControlsInPause h3 {
            color: #FFD700;
            font-size: 18px;
            margin-bottom: 10px;
        }

        #nirvanaControlsInPause .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: center;
        }

        #nirvanaControlsInPause button {
            padding: 10px 16px;
            font-size: 14px;
        }

        #gameContainer {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;

        }

        /* hud row — score + level + the pause button, one neon line */
        #hud {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 20px;
            color: #00ff9d;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
            white-space: nowrap;   /* Score: 6   Level: 1 — one row, value inline */
        }

        /* the on-screen pause/play toggle — small, sits with the score */
        #pauseBtn {
            font-size: 18px;
            line-height: 1;
            padding: 6px 12px;
            color: #ff8c00;
            background: rgba(0, 255, 157, 0.12);
            border: 2px solid rgba(0, 255, 157, 0.5);
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0, 255, 157, 0.3);
            text-transform: none;
            letter-spacing: 0;
            margin: 0;
        }

        #gameCanvas {
            border: 3px solid rgba(0, 255, 157, 0.3);
            border-radius: 15px;
            display: block;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.2);

            /* the field stays quiet — no text-select, no touch scroll, no menu */

            user-select: none;
            -webkit-user-select: none;
            cursor: crosshair;
        }

        body.nirvana-mode #gameCanvas {
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.4);
            animation: gridPulse 3s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            }

                box-shadow: 0 0 60px rgba(168, 85, 247, 0.7);
            }

        #startToast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 420px;
            background: rgba(0, 0, 0, 0.9);
            color: #FFD700;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            z-index: 1001;
            display: block;

        }

        #nirvanaChoice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 31, 20, 0.98);
            padding: 24px 18px;            /* was 40px 60px — 120px of side padding overflowed the phone */

            text-align: center;
            border: 3px solid #d4a5ff;
            /* 2nd shadow = a huge-spread dim that covers the whole phone behind the dialog (position:fixed →

            z-index: 2000;
            width: 90%;

            box-sizing: border-box;
            max-height: 92vh;
            overflow-y: auto;
        }

        #pauseScreen {
            position: fixed;

            left: 50%;

            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #00ff9d;
            /* same full-phone dim as the nirvana dialog — the playfield goes dark behind PAUSED */

            display: none;
            z-index: 2000;
            max-height: 80vh;
            overflow-y: auto;
            max-width: 90vw;
            -webkit-overflow-scrolling: touch;
        }

        #pauseScreen h1 {
            color: #00ff9d;
            font-size: 20px;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.8);
        }

        /* tiny hint under PAUSED — how to resume */
        #pauseScreen .hint {
            color: rgba(0, 255, 157, 0.6);
            font-size: 12px;
            font-style: italic;
            margin-bottom: 8px;
        }

        #pauseScreen input {
            width: 100px;
            padding: 6px;
            margin: 8px 0;
            background: rgba(0, 255, 157, 0.1);
            border: 2px solid #00ff9d;
            border-radius: 6px;
            color: #00ff9d;
            font-size: 14px;
            text-align: center;
        }

        #pauseScreen input::placeholder {
            color: rgba(0, 255, 157, 0.3);
            font-style: italic;
        }

        #pauseScreen .button-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        #nirvanaChoice h1 {
            color: #d4a5ff;
            font-size: 22px;            /* was 42px */
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(212, 165, 255, 0.8);
        }

        #nirvanaChoice p {
            color: #b8a3ff;
            font-size: 13px;            /* was 18px */
            margin-bottom: 14px;
            line-height: 1.4;
        }

        #nirvanaChoice .choice-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        #nirvanaChoice .choice-btn {
            padding: 11px 12px;         /* was 15px 30px */
            font-size: 14px;
            min-width: 0;               /* was 250px — that's what forced the buttons past the frame edge */
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            white-space: normal;        /* let the (…keep score & speed) caption wrap instead of overflow */
            line-height: 1.25;
        }

        button {
            background: linear-gradient(135deg, #d4a5ff, #9d4edd);
            color: #0a1f14;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 5px;

            letter-spacing: 0.5px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 165, 255, 0.8);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div id="startToast">
    tap the board to wake it,<br>
    space / ⏸ = play · pause<br>
    arrows or WASD steer · click L / R turns
</div>

<div id="gameContainer">
    <div id="hud">
        <div id="score">Score: 0</div>
        <div id="level">Level: 1</div>
        <button id="pauseBtn" title="pause / play (space)">⏸</button>
    </div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
</div>

<div id="pauseScreen">
    <h1>⏸ PAUSED</h1>
    <div class="hint">▶ or space to resume</div>
    <input type="text" id="cheatInput" placeholder="n">
    <div class="button-group">
        <button onclick="resumeFromPause()">Continue</button>
        <button onclick="restart()">Restart</button>
    </div>

    <!-- Nirvana controls (shows only in Nirvana mode) -->
    <div id="nirvanaControlsInPause" style="display: none;">
        <div class="control-row">
            <button onclick="adjustNirvanaSpeed(false)">🐌 Slower</button>
            <button onclick="adjustNirvanaSpeed(true)">⚡ Faster</button>
        </div>
        <div class="control-row">
            <button onclick="adjustSnakeSize(-1)">➖ Shrink</button>
            <button onclick="adjustSnakeSize(1)">➕ Grow</button>
        </div>
    </div>

    <!-- Reincarnate button (shows only in Nirvana mode) -->
    <div class="button-group" id="reincarnateButtonGroup" style="display: none; margin-top: 15px;">

<div id="nirvanaChoice">
    <h1>🌌 Nirvana Achieved 🌌</h1>

    <div class="choice-row">
        <button class="choice-btn" onclick="enterEnlightenment()">
            ✨ Immortal<br>
            <small>(∞ colors • ⏸ adjusts speed/size)</small>
        </button>
        <button class="choice-btn" onclick="enterBodhisattva()">
            🙏 Bodhisattva<br>
            <small>(Return mortal, keep score & speed)</small>
        </button>

            🔄 Reincarnation<br>
            <small>(Small snake • Keep score & speed)</small>
        </button>

</div>

<script>
    // ═══════════════════════════════════════════════════════════════
    // 🐍 SNAKE v1.6 - Nirvana Edition (arcade port)
    // ═══════════════════════════════════════════════════════════════
    //
    // ported from toto2-com/snake/game.html — same art, same logic.
    // dropped: the png background + the on-screen d-pad.
    // added:   a pause BUTTON, mouse steering, explicit scroll-kill.
    //
    // ═══════════════════════════════════════════════════════════════

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ═══════════════════════════════════════════════════════════════
    // 🎨 FOOD EMOJIS
    // ═══════════════════════════════════════════════════════════════

    const FOOD_EMOJIS = {
        // Mortal food (10% protein, 60% veggie, 30% fruit)
        proteins: ['🍗', '🥩', '🍖', '🥓', '🍳', '🍟', '🦐', '🤤'],
        veggies: ['🥕', '🥦', '🥬', '🌽', '🍅', '🥒', '🫑', '🥗', '🧅', '🧄', '🥔', '🍆'],
        fruits: ['🍎', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🫐', '🍑', '🍒', '🥝', '🍍', '🥭', '🍐']
    };

    const NIRVANA_FOOD_EMOJIS = {
        // Mystical sustenance for the enlightened
        sparkles: ['✨', '💫', '⭐', '🌟', '💠', '🔆'],
        knowledge: ['📜', '📚', '📖', '📿', '🗝️', '🔮'],
        divine: ['😇', '👼', '🕊️', '🪶', '🌙', '☀️', '🌈'],
        sacred: ['🙏', '🕉️', '☯️', '🔱', '⚛️', '🧿']
    };

    let currentFoodEmoji = '🍎';

    function getRandomFood() {
        if (gameState.nirvanaMode) {
            // Nirvana mode: mystical food
            const categories = Object.values(NIRVANA_FOOD_EMOJIS);
            const randomCategory = categories[Math.floor(Math.random() * categories.length)];
            return randomCategory[Math.floor(Math.random() * randomCategory.length)];
        } else {
            // Mortal mode: healthy food
            const rand = Math.random();
            let category;

            if (rand < 0.1) {
                category = FOOD_EMOJIS.proteins;
            } else if (rand < 0.7) {
                category = FOOD_EMOJIS.veggies;
            } else {
                category = FOOD_EMOJIS.fruits;
            }

            return category[Math.floor(Math.random() * category.length)];
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // 🎨 VISUAL SETTINGS  (← change snake / background colors here)
    // ═══════════════════════════════════════════════════════════════

    const COLORS = {
        background: '#C2A57B',          // warm sand — the tan grid, drawn on canvas
        gridLines: 'rgba(160, 134, 109, 0.2)',
        snakeBody: '#6B7C28',
        snakeNirvana: '#9d4edd',
        snakeScales: '#8B7355',
        snakeScalesInner: '#DEB887',
        nirvanaSnakeScales: '#b8a3ff',
        nirvanaSnakeScalesInner: '#d4a5ff',
        rattle: '#8B7355',
        rattleNirvana: '#d4a5ff',
        tongue: '#DC143C',
        eyes: '#000000'
    };

    // ═══════════════════════════════════════════════════════════════
    // ⚙️ GAME SETTINGS
    // ═══════════════════════════════════════════════════════════════

    // 3 Sep 2026 15:40 (Sum: "snake can fit x for gameplay and be a bit bigger"): on a coarse pointer the board takes the width
    //    (16px of air), not 82% of it — 322 → 377 on a 393 glass. The desk keeps 0.82; the height cap still binds sideways.
    let PHONE = false; try { PHONE = matchMedia('(pointer: coarse)').matches } catch (_) {}
    const MAX_CANVAS_SIZE = Math.min(PHONE ? window.innerWidth - 16 : window.innerWidth * 0.82, window.innerHeight * 0.62, 560);
    let cellSize = 30;

    const levels = [
        { grid: 15, speed: 250, scoreThreshold: 0, name: "Awakening" },
        { grid: 20, speed: 200, scoreThreshold: 27, name: "Growth" },
        { grid: 30, speed: 150, scoreThreshold: 54, name: "Mastery" }
    ];

    let currentLevel = levels[0];

    // ═══════════════════════════════════════════════════════════════
    // 🎮 GAME STATE
    // ═══════════════════════════════════════════════════════════════

    let gameState = {
        snake: [],
        direction: { x: 1, y: 0 },
        nextDirection: { x: 1, y: 0 },
        food: null,
        score: 0,
        level: 1,
        gameLoop: null,
        isRunning: true,
        nirvanaMode: false,
        nirvanaSpeed: 150,  // Separate speed for Nirvana mode adjustments
        tongueOut: false,
        tongueTimer: 0
    };

    // ═══════════════════════════════════════════════════════════════
    // 🔊 AUDIO
    // ═══════════════════════════════════════════════════════════════

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        switch(type) {
            case 'eat':
                oscillator.frequency.value = 440;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
                break;

            case 'levelup':
                oscillator.frequency.value = 523.25;
                oscillator.type = 'triangle';
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
                break;

            case 'nirvana':
                oscillator.frequency.value = 432;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 2);
                break;

            case 'cheat':
                oscillator.frequency.value = 800;
                oscillator.type = 'square';
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.05);
                break;
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // 🎨 DRAWING FUNCTIONS
    // ═══════════════════════════════════════════════════════════════

    function drawBackground() {
        ctx.fillStyle = COLORS.background;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = COLORS.gridLines;
        ctx.lineWidth = 1;

        for (let i = 0; i <= currentLevel.grid; i++) {
            const pos = i * cellSize;
            ctx.beginPath();
            ctx.moveTo(pos, 0);
            ctx.lineTo(pos, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, pos);
            ctx.lineTo(canvas.width, pos);
            ctx.stroke();
        }
    }

    function drawFood() {
        const x = gameState.food.x * cellSize;
        const y = gameState.food.y * cellSize;

        ctx.font = `${cellSize * 1.2}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentFoodEmoji, x + cellSize / 2, y + cellSize / 2);
    }

    function drawSnake() {
        gameState.snake.forEach((segment, index) => {
            const isHead = index === 0;
            const x = segment.x * cellSize;
            const y = segment.y * cellSize;

            if (isHead) {
                drawSnakeHead(x, y);
            } else {
                const prevSeg = gameState.snake[index - 1];
                const dir = {
                    x: segment.x - prevSeg.x,
                    y: segment.y - prevSeg.y
                };

                let taperFactor = 1;
                const segmentsFromTail = gameState.snake.length - 1 - index;

                if (segmentsFromTail < 5 && gameState.snake.length > 3) {
                    taperFactor = 0.5 + (segmentsFromTail * 0.125);
                }

                const thiccness = (segment.thicc || 1) * taperFactor;
                const isTail = index === gameState.snake.length - 1;
                drawBodySegment(x, y, thiccness, dir, isTail && gameState.snake.length > 5);
            }
        });

        if (gameState.snake.length > 5) {
            drawRattle();
        }
    }

    function drawBodySegment(x, y, thiccness, direction, isTailTip) {
        const centerX = x + cellSize / 2;
        const centerY = y + cellSize / 2;

        ctx.fillStyle = gameState.nirvanaMode ? COLORS.snakeNirvana : COLORS.snakeBody;

        const bodyWidth = 0.9;

        if (thiccness > 1.1) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, cellSize * thiccness * 0.55, 0, Math.PI * 2);
            ctx.fill();

            const scaleSize = cellSize * 0.35 * Math.min(thiccness * 0.8, 1);
            drawDiamond(centerX, centerY, scaleSize);
        } else {
            const widthFactor = bodyWidth * thiccness;

            if (direction.x !== 0) {
                const height = cellSize * widthFactor;
                const offsetY = (cellSize - height) / 2;
                ctx.fillRect(x, y + offsetY, cellSize, height);
            } else {
                const width = cellSize * widthFactor;
                const offsetX = (cellSize - width) / 2;
                ctx.fillRect(x + offsetX, y, width, cellSize);
            }

            if (!isTailTip) {
                const scaleSize = cellSize * 0.35 * Math.min(thiccness, 1);
                drawDiamond(centerX, centerY, scaleSize);
            }
        }
    }

    function drawRattle() {
        const tailIndex = gameState.snake.length - 1;
        const tailSeg = gameState.snake[tailIndex];
        const prevSeg = gameState.snake[tailIndex - 1];

        const rattleDir = {
            x: tailSeg.x - prevSeg.x,
            y: tailSeg.y - prevSeg.y
        };

        const centerX = (tailSeg.x * cellSize) + cellSize / 2;
        const centerY = (tailSeg.y * cellSize) + cellSize / 2;

        const rattleColor = gameState.nirvanaMode ? COLORS.rattleNirvana : COLORS.rattle;
        const stripeColor = gameState.nirvanaMode ? COLORS.snakeNirvana : COLORS.snakeBody;

        for (let i = 0; i < 3; i++) {
            const offset = (i + 1) * cellSize * 0.25;
            const width = cellSize * (0.35 - i * 0.08);
            const height = cellSize * (0.45 - i * 0.1);

            const bulgeX = centerX + rattleDir.x * offset;
            const bulgeY = centerY + rattleDir.y * offset;

            ctx.fillStyle = rattleColor;
            if (rattleDir.x !== 0) {
                ctx.fillRect(bulgeX - width / 2, bulgeY - height / 2, width, height);
            } else {
                ctx.fillRect(bulgeX - height / 2, bulgeY - width / 2, height, width);
            }

            ctx.strokeStyle = stripeColor;
            ctx.lineWidth = 2;
            if (rattleDir.x !== 0) {
                ctx.strokeRect(bulgeX - width / 2, bulgeY - height / 2, width, height);
            } else {
                ctx.strokeRect(bulgeX - height / 2, bulgeY - width / 2, height, width);
            }
        }
    }

    function drawSnakeHead(x, y) {
        const centerX = x + cellSize / 2;
        const centerY = y + cellSize / 2;

        ctx.fillStyle = gameState.nirvanaMode ? COLORS.snakeNirvana : COLORS.snakeBody;
        ctx.beginPath();

        const bulge = 0.1;

        if (gameState.direction.x === 1) {
            ctx.moveTo(x - cellSize * bulge, y - cellSize * bulge);
            ctx.lineTo(x + cellSize * 0.95, y + cellSize * 0.3);
            ctx.lineTo(x + cellSize * 0.95, y + cellSize * 0.7);
            ctx.lineTo(x - cellSize * bulge, y + cellSize + cellSize * bulge);
        } else if (gameState.direction.x === -1) {
            ctx.moveTo(x + cellSize + cellSize * bulge, y - cellSize * bulge);
            ctx.lineTo(x + cellSize * 0.05, y + cellSize * 0.3);
            ctx.lineTo(x + cellSize * 0.05, y + cellSize * 0.7);
            ctx.lineTo(x + cellSize + cellSize * bulge, y + cellSize + cellSize * bulge);
        } else if (gameState.direction.y === 1) {
            ctx.moveTo(x - cellSize * bulge, y - cellSize * bulge);
            ctx.lineTo(x + cellSize * 0.3, y + cellSize * 0.95);
            ctx.lineTo(x + cellSize * 0.7, y + cellSize * 0.95);
            ctx.lineTo(x + cellSize + cellSize * bulge, y - cellSize * bulge);
        } else {
            ctx.moveTo(x - cellSize * bulge, y + cellSize + cellSize * bulge);
            ctx.lineTo(x + cellSize * 0.3, y + cellSize * 0.05);
            ctx.lineTo(x + cellSize * 0.7, y + cellSize * 0.05);
            ctx.lineTo(x + cellSize + cellSize * bulge, y + cellSize + cellSize * bulge);
        }
        ctx.closePath();
        ctx.fill();

        const eyeOffset = cellSize * 0.2;
        ctx.fillStyle = COLORS.eyes;
        if (gameState.direction.y !== 0) {
            ctx.beginPath();
            ctx.arc(centerX - eyeOffset, centerY, cellSize * 0.08, 0, Math.PI * 2);
            ctx.arc(centerX + eyeOffset, centerY, cellSize * 0.08, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(centerX, centerY - eyeOffset, cellSize * 0.08, 0, Math.PI * 2);
            ctx.arc(centerX, centerY + eyeOffset, cellSize * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }

        if (gameState.tongueOut) {
            drawTongue(x, y);
        }
    }

    function drawTongue(x, y) {
        ctx.strokeStyle = COLORS.tongue;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        const tongueLength = cellSize * 0.5;

        let startX = x + cellSize / 2;
        let startY = y + cellSize / 2;

        if (gameState.direction.x === 1) {
            startX = x + cellSize * 0.95;
        } else if (gameState.direction.x === -1) {
            startX = x + cellSize * 0.05;
        } else if (gameState.direction.y === 1) {
            startY = y + cellSize * 0.95;
        } else {
            startY = y + cellSize * 0.05;
        }

        let endX = startX;
        let endY = startY;

        if (gameState.direction.x === 1) {
            endX += tongueLength;
        } else if (gameState.direction.x === -1) {
            endX -= tongueLength;
        } else if (gameState.direction.y === 1) {
            endY += tongueLength;
        } else {
            endY -= tongueLength;
        }

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        const forkSize = cellSize * 0.15;
        ctx.beginPath();
        if (gameState.direction.y === 0) {
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX, endY - forkSize);
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX, endY + forkSize);
        } else {
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - forkSize, endY);
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX + forkSize, endY);
        }
        ctx.stroke();
    }

    function drawDiamond(centerX, centerY, size) {
        ctx.fillStyle = gameState.nirvanaMode ? COLORS.nirvanaSnakeScales : COLORS.snakeScales;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - size);
        ctx.lineTo(centerX + size, centerY);
        ctx.lineTo(centerX, centerY + size);
        ctx.lineTo(centerX - size, centerY);
        ctx.closePath();
        ctx.fill();

        const innerSize = size * 0.6;
        ctx.fillStyle = gameState.nirvanaMode ? COLORS.nirvanaSnakeScalesInner : COLORS.snakeScalesInner;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - innerSize);
        ctx.lineTo(centerX + innerSize, centerY);
        ctx.lineTo(centerX, centerY + innerSize);
        ctx.lineTo(centerX - innerSize, centerY);
        ctx.closePath();
        ctx.fill();
    }

    function draw() {
        drawBackground();
        drawFood();
        drawSnake();
        requestAnimationFrame(draw);
    }

    // ═══════════════════════════════════════════════════════════════
    // 🎮 GAME LOGIC
    // ═══════════════════════════════════════════════════════════════

    function resizeCanvas() {
        cellSize = Math.floor(MAX_CANVAS_SIZE / currentLevel.grid);
        const actualSize = cellSize * currentLevel.grid;
        canvas.width = actualSize;
        canvas.height = actualSize;
    }

    function initGame() {
        const center = Math.floor(currentLevel.grid / 2);
        gameState.snake = [
            { x: center, y: center, thicc: 1 },
            { x: center - 1, y: center, thicc: 1 },
            { x: center - 2, y: center, thicc: 1 }
        ];
        gameState.direction = { x: 1, y: 0 };
        gameState.nextDirection = { x: 1, y: 0 };
        gameState.tongueOut = false;
        gameState.tongueTimer = 0;
        spawnFood();
        updateHUD();
    }

    function spawnFood() {
        let validPosition = false;
        const BUFFER = 2;  // Distance from walls
        const MIN_DISTANCE = 1;  // Distance from snake body
        let attempts = 0;
        const MAX_ATTEMPTS = 1000;  // Safety limit

        while (!validPosition && attempts < MAX_ATTEMPTS) {
            attempts++;

            gameState.food = {
                x: BUFFER + Math.floor(Math.random() * (currentLevel.grid - BUFFER * 2)),
                y: BUFFER + Math.floor(Math.random() * (currentLevel.grid - BUFFER * 2))
            };

            // Check: not ON snake AND not within MIN_DISTANCE
            validPosition = !gameState.snake.some(segment => {
                const dx = Math.abs(segment.x - gameState.food.x);
                const dy = Math.abs(segment.y - gameState.food.y);
                // Manhattan distance
                return (dx + dy) <= MIN_DISTANCE;
            });
        }

        // If no valid position found after MAX_ATTEMPTS, you won Snake!
        if (!validPosition) {
            show404Toast();  // BRICK THE APP - no timeout, stays forever
        } else {
            currentFoodEmoji = getRandomFood();
        }
    }

    function show404Toast() {
        // BRICK THE APP - full screen blue screen that stays until restart
        const blueScreen = document.createElement('div');
        blueScreen.id = 'blueScreen404';
        blueScreen.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0000AA;
            color: #FFFFFF;
            padding: 0;
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.8;
            filter: none !important;
        `;

        blueScreen.innerHTML = `
            <div style="font-size: 48px; font-weight: bold; margin-bottom: 40px; filter: none;">ERROR CODE: 404</div>
            <div style="font-size: 20px; margin-bottom: 20px; filter: none;">You have reached the end.</div>
            <div style="font-size: 24px; font-weight: bold; filter: none;">GO TOUCH GRASS.</div>
        `;

        document.body.appendChild(blueScreen);

        // BRICK IT - stop all game logic
        gameState.isRunning = false;
        clearInterval(gameState.gameLoop);

        playSound('nirvana');
    }

    function updateHUD() {
        document.getElementById('score').textContent = `Score: ${gameState.score}`;
        document.getElementById('level').textContent = `Level: ${gameState.level}`;
    }

    function checkLevelUp() {
        if (gameState.nirvanaMode) return;

        // Find the HIGHEST level where score >= threshold
        const targetLevel = [...levels].reverse().find(level =>
            gameState.score >= level.scoreThreshold
        ) || levels[0];

        if (targetLevel !== currentLevel) {
            gameState.level = levels.indexOf(targetLevel) + 1;
            currentLevel = targetLevel;
            resizeCanvas();
            playSound('levelup');
            updateHUD();

            clearInterval(gameState.gameLoop);
            gameState.gameLoop = setInterval(update, currentLevel.speed);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // 🌌 NIRVANA FUNCTIONS
    // ═══════════════════════════════════════════════════════════════

    function adjustNirvanaSpeed(faster) {
        const speedDelta = 10;  // Smaller increments for fine control
        if (faster && gameState.nirvanaSpeed > 50) {
            gameState.nirvanaSpeed -= speedDelta;
        } else if (!faster && gameState.nirvanaSpeed < 400) {
            gameState.nirvanaSpeed += speedDelta;
        }
        clearInterval(gameState.gameLoop);
        gameState.gameLoop = setInterval(update, gameState.nirvanaSpeed);
        playSound('cheat');
    }

    function adjustSnakeSize(direction) {
        if (direction > 0) {
            // Grow by 1 segment
            const tail = gameState.snake[gameState.snake.length - 1];
            gameState.snake.push({ x: tail.x, y: tail.y, thicc: 1 });
        } else if (direction < 0 && gameState.snake.length > 3) {
            // Shrink by 1 segment (minimum 3 segments)
            gameState.snake.pop();
        }
        playSound('cheat');
    }

    function enterEnlightenment() {
        // Full nirvana mode: immortal, mystical food, controls enabled
        gameState.nirvanaMode = true;
        document.getElementById('nirvanaChoice').style.display = 'none';
        document.body.classList.add('nirvana-mode');

        // Force Level 3 (30x30 grid)
        gameState.level = 3;
        currentLevel = levels[2];
        gameState.nirvanaSpeed = 150;  // Initialize Nirvana speed to Level 3 default
        resizeCanvas();

        updateHUD();
        isPaused = false;

        // Start game loop with Nirvana speed
        clearInterval(gameState.gameLoop);
        gameState.gameLoop = setInterval(update, gameState.nirvanaSpeed);
        gameState.isRunning = true;
        updatePauseButton();

        // Refresh food emoji to mystical
        currentFoodEmoji = getRandomFood();
    }

    function enterBodhisattva() {
        // Return to mortal snake, keep score
        gameState.nirvanaMode = false;
        document.getElementById('nirvanaChoice').style.display = 'none';
        document.body.classList.remove('nirvana-mode');
        updateHUD();
        isPaused = false;
        resumeGame();
        updatePauseButton();

        // Refresh food emoji to mortal food
        currentFoodEmoji = getRandomFood();
    }

    function reincarnate() {
        // Full reset
        document.getElementById('nirvanaChoice').style.display = 'none';

        // Force Level 3 (30x30 grid)
        gameState.level = 3;
        currentLevel = levels[2];

        gameState.nirvanaMode = false;
        document.body.classList.remove('nirvana-mode');
        isPaused = false;
        resizeCanvas();
        initGame();

        // Restart game loop with Level 3 speed
        clearInterval(gameState.gameLoop);
        gameState.gameLoop = setInterval(update, currentLevel.speed);
        gameState.isRunning = true;
        updatePauseButton();
    }

    function reincarnateKeepScore() {
        // Reset snake but keep score and level (start small on big grid)
        const currentScore = gameState.score;
        const currentLevelIndex = gameState.level;

        // Reset snake to 3 segments at center
        const center = Math.floor(currentLevel.grid / 2);
        gameState.snake = [
            { x: center, y: center, thicc: 1 },
            { x: center - 1, y: center, thicc: 1 },
            { x: center - 2, y: center, thicc: 1 }
        ];

        // Reset direction
        gameState.direction = { x: 1, y: 0 };
        gameState.nextDirection = { x: 1, y: 0 };

        // Keep score and level
        gameState.score = currentScore;
        gameState.level = currentLevelIndex;

        // Turn off nirvana mode
        gameState.nirvanaMode = false;
        document.body.classList.remove('nirvana-mode');

        // Spawn new food (healthy food now)
        spawnFood();
        currentFoodEmoji = getRandomFood();

        // Update display
        updateHUD();

        // Resume game with Level 3 speed
        isPaused = false;
        document.getElementById('pauseScreen').style.display = 'none';
        clearInterval(gameState.gameLoop);
        gameState.gameLoop = setInterval(update, currentLevel.speed);
        gameState.isRunning = true;
        updatePauseButton();
    }

    // ═══════════════════════════════════════════════════════════════
    // 🔁 GAME UPDATE LOOP
    // ═══════════════════════════════════════════════════════════════

    function update() {
        if (!gameState.isRunning || isPaused) return;

        gameState.direction = gameState.nextDirection;

        gameState.tongueTimer++;
        if (gameState.tongueTimer > 3) {
            gameState.tongueOut = Math.random() > 0.7;
            gameState.tongueTimer = 0;
        }

        const head = gameState.snake[0];
        const newHead = {
            x: head.x + gameState.direction.x,
            y: head.y + gameState.direction.y,
            thicc: 1
        };

        if (gameState.nirvanaMode) {
            if (newHead.x < 0) newHead.x = currentLevel.grid - 1;
            if (newHead.x >= currentLevel.grid) newHead.x = 0;
            if (newHead.y < 0) newHead.y = currentLevel.grid - 1;
            if (newHead.y >= currentLevel.grid) newHead.y = 0;
        } else {
            if (newHead.x < 0 || newHead.x >= currentLevel.grid ||
                newHead.y < 0 || newHead.y >= currentLevel.grid) {
                gameOver();
                return;
            }

            if (gameState.snake.some(segment =>
                segment.x === newHead.x && segment.y === newHead.y
            )) {
                gameOver();
                return;
            }
        }

        gameState.snake.unshift(newHead);

        if (newHead.x === gameState.food.x && newHead.y === gameState.food.y) {
            gameState.score++;
            updateHUD();

            gameState.snake[0].thicc = 1.8;

            playSound('eat');
            spawnFood();
            checkLevelUp();

            if (gameState.score === 108 && !gameState.nirvanaMode) {
                pauseGame();
                document.getElementById('nirvanaChoice').style.display = 'block';
                playSound('nirvana');
            }

            if (gameState.nirvanaMode && gameState.score > 108 && gameState.score % 108 === 0) {
                pauseGame();
                document.getElementById('nirvanaChoice').style.display = 'block';
            }
        } else {
            gameState.snake.pop();
        }

        for (let i = gameState.snake.length - 1; i > 0; i--) {
            if (gameState.snake[i - 1].thicc > 1) {
                gameState.snake[i].thicc = gameState.snake[i - 1].thicc * 0.92;
                if (gameState.snake[i].thicc < 1.05) gameState.snake[i].thicc = 1;
            }
        }
        if (gameState.snake[0].thicc > 1) {
            gameState.snake[0].thicc *= 0.92;
            if (gameState.snake[0].thicc < 1.05) gameState.snake[0].thicc = 1;
        }

    }

    function gameOver() {
        gameState.isRunning = false;
        clearInterval(gameState.gameLoop);
        // a dead snake is not a save — otherwise reopening resurrects the run
        try { localStorage.removeItem('snek_save'); } catch (e) {}

        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);

        ctx.font = 'bold 72px Arial';
        ctx.fillStyle = '#8FBC3F';
        ctx.fillText(gameState.score, canvas.width / 2, canvas.height / 2 + 20);

        ctx.font = '24px Arial';
        ctx.fillStyle = '#FFD700';
        ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 80);

        // — HALL OF FAME — top 10 scores, kept in localStorage. fresh run glows.
        let hof = [];
        try { hof = JSON.parse(localStorage.getItem('snek.hof')) || []; } catch (e) { hof = []; }
        if (!Array.isArray(hof)) hof = [];
        const entry = { s: gameState.score, when: Date.now() };
        hof.push(entry); hof.sort((a, b) => b.s - a.s); if (hof.length > 10) hof.length = 10;
        try { localStorage.setItem('snek.hof', JSON.stringify(hof)); } catch (e) {}
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = '#FFD700';
        ctx.fillText('🏆 HALL OF FAME', canvas.width / 2, canvas.height / 2 + 122);
        ctx.font = '16px Arial';
        const rowsFit = Math.max(3, Math.floor((canvas.height - (canvas.height / 2 + 140)) / 20));
        for (let i = 0; i < Math.min(hof.length, rowsFit, 10); i++) {
            ctx.fillStyle = hof[i].when === entry.when ? '#8FBC3F' : '#B8A24A';
            ctx.fillText((i + 1) + '.  ' + hof[i].s, canvas.width / 2, canvas.height / 2 + 144 + i * 20);
        }

        gameStarted = false;
        updatePauseButton();
    }

    function pauseGame() {
        gameState.isRunning = false;
        clearInterval(gameState.gameLoop);
    }

    function resumeGame() {
        gameState.isRunning = true;
        gameState.gameLoop = setInterval(update, currentLevel.speed);
    }

    function restart() {
        gameState.score = 0;
        gameState.level = 1;
        currentLevel = levels[0];
        gameState.nirvanaMode = false;
        document.body.classList.remove('nirvana-mode');
        isPaused = false;
        document.getElementById('pauseScreen').style.display = 'none';
        document.getElementById('cheatInput').value = '';
        resizeCanvas();
        initGame();
        updateHUD();
        gameState.isRunning = true;
        clearInterval(gameState.gameLoop);
        gameState.gameLoop = setInterval(update, currentLevel.speed);
        updatePauseButton();
    }

    // ═══════════════════════════════════════════════════════════════
    // ⌨️ CONTROLS — keyboard (absolute) + mouse + scroll-kill
    // ═══════════════════════════════════════════════════════════════

    let gameStarted = false;
    let isPaused = false;

    // absolute steer — a heading vector, guarding the 180° reversal
    function steer(vec) {
        if (!gameState.isRunning || isPaused) return;
        const dir = gameState.direction;

        // can't turn back on the axis you're already travelling
        if (vec.y !== 0 && dir.y === 0) gameState.nextDirection = vec;
        else if (vec.x !== 0 && dir.x === 0) gameState.nextDirection = vec;
    }

    // relative turn — used by mouse. rotate heading 90° (dir committed on tick)
    function turnLeft() {
        if (!gameState.isRunning || isPaused) return;
        const d = gameState.nextDirection;
        gameState.nextDirection = { x: d.y, y: -d.x };
    }

    function turnRight() {
        if (!gameState.isRunning || isPaused) return;
        const d = gameState.nextDirection;
        gameState.nextDirection = { x: -d.y, y: d.x };
    }

    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();

        // arrows + space drive the game — kill their default scroll so the page never drifts
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) e.preventDefault();

        // SECRET: Press N to unlock Nirvana mode
        if (key === 'n' && gameState.isRunning && !gameState.nirvanaMode) {
            gameState.score = 108;
            updateHUD();
            pauseGame();
            document.getElementById('nirvanaChoice').style.display = 'block';
            playSound('nirvana');
            updatePauseButton();
            return;
        }

        // SPACE — start the game the first time
        if (e.key === ' ' && !gameStarted) {
            beginGame();
            return;
        }

        // SPACE — toggle pause once the game is live
        if (e.key === ' ' && gameStarted && gameState.isRunning) {
            togglePause();
            return;
        }

        if (!gameState.isRunning || isPaused) return;

        // absolute steering — arrows AND wasd map to fixed headings
        if (key === 'arrowup' || key === 'w') {
            steer({ x: 0, y: -1 });
        } else if (key === 'arrowdown' || key === 's') {
            steer({ x: 0, y: 1 });
        } else if (key === 'arrowleft' || key === 'a') {
            steer({ x: -1, y: 0 });
        } else if (key === 'arrowright' || key === 'd') {
            steer({ x: 1, y: 0 });
        }
    });

    // playfield mouse — left-click turns left, right-click turns right.
    // preventDefault so a click never selects or scrolls; menu is killed below.
    // CORRECTION 3 Sep 2026 (Sum, on his iPhone: "needs left and right, whichever side of snake to tap — right now it always
    //   turns left"): a tap arrived as a left button, so every tap was a left turn. A tap now turns the snake TOWARD the side
    //   of its heading the tap is on — the cross product of the heading and the head→tap vector, in screen coordinates (y down):
    //   positive = the tap is on the heading's right. Same rule for a desktop left-click; the right button stays a right turn.
    //   touchstart is wired directly (below) so a phone tap is instant and never doubles as an emulated click.
    function turnToward(clientX, clientY) {
        const head = gameState.snake && gameState.snake[0]; if (!head) return;
        const r = canvas.getBoundingClientRect();
        const sx = canvas.width / (r.width || 1), sy = canvas.height / (r.height || 1);
        const px = (clientX - r.left) * sx, py = (clientY - r.top) * sy;
        const hx = (head.x + 0.5) * cellSize, hy = (head.y + 0.5) * cellSize;
        const d = gameState.direction;
        const cross = d.x * (py - hy) - d.y * (px - hx);
        if (cross > 0) turnRight(); else if (cross < 0) turnLeft();   // dead ahead / behind (cross 0): no turn
    }
    canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (!gameStarted) { beginGame(); return; }
        if (e.button === 0) turnToward(e.clientX, e.clientY);   // tap / left button → toward the tapped side
        else if (e.button === 2) turnRight();                    // right button → turn right
    });
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches && e.touches[0]; if (!t) return;
        if (!gameStarted) { beginGame(); return; }
        turnToward(t.clientX, t.clientY);
    }, { passive: false });

    // kill the right-click menu on the field so right = steer, never a menu
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ═══════════════════════════════════════════════════════════════
    // ⏸ PAUSE — button + screen + cheats (one shared state)
    // ═══════════════════════════════════════════════════════════════

    // start / resume — shared by SPACE, the pause button, and a board tap
    function beginGame() {
        gameStarted = true;
        document.getElementById('startToast').style.display = 'none';
        if (hasSavedState) {
            hasSavedState = false;
            isPaused = false;
            gameState.isRunning = true;
            document.getElementById('pauseScreen').style.display = 'none';
            clearInterval(gameState.gameLoop);
            gameState.gameLoop = setInterval(update, currentLevel.speed);
        } else {
            restart();
        }
        updatePauseButton();
    }

    // toggle the pause box — dims the field, holds the cheat field + nirvana rows
    function togglePause() {
        isPaused = !isPaused;
        if (isPaused) {
            document.getElementById('pauseScreen').style.display = 'block';
            document.getElementById('cheatInput').focus();

            // Show nirvana controls if in nirvana mode
            if (gameState.nirvanaMode) {
                document.getElementById('nirvanaControlsInPause').style.display = 'block';
                document.getElementById('reincarnateButtonGroup').style.display = 'block';
            } else {
                document.getElementById('nirvanaControlsInPause').style.display = 'none';
                document.getElementById('reincarnateButtonGroup').style.display = 'none';
            }
        } else {
            document.getElementById('pauseScreen').style.display = 'none';
        }
        updatePauseButton();
    }

    // the on-screen button — same state as SPACE: start, else toggle pause
    document.getElementById('pauseBtn').addEventListener('click', () => {
        if (!gameStarted) { beginGame(); return; }
        if (gameState.isRunning) togglePause();
    });

    // the pause-box "Continue" button — leave the pause state cleanly
    function resumeFromPause() {
        isPaused = false;
        document.getElementById('pauseScreen').style.display = 'none';
        document.getElementById('cheatInput').value = '';
        updatePauseButton();
    }

    // cheat field: n → nirvana · t → +10 score +10 tail · r → restart
    document.getElementById('cheatInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        if (val.includes('n')) {
            gameState.score = 108;
            updateHUD();
            pauseGame();
            document.getElementById('pauseScreen').style.display = 'none';
            document.getElementById('nirvanaChoice').style.display = 'block';
            playSound('nirvana');
            e.target.value = '';
        }
        if (val.includes('t')) {
            gameState.score += 10;
            const tail = gameState.snake[gameState.snake.length - 1];
            for (let i = 0; i < 10; i++) {
                gameState.snake.push({ x: tail.x, y: tail.y, thicc: 1 });
            }
            updateHUD();
            checkLevelUp();
            playSound('cheat');
            e.target.value = '';
        }
        if (val.includes('r')) {
            restart();
            e.target.value = '';
        }
    });

    // paint the button face to match state — ⏸ while playing, ▶ while paused
    function updatePauseButton() {
        const btn = document.getElementById('pauseBtn');
        btn.textContent = gameState.isRunning && !isPaused ? '⏸' : '▶';
    }

    // ═══════════════════════════════════════════════════════════════
    // 💾 SAVE / LOAD
    // ═══════════════════════════════════════════════════════════════

    let hasSavedState = false;

    function saveSnake() {
        if (!gameStarted || !gameState.snake.length) return;
        try {
            localStorage.setItem('snek_save', JSON.stringify({
                snake: gameState.snake,
                direction: gameState.direction,
                nextDirection: gameState.nextDirection,
                food: gameState.food,
                score: gameState.score,
                level: gameState.level,
                nirvanaMode: gameState.nirvanaMode,
                nirvanaSpeed: gameState.nirvanaSpeed
            }));
        } catch(e) {}
    }

    function loadSavedState() {
        try {
            var raw = localStorage.getItem('snek_save');
            if (!raw) return false;
            var g = JSON.parse(raw);
            if (!g.snake || g.snake.length === 0) return false;
            gameState.snake       = g.snake;
            gameState.direction   = g.direction;
            gameState.nextDirection = g.nextDirection;
            gameState.food        = g.food;
            gameState.score       = g.score;
            gameState.level       = g.level;
            gameState.nirvanaMode = g.nirvanaMode;
            gameState.nirvanaSpeed = g.nirvanaSpeed || 150;
            return true;
        } catch(e) { return false; }
    }

    // persist on the way out — and on tab-away/hide, which the native shell
    // fires far more reliably than beforeunload on quit.
    window.addEventListener('beforeunload', saveSnake);
    window.addEventListener('pagehide', saveSnake);
    document.addEventListener('visibilitychange', function () { if (document.hidden) saveSnake(); });

    // ═══════════════════════════════════════════════════════════════
    // 🚀 GAME INITIALIZATION
    // ═══════════════════════════════════════════════════════════════

    resizeCanvas();
    initGame();
    if (loadSavedState()) {
        hasSavedState = true;

        // a save may carry a non-default level / nirvana — re-fit the board to it
        currentLevel = levels[Math.min(gameState.level - 1, levels.length - 1)] || levels[0];
        if (gameState.nirvanaMode) document.body.classList.add('nirvana-mode');
        resizeCanvas();
        updateHUD();
        document.getElementById('startToast').innerHTML =
            'saved game found 🐍<br>tap the board or press space to resume';
    }
    draw();
    gameState.isRunning = false;
    gameState.gameLoop = setInterval(update, currentLevel.speed);
    updatePauseButton();
</script>
</body>
</html>
